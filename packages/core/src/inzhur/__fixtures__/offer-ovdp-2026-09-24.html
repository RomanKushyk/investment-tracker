ня угоди цінні папери автоматично з’являться у вашому кабінеті.",null,{"id":31,"officeButton":32,"registrationBannerText":33,"fundSold":34},2,"У кабінет","Особистий кабінет — це твій пункт управління інвестиціями з Inzhur: тут ти купуєш і продаєш сертифікати, поповнюєш баланс для нових інвестицій і бачиш всю аналітику — скільки сертифікатів є у твоєму володінні, скільки вільних грошей на балансі тощо. А ще саме тут знаходиться твоє унікальне посилання для запрошення друзів до інвестування з Inzhur:)","Сертифікати фонду розпродано",{"id":36,"name":37,"iban":38,"edrpou":39},1,"ТОВ «ІНЖУР КЕПІТАЛ»","UA553071230000026504020119504","36301402",[41,45,50,55],{"id":42,"title":43,"url":10,"icon":44,"isEnabled":7},19,"Telegram","telegram",{"id":46,"title":47,"url":48,"icon":49,"isEnabled":7},20,"YouTube","https://www.youtube.com/channel/UCizm4WrZeuwFwtfT8c6Yemw","youtube",{"id":51,"title":52,"url":53,"icon":54,"isEnabled":7},21,"Instagram","https://www.instagram.com/inzhur_reit?igsh=MW9nbm95d2p4aDJ6","instagram",{"id":31,"title":56,"url":57,"icon":58,"isEnabled":7},"Facebook","https://www.facebook.com/InzhurREIT","facebook",{"id":36,"accountOpening":60,"docSharingWhyThisData":61,"questionnaireWhyThisData":62,"fundAssetValueGrowth":63,"fundDividendLiquidity":64,"userAssetValue":65,"userDividendValue":66,"investorsChat":67,"docSharingNoDiia":68,"purchaseOrdersLocation":69,"lastBusinessDayPurchase":70,"userBonusesAvailable":71,"crsWhyThisData":29,"fundSaleAmount":29,"fundSaleTiming":72,"bankIdWhyThisData":29,"fundNetAssetValue":73,"fatcaWhyThisData":29,"minInvest":29,"fundSold":74,"userInvestedValue":29,"bondReturnRate":75,"bondIsin":76,"bondSpecialOffer":77,"bondYield":78,"bondMaturityDate":79,"bondSpread":80,"bondInfo":81,"bondPurchase":82},"Для того, щоб придбати інвестиційні сертифікати та стати щасливим співвласником, необхідно відкрити рахунок у цінних паперах, а також приєднатися до Умов та правил надання фінансових послуг Inzhur.","Якщо ви поширите свої дані через Дію, ми зможемо занести їх в анкету-заяву про приєднання до Умов та правил надання фінансових послуг Inzhur, а також верифікувати вас онлайн за лічені хвилини.","Ми маємо занести ваші контактні дані в анкету-заяву про приєднання до Умов та правил надання фінансових послуг Inzhur. Формальність, але без неї ніяк.","Дохідність за весь час володіння цінними паперами. Вона враховує зміну ціни сертифіката, отримані дивіденди та прибуток від продажу. Розрахована за формулою XIRR з урахуванням періоду володіння.\n\nПоки інвестор не отримав прибутку (наприклад, дивідендів або грошей від продажу), дохідність може показувати нуль. Як тільки з'явиться перший прибуток — значення оновиться.","Середня річна дохідність за весь час існування фонду","Поточна вартість активів по ціні продажу + вільні для доінвестування кошти","Сума дивідендів, виплачених у вибраний період","Станьте частиною інвестиційного спільноти Inzhur!\n\nІнвестуйте в будь-який з наших фондів від 4 000 ₴ і отримайте доступ до закритого чату інвесторів.\n\nТут ви будете отримувати останні новини, мати можливість купувати та продавати сертифікати, а також знаходити підтримку у спільноті однодумців.\n\nОчікуємо на вас!","Якщо ви не маєте документів в Дії, ми запропонуємо провести відеодзвінок в зручному для вас каналі та пройти відеоідентифікацію. Займає 5 хвилин вашого часу, при собі треба мати оригінал паспорту та ІПН","Відмінити попередню заявку можна на головній сторінці вашого особистого кабінету, у вкладці «Мої заявки», натиснувши «Скасувати заявку»","Якщо ви не зможете провести оплату до вказаного часу, або ж банк зарахує платіж пізніше — купівля цінних паперів відбудеться за ціною актуальною на перший робочий день наступного місяця. Залишок коштів буде на брокерському рахунку.","Бонуси зараховані після автоматичної сплати 23% податків","Якщо ваша заявка сформована пізніше, або у вихідний день - викуп буде проведено в найближчий робочий день.","Вартість викупу сертифікатів, якщо подати заявку на продаж","Наразі 100% сертифікатів цього фонду викуплені інвесторами та знаходяться в їхніх портфелях. Можливість придбання може з’явитися у разі нової емісії цінних паперів фонду. Перевір доступність інвестування у фонд пізніше.","Дохідність розраховано згідно сьогоднішньої ціни ОВДП за формулою YTM (дохідність до погашення).","International Securities Identification Number (ISIN) — міжнародний ідентифікаційний номер цінного папера. Це ідентифікатор усього конкретного випуску ОВДП.","Короткострокові ОВДП з унікальними умовами від Inzhur: без спреду, без комісій та націнок, з найкращою дохідністю на ринку та найкоротшими термінами погашення серед аналогів.","У каталозі Inzhur для облігацій може бути вказано як дохідність YTM, так і дохідність SIM:\n\nYTM (Yield to Maturity) — розрахуновий річний відсоток, який інвестор отримає за цією облігацією, якщо утримає її до дати погашення.\n\nSIM (Simple Interest Method) — простий відсоток для тих облігацій, у яких залишився один купонний платіж до дати погашення.","Дата повернення інвестору номінальної вартості облігацій разом з останнім купоном.","Подвійний показник:\n\nПродаж — вартість 1 облігації даного випуску у разі дострокового (до дати погашення) виходу з інвестиції.\n\nСпред — різниця між ціною купівлі та ціною продажу 1 облігації даного випуску у разі дострокового (до дати погашення) виходу з інвестиції.","Облігації внутрішньої державної позики: цінні папери, що випускаються Міністерством фінансів України і на 100% гарантовані державою. Експерти Inzhur вручну створюють для тебе найкращий каталог ОВДП в Україні: у нашому списку ти обов’язково знайдеш цікавий для тебе випуск — за ціною, дохідністю, спредом, датою погашення.","Номінальна вартість 1 цінного паперу даного випуску облігацій. В день погашення вона повертається інвестору, разом з останнім купоном.",{"id":36,"title":84,"text":85,"isActiveForAllCategories":7},"Застереження!","Результати діяльності фонду у минулому не є гарантією доходів в майбутньому. Дохід не є гарантованим.", previewUrl&quot;:[0,null],&quot;provider&quot;:[0,&quot;custom-s3-upload-provider&quot;],&quot;provider_metadata&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2026-09-22T03:52:46.023Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-09-22T03:52:46.023Z&quot;]}]}]}],&quot;caption&quot;:[0,{&quot;id&quot;:[0,38],&quot;title&quot;:[0,&quot;Андрій Журжій&quot;],&quot;description&quot;:[0,&quot;/ Засновник та СЕО Inzhur&quot;],&quot;subtitle&quot;:[0,null],&quot;mobileTitle&quot;:[0,null],&quot;mobileDescription&quot;:[0,null]}]}]}]}]}],[0,{&quot;id&quot;:[0,41],&quot;__component&quot;:[0,&quot;sections.faq&quot;],&quot;title&quot;:[0,&quot; &quot;],&quot;backgroundColor&quot;:[0,&quot;basic&quot;],&quot;header&quot;:[0,{&quot;id&quot;:[0,116],&quot;title&quot;:[0,&quot;Довідник Inzhur&quot;],&quot;description&quot;:[0,&quot;Все найголовніше про інвестування в облігації з Inzhur.&quot;],&quot;subtitle&quot;:[0,null],&quot;mobileTitle&quot;:[0,&quot;Довідник Inzhur&quot;],&quot;mobileDescription&quot;:[0,&quot;Все найголовніше про інвестування в облігації з Inzhur.&quot;]}],&quot;button&quot;:[0,{&quot;id&quot;:[0,1407],&quot;name&quot;:[0,&quot;Всі питання та відповіді про облігації&quot;],&quot;target&quot;:[0,&quot;_self&quot;],&quot;action&quot;:[0,&quot;/handbook&quot;],&quot;icon&quot;:[0,null]}],&quot;questions&quot;:[0,{&quot;data&quot;:[1,[[0,{&quot;id&quot;:[0,499],&quot;attributes&quot;:[0,{&quot;title&quot;:[0,&quot;Як працює Спеціальна пропозиція Inzhur з ОВДП? У чому переваги?&quot;],&quot;text&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;https://www.inzhur.reit/offer/ovdp\&quot;&gt;&lt;strong&gt;Спеціальна пропозиція Inzhur з ОВДП&lt;/strong&gt;&lt;/a&gt; &amp;nbsp;— це ідеальна заміна депозитам для тих, хто хоче інвестувати короткостроково, а потім виходити з інвестиції достроково та без спреду (ціна купівлі та продажу протягом дня не відрізняються).&lt;/p&gt;&lt;p&gt;Це виглядає так:&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Inzhur пропонує інвесторам короткострокові випуски ОВДП за ціною аукціону Мінфіну України&lt;/strong&gt;. Такі випуски&amp;nbsp;&lt;a href=\&quot;https://www.inzhur.reit/offer/ovdp\&quot;&gt;на сайті&lt;/a&gt;&amp;nbsp;та в застосунку (&lt;a href=\&quot;https://inzhur.onelink.me/1RCF/ow5l2fjw\&quot;&gt;iOS&lt;/a&gt;,&amp;nbsp;&lt;a href=\&quot;https://inzhur.onelink.me/1RCF/hmy2ntsx\&quot;&gt;Android&lt;/a&gt;)&amp;nbsp;Inzhur позначені як «Спеціальна пропозиція».&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Інвестор Inzhur купує облігації за Спеціальною пропозицією&lt;/strong&gt; — і заробляє на річному відсотку дохідності випуску. Якщо він утримає облігації до дати погашення, то зможе досягти показника річних в YTM — тобто максимального рівня дохідності цього випуску.&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Інвестор Inzhur може швидко продати придбані облігації в будь-який зручний час до дати погашення&lt;/strong&gt; — і заробити за ту кількість днів, протягом яких він володів облігацією. Навіть купивши сьогодні й продавши завтра, інвестор заробляє за 1 день, адже ціна облігації щодня змінюється з урахуванням НКД (накопиченого купонного доходу).&lt;/p&gt;&lt;p&gt;Жодних комісій та націнок при купівлі чи достроковому виході з інвестиції — це максимально вигідно, і саме тому ми називаємо Спеціальну пропозицію Inzhur вбивцею депозитів:)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;❗️Важливо&lt;/strong&gt;. Inzhur здатний запропонувати найкращі умови на ринку ОВДП, бо маржа компанії не закладена ні в ціну, ні в рівень прибутковості. Inzhur заробляє в іншому — на винагороді за управління активами фондів нерухомості: чим більше заробляє фонд, тим більша винагорода Inzhur у грошовому вимірі. Вкладаючи залучені інвестиції фондів у короткострокові ОВДП на аукціонах Мінфіну під 16-17%, Inzhur додатково заробляє для фондів 2,5-3% річних — у порівнянні з банківськими відсотками на залишок, які приносили б фондам 13,5%-14% річних. Отже, продаючи ці ж цінні папери інвесторам, Inzhur забезпечує для фондів можливість краще керувати власною ліквідністю і отримувати кращу дохідність.&lt;/p&gt;&quot;],&quot;videoURL&quot;:[0,null],&quot;forCorporate&quot;:[0,true],&quot;forCabinet&quot;:[0,true],&quot;createdAt&quot;:[0,&quot;2026-01-22T12:20:50.787Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-09-22T03:01:42.832Z&quot;],&quot;publishedAt&quot;:[0,&quot;2026-04-09T15:51:13.647Z&quot;],&quot;keywords&quot;:[0,null],&quot;chapter&quot;:[0,{&quot;data&quot;:[0,{&quot;id&quot;:[0,18],&quot;attributes&quot;:[0,{&quot;subtitle&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2025-03-12T12:04:56.424Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-09-22T03:06:20.776Z&quot;],&quot;name&quot;:[0,&quot;ОВДП&quot;],&quot;rank&quot;:[0,4]}]}]}],&quot;relatedChapter&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;article&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;generalDocuments&quot;:[0,{&quot;data&quot;:[1,[]]}]}]}],[0,{&quot;id&quot;:[0,402],&quot;attributes&quot;:[0,{&quot;title&quot;:[0,&quot;Що таке ОВДП?&quot;],&quot;text&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;Облігації Внутрішніх Державних Позик.&lt;/strong&gt; Це державні цінні папери, які випускає уряд країни в особі Міністерства фінансів.&amp;nbsp;&lt;br&gt;&lt;br&gt;👉 Через них держава залучає ресурси громадян, що потім ідуть на підтримку економіки та зокрема, воєнних потреб країни.&amp;nbsp;&lt;br&gt;&lt;br&gt;👉 Кошти, зібрані через цей механізм, витрачаються на закупівлю озброєння, техніки та інших товарів для оборони країни, а також соціальні програми.&lt;/p&gt;&quot;],&quot;videoURL&quot;:[0,null],&quot;forCorporate&quot;:[0,true],&quot;forCabinet&quot;:[0,true],&quot;createdAt&quot;:[0,&quot;2025-03-12T11:55:35.936Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-09-22T03:02:09.330Z&quot;],&quot;publishedAt&quot;:[0,&quot;2025-03-12T11:55:39.681Z&quot;],&quot;keywords&quot;:[0,null],&quot;chapter&quot;:[0,{&quot;data&quot;:[0,{&quot;id&quot;:[0,18],&quot;attributes&quot;:[0,{&quot;subtitle&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2025-03-12T12:04:56.4
