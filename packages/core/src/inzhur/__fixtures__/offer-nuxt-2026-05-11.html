"https://api.whatsapp.com/send?phone=380671410070",true,"+38 044 290 76 85","info@inzhur.reit",{"id":49,"officeButton":63,"registrationBannerText":64,"registrationBannerImage":65},"У кабінет","Особистий кабінет — це твій пункт управління інвестиціями з Inzhur: тут ти купуєш і продаєш сертифікати, поповнюєш баланс для нових інвестицій і бачиш всю аналітику — скільки сертифікатів є у твоєму володінні, скільки вільних грошей на балансі тощо. А ще саме тут знаходиться твоє унікальне посилання для запрошення друзів до інвестування з Inzhur:)",{"id":66,"uploadDestination":67,"uploadPath":68,"name":69,"alternativeText":70,"caption":70,"width":71,"height":72,"formats":73,"hash":83,"ext":75,"mime":78,"size":84,"url":85,"previewUrl":70,"provider":86,"provider_metadata":70,"createdAt":87,"updatedAt":87},30599,"default","","signup_banner_cd4cd2c617.webp",null,468,459,{"thumbnail":74},{"ext":75,"url":76,"hash":77,"mime":78,"name":79,"path":70,"size":80,"width":81,"height":82},".webp","https://d2zk2gr3fhkmim.cloudfront.net/thumbnail_signup_banner_cd4cd2c617_f88665c0db.webp","thumbnail_signup_banner_cd4cd2c617_f88665c0db","image/webp","thumbnail_signup_banner_cd4cd2c617.webp",10.41,159,156,"signup_banner_cd4cd2c617_f88665c0db",42.07,"https://d2zk2gr3fhkmim.cloudfront.net/signup_banner_cd4cd2c617_f88665c0db.webp","custom-s3-upload-provider","2024-05-09T17:21:15.576Z",{"id":49,"docSharingVideo":89,"docSignVideo":89,"dashboardGuide":70,"docSharingVideoBankId":70},"https://www.youtube.com/embed/oKrpQ0UU29o?si=aU9TV9NcUU9vMAsE",[91,95,100,105],{"id":92,"title":93,"url":50,"icon":94,"isEnabled":70},19,"Telegram","telegram",{"id":96,"title":97,"url":98,"icon":99,"isEnabled":70},20,"YouTube","https://www.youtube.com/channel/UCizm4WrZeuwFwtfT8c6Yemw","youtube",{"id":101,"title":102,"url":103,"icon":104,"isEnabled":70},21,"Instagram","https://www.instagram.com/inzhur_reit?igsh=MW9nbm95d2p4aDJ6","instagram",{"id":49,"title":106,"url":107,"icon":108,"isEnabled":70},"Facebook","https://www.facebook.com/InzhurREIT","facebook",{"id":110,"name":111,"iban":112,"edrpou":113},1,"ТОВ «ІНЖУР КЕПІТАЛ»","UA553071230000026504020119504","36301402",{"id":110,"accountOpening":115,"docSharingWhyThisData":116,"questionnaireWhyThisData":117,"fundAssetValueGrowth":118,"fundDividendLiquidity":119,"userAssetValue":120,"userDividendValue":121,"investorsChat":122,"docSharingNoDiia":123,"purchaseOrdersLocation":124,"lastBusinessDayPurchase":125,"userBonusesAvailable":126,"crsWhyThisData":70,"fundSaleAmount":70,"fundSaleTiming":127,"bankIdWhyThisData":70,"fundNetAssetValue":128,"fatcaWhyThisData":70,"minInvest":70,"fundSold":129,"userInvestedValue":70,"bondReturnRate":130,"returnRates":131},"Для того, щоб придбати інвестиційні сертифікати та стати щасливим співвласником, необхідно відкрити рахунок у цінних паперах, а також приєднатися до Умов та правил надання фінансових послуг Inzhur.","Якщо ви поширите свої дані через Дію, ми зможемо занести їх в анкету-заяву про приєднання до Умов та правил надання фінансових послуг Inzhur, а також верифікувати вас онлайн за лічені хвилини.","Ми маємо занести ваші контактні дані в анкету-заяву про приєднання до Умов та правил надання фінансових послуг Inzhur. Формальність, але без неї ніяк.","Дохідність за весь час володіння цінними паперами. Вона враховує зміну ціни сертифіката, отримані дивіденди та прибуток від продажу. Розрахована за формулою XIRR з урахуванням періоду володіння.\n\nПоки інвестор не отримав прибутку (наприклад, дивідендів або грошей від продажу), дохідність може показувати нуль. Як тільки з'явиться перший прибуток — значення оновиться.","Середня річна дохідність за весь час існування фонду","Поточна вартість активів по ціні продажу + вільні для доінвестування кошти","Сума дивідендів, виплачених у вибраний період","Станьте частиною інвестиційного спільноти Inzhur!\n\nІнвестуйте в будь-який з наших фондів від 4 000 ₴ і отримайте доступ до закритого чату інвесторів.\n\nТут ви будете отримувати останні новини, мати можливість купувати та продавати сертифікати, а також знаходити підтримку у спільноті однодумців.\n\nОчікуємо на вас!","Якщо ви не маєте документів в Дії, ми запропонуємо провести відеодзвінок в зручному для вас каналі та пройти відеоідентифікацію. Займає 5 хвилин вашого часу, при собі треба мати оригінал паспорту та ІПН","Відмінити попередню заявку можна на головній сторінці вашого особистого кабінету, у вкладці «Мої заявки», натиснувши «Скасувати заявку»","Якщо ви не зможете провести оплату до вказаного часу, або ж банк зарахує платіж пізніше — купівля цінних паперів відбудеться за ціною актуальною на перший робочий день наступного місяця. Залишок коштів буде на брокерському рахунку.","Бонуси зараховані після автоматичної сплати 23% податків","Якщо ваша заявка сформована пізніше, або у вихідний день - викуп буде проведено в найближчий робочий день.","Вартість викупу сертифікатів, якщо подати заявку на продаж","Ти можеш знайти співвласників, які хотіли б продати свої сертифікати через закритий приватний Telegram-чат співвласників «Спільнота Inzhur»: у чаті є окрема гілка для перепродажу сертифікатів, рекордний час пошуку продавця — 1 хвилина.\n\nСертифікати деяких фондів Inzhur рідко бувають у вільному доступі, тому в цьому чаті їх можна спробувати знайти на вторинному ринку, а якщо ти сам володієш такими — то продати дорожче:)","Дохідність розраховано згідно сьогоднішньої ціни ОВДП за формулою YTM (дохідність до погашення).",{"id":110,"XIRR":132,"ROI":133,"Default":70},"Дохідність за весь час володіння цінними паперами. Вона враховує зміну ціни сертифіката, отримані дивіденди та прибуток від продажу. Розрахована за формулою XIRR з урахуванням періоду володіння.\nПоки інвестор не отримав прибутку (наприклад, дивідендів або грошей від продажу), дохідність рахується за ROI. Як тільки з'явиться перший прибуток — формула оновиться.","Дохідність розраховується за формулою ROI – це відношення проінвестованих коштів до поточної вартості сертифіката.\nПісля отримання позитивного грошового потоку (отримання дивідендів або продаж сертифікатів) дохідність буде рахуватись за формулою XIRR.",{"id":110,"title":135,"text":136,"button":137,"image":142},"Вітаємо у спільноті інвесторів Inzhur!","Залишилося поповнити рахунок і почати інвестувати. Обирай одну або кілька пропозицій Inzhur, керуй своїм інвестиційним портфелем, купуй і продавай сертифікати в будь-який час — ти інвестор і можеш все🙂\n\nМи підготували для тебе покрокову інструкцію з поповнення рахунку та першої інвестиції — натисни на кнопку, якщо хочеш із нею ознайомитися. Дякуємо за довіру!",{"id":138,"name":139,"target":140,"action":141,"icon":70},779,"Переглянути інструкцію","_blank","https://www.inzhur.reit/blog/gajd-inzhur-popovnennya-rahunku-ta-persha-investicziya-1",{"id":143,"uploadDestination":67,"uploadPath":68,"name":144,"alternativeText":70,"caption":70,"width":145,"height":145,"formats":146,"hash":154,"ext":148,"mime":151,"size":155,"url":156,"previewUrl":70,"provider":86,"provider_metadata":70,"createdAt":157,"updatedAt":157},1023048,"welcome-banner.png",342,{"thumbnail":147},{"ext":148,"url":149,"hash":150,"mime":151,"name":152,"path":70,"size":153,"width":82,"height":82},".png","https://d2zk2gr3fhkmim.cloudfront.net/thumbnail_welcome_banner_bd5a07ea67.png","thumbnail_welcome_banner_bd5a07ea67","image/png","thumbnail_welcome-banner.png",15.76,"welcome_banner_bd5a07ea67",16.92,"https://d2zk2gr3fhkmim.cloudfront.net/welcome_banner_bd5a07ea67.png","2026-01-16T06:32:34.808Z",{"id":49,"title":70,"text":159,"button":160,"image":164},"Тобі доступна приватна Telegram-спільнота інвесторів Inzhur! \nСпілкування з понад \u003Cb>21 тисячею\u003C/b> реальних інвесторів та СЕО Inzhur \u003Cb>Андрієм Журжієм\u003C/b>, швидкі відповіді від нашої служби підтримки — просто натисни кнопку й отримай усе це.",{"id":161,"name":162,"target":140,"action":163,"icon":70},778,"Приєднатися","https://t.me/+qRSEVGPxaoJiZWI6",{"id":165,"uploadDestination":67,"uploadPath":68,"name":166,"alternativeText":70," кати пару годин робочого дня — і фонд викупить сертифікати за актуальною ціною продажу, зазначеною в твоєму кабінеті, зарахувавши кошти.","energy-green",{"id":4120,"uploadDestination":67,"uploadPath":68,"name":4121,"alternativeText":70,"caption":70,"width":1000,"height":4122,"formats":4123,"hash":4130,"ext":148,"mime":151,"size":4131,"url":4132,"previewUrl":70,"provider":86,"provider_metadata":70,"createdAt":4133,"updatedAt":4133},1181115,"image 25.png",357,{"thumbnail":4124},{"ext":148,"url":4125,"hash":4126,"mime":151,"name":4127,"path":70,"size":4128,"width":4129,"height":82},"https://d2zk2gr3fhkmim.cloudfront.net/thumbnail_image_25_ee2406db10.png","thumbnail_image_25_ee2406db10","thumbnail_image 25.png",18.82,165,"image_25_ee2406db10",18.59,"https://d2zk2gr3fhkmim.cloudfront.net/image_25_ee2406db10.png","2026-02-04T10:42:19.417Z",{"id":110,"__component":4135,"title":4136,"description":4137,"backgroundColor":795,"image":4138,"button":4159,"items":4162},"sections.gift-certificate-new","Подарункові сертифікати Inzhur 🎉","Комерційна нерухомість з фондом Inzhur REIT — відмінний подарунок для сім'ї, друзів і колег 😉\nЗроби приємний сюрприз — подаруй інвестицію та довгостроковий прибуток!",{"id":4139,"uploadDestination":67,"uploadPath":68,"name":4140,"alternativeText":70,"caption":70,"width":4141,"height":4142,"formats":4143,"hash":4155,"ext":148,"mime":151,"size":4156,"url":4157,"previewUrl":70,"provider":86,"provider_metadata":70,"createdAt":4158,"updatedAt":4158},515720,"серт_новий.png",590,620,{"small":4144,"thumbnail":4150},{"ext":148,"url":4145,"hash":4146,"mime":151,"name":4147,"path":70,"size":4148,"width":4149,"height":241},"https://d2zk2gr3fhkmim.cloudfront.net/small_sert_novij_ecb9b61905.png","small_sert_novij_ecb9b61905","small_серт_новий.png",100.05,476,{"ext":148,"url":4151,"hash":4152,"mime":151,"name":4153,"path":70,"size":4154,"width":493,"height":82},"https://d2zk2gr3fhkmim.cloudfront.net/thumbnail_sert_novij_ecb9b61905.png","thumbnail_sert_novij_ecb9b61905","thumbnail_серт_новий.png",16.19,"sert_novij_ecb9b61905",37.57,"https://d2zk2gr3fhkmim.cloudfront.net/sert_novij_ecb9b61905.png","2025-10-06T17:39:46.013Z",{"id":4160,"name":4161,"target":140,"action":51,"icon":70},294,"Хочу придбати",[4163,4166],{"id":110,"title":4164,"text":4165},"Щоб купити подарунковий сертифікат, треба:","👉 Перейти до Telegram-боту Inzhur \u003Ca href=\"https://t.me/InzhurREIT_bot\" target=\"_blank\">за посиланням\u003C/a> та натиснути в головному меню кнопку «Подарунковий 🎁»\n\n👉 Натиснути на кнопку “Хочу придбати” та виконати подальші інструкції.",{"id":49,"title":4167,"text":4168},"Щоб активувати сертифікат, одержувачу подарунка треба:","👉 Відкрити рахунок в цінних паперах \u003Ca href=\"https://www.inzhur.reit/signin\" target=\"_blank\">в особистому кабінеті\u003C/a> на сайті — це швидко й безкоштовно. \n\n👉 Перейти до Telegram-боту Inzhur \u003Ca href=\"https://t.me/InzhurREIT_bot\" target=\"_blank\">за посиланням\u003C/a>, вибрати розділ «Подарунковий», ввести унікальний код сертифіката.\n \n🎉 І після швидкої активації сертифікат почне заробляти!",{"id":1972,"__component":4170,"active":59,"subtitle":4171,"defaultCategory":4172,"categoriesList":4173},"sections.documents","Тут можна ознайомитися з усіма документами, що стосуються діяльності фонду Inzhur REIT — і знаходяться у відкритому доступі.",{"id":92,"title":2563},[4174,4175,4176,4178],{"id":92,"title":2563},{"id":632,"title":2977},{"id":778,"title":4177},"Загальні відомості, ліцензії та реєстраційні документи ТОВ «ІНЖУР КЕПІТАЛ»",{"id":96,"title":4179},"Архів",{"id":1473,"__component":4181,"title":4182,"subtitle":70,"backgroundColor":3331,"videos":4183,"questions":4184,"button":4236},"sections.video-faq","Довідник Inzhur",[],[4185,4190,4200,4209,4218,4227],{"id":4186,"title":3371,"text":4187,"videoURL":70,"forCorporate":59,"forCabinet":59,"createdAt":4188,"updatedAt":4188,"publishedAt":70,"keywords":70,"chapter":70,"article":70,"generalDocuments":4189},438,"\u003Cp>\u003Cstrong>Inzhur REIT — це пайовий інвестиційний фонд. \u003C/strong>Його метою є інвестування у: нерухомість, земельні ділянки, корпоративні права товариств, будівництво нових об’єктів, корпоративні облігації та в облігації внутрішніх державних позик.\u003Cbr>\u003Cbr>Фонд Inzhur REIT був створений при об'єднанні попередніх фондів Inzhur, щоб забезпечити інвесторам і компанії такі переваги:\u003Cbr>\u003Cbr>👉 Краща ліквідність.\u003Cbr>👉 Багато інвесторів.\u003Cbr>👉 Максимальна диверсифікація — всередині фонду.\u003Cbr>👉 Нівелювання значного впливу нових будівництв на прибутковість поточних інвесторів.\u003Cbr>👉 Краща прибутковість на вкладений капітал.\u003Cbr>👉 Підвищення спроможності займатися інвестуванням у комерційну нерухомість найвищого рівня.\u003Cbr>\u003Cbr>І все це — з мінімальним порогом інвестиції: номінальна вартість одного сертифіката складає 10 гривень. Прибутковість — 9,5% річних у доларах США. Запланована емісія — 10 мільярдів гривень. Інвестори фонду щомісяця отримують дивіденди з орендних платежів, а також заробляють на капіталізації (зростанні вартості) об'єктів.\u003C/p>","2025-09-06T17:20:37.169Z",[],{"id":2813,"title":4191,"text":4192,"videoURL":70,"forCorporate":59,"forCabinet":59,"createdAt":4193,"updatedAt":4194,"publishedAt":4195,"keywords":70,"chapter":4196,"article":70,"generalDocuments":4199},"Яка нерухомість зараз належить фонду?","\u003Cp>Станом на початок березня 2026 року до складу Inzhur REIT входять:\u003C/p>\u003Cp>👉 1 — діючий ТРЦ Sky Park у Вінниці та земля під ним.\u003Cbr>👉 7 — діючих об'єктів і земля під ними для «Сільпо», «Фора», Comfy, Masterzoo.&nbsp;\u003Cbr>👉 2 — об'єкти на стадії проєктування та будівництва і земля під ними для супермаркетів «Фора».\u003Cbr>👉 3 — діючих об'єкти та земля під ними для ресторанів McDonald's.\u003Cbr>👉 2 — об'єкти на стадії проєктування та будівництва і земля під ними для ресторанів McDonald's.\u003Cbr>👉 1 — ритейл-парк з якірним орендарем Novus на стадії проєктування та будівництва.\u003C/p>\u003Cp>👉 1 — житловий комплекс комфорт-класу «Свідомі» на стадії будівництва та земля під ним.\u003C/p>","2025-09-06T17:21:30.148Z","2026-03-05T10:41:19.631Z","2025-09-07T15:31:16.385Z",{"id":92,"subtitle":70,"createdAt":4197,"updatedAt":4198,"name":2563,"rank":49},"2025-09-07T15:18:22.160Z","2025-09-07T16:10:58.369Z",[],{"id":4201,"title":4202,"text":4203,"videoURL":70,"forCorporate":59,"forCabinet":59,"createdAt":4204,"updatedAt":4205,"publishedAt":4206,"keywords":70,"chapter":4207,"article":70,"generalDocuments":4208},440,"Яка дохідність фонду очікується?","\u003Cp>\u003Cstrong>9,5% річних у доларах США\u003C/strong> відповідно до курсу Національного банку України — прогнозована дохідність фонду Inzhur REIT.\u003C/p>","2025-09-06T17:21:58.880Z","2025-09-07T15:32:05.667Z","2025-09-07T15:32:05.651Z",{"id":92,"subtitle":70,"createdAt":4197,"updatedAt":4198,"name":2563,"rank":49},[],{"id":4210,"title":4211,"text":4212,"videoURL":70,"forCorporate":59,"forCabinet":59,"createdAt":4213,"updatedAt":4214,"publishedAt":4215,"keywords":70,"chapter":4216,"article":70,"generalDocuments":4217},441,"Яка мінімальна інвестиція?","\u003Cp>\u003Cstrong>Від 1 сертифіката, номінальна вартість якого — 10 гривень\u003C/strong>.\u003Cbr>\u003Cbr>При купівлі сертифікатів, коли вони є в наявності на сайті, їх вартість розраховується так: вартість чистих активів (ВЧА) на день купівлі + 1%.\u003Cbr>\u003Cbr>❗️\u003Cstrong>Важливо:\u003C/strong> 1% — надбавка, яка включається до активів фонду згідно з розділом 8 Регламенту Inzhur REIT. Побачити актуальну ціну сертифіката можна 24/7 на сторінці фонду або в особистому кабінеті інвестора Inzhur.\u003Cbr>\u003Cbr>Inzhur зробив інвестування у фонд Inzhur REIT максимально доступним, бо має стратегічну мету: навчити 1 млн українців та українок інвестувати. Для цього інвестиції повинні бути доступні буквально кожному — тому з Inzhur REIT можна спробувати себе у ролі інвестора, починаючи з суми від 10 гривень. Це можливість комфортно розібратися, як працює інвестиційний ринок — та стати досвідченим інвестором.\u003C/p>","2025-09-06T17:23:27.036Z","2025-09-07T15:32:09.021Z","2025-09-07T15:32:09.009Z",{"id":92,"subtitle":70,"createdAt":4197,"updatedAt":4198,"name":2563,"rank":49},[],{"id":4219,"title":4220,"text":4221,"videoURL":70,"forCorporate":59,"forCabinet":59,"createdAt":4222,"updatedAt":4223,"publishedAt":4224,"keywords":70,"chapter":4225,"article":70,"generalDocuments":4226},442,"Коли виплачуються дивіденди?","\u003Cp>\u003Cstrong>Виплата дивідендів здійснюється щомісяця, 10 числа, за попередній місяць — відповідно до кількості придбаних сертифікатів.\u003C/strong>\u003Cbr>\u003Cbr>Якщо 10 число припадає на вихідний день, виплата проводиться наступного робочого дня.\u003C/p>\u003Cp>Дивіденди можна отримувати як на брокерський рахунок Inzhur, так і на вказану банківську картку. При отриманні дивідендів на брокерський рахунок — в особистому кабінеті інвестора можна включити функцію автоматичного реінвестування дивідендів: тоді при кожному надходженні дивідендів на рахунок відбуватиметься автоматична купівля сертифікатів обраного фонду зі знижкою 1% — за рахунок відсутності націнки фонду та комісії брокера за обслуговування угоди, тобто за вартістю чистих активів (ВЧА).\u003Cbr>У розділі «Документи» на сторінці фонду можна знайти документ з історією виплат дивідендів на 1 сертифікат: він називається «Історія виплати дивідендів на 1 інвестиційний сертифікат».\u003Cbr>\u003Cbr>❗️\u003Cstrong>Важливо:\u003C/strong> реєстр співвласників фонду Inzhur REIT формується на останній робочий день місяця. Тобто для того, щоб отримати дивіденди за місяць, потрібно володіти сертифікатами фонду станом хоча б на останній робочий день місяця.\u003C/p>","2025-09-06T17:25:09.043Z","2025-10-09T10:19:44.128Z","2025-09-07T15:32:18.441Z",{"id":92,"subtitle":70,"createdAt":4197,"updatedAt":4198,"name":2563,"rank":49},[],{"id":4228,"title":4229,"text":4230,"videoURL":70,"forCorporate":59,"forCabinet":59,"createdAt":4231,"updatedAt":4232,"publishedAt":4233,"keywords":70,"chapter":4234,"article":70,"generalDocuments":4235},445,"Інвестування можливе тільки в гривні? Чи можу я провести оплату в USD? Куди та в якій валюті здійснюється виплата дивідендів? ","\u003Cp>Інвестування, розрахунок за купівлю цінних паперів та виплата дивідендів відбуваються \u003Cstrong>виключно в національній валюті — гривні\u003C/strong> (за курсом НБУ).&nbsp;\u003Cbr>\u003Cbr>❗️\u003Cstrong>Важливо: \u003C/strong>вартість цінних паперів прив'язана до долара США.\u003Cbr>\u003Cbr>👉 \u003Cstrong>Оплата за купівлю цінних паперів\u003C/strong> відбувається через поповнення власного брокерського рахунку (переказ на рахунок у форматі IBAN).&nbsp;\u003Cbr>\u003Cbr>👉 \u003Cstrong>Виплата дивідендів\u003C/strong> відбувається щомісячно на рахунок, котрий вказується для отримання. Також, за бажанням, можливе налаштування виплати дивідендів на брокерський рахунок для подальшого реінвестування.\u003C/p>","2025-09-06T17:28:35.605Z","2025-09-08T12:36:30.366Z","2025-09-07T15:32:33.721Z",{"id":92,"subtitle":70,"createdAt":4197,"updatedAt":4198,"name":2563,"rank":49},[],{"id":393,"name":4237,"target":676,"action":669,"icon":70}," Всі питання та відповіді про Inzhur REIT",{"id":1595,"__component":4239,"backgroundColor":4240,"isSocialsActivated":59},"contacts.office","gray",{"pagination":4242},{"page":110,"pageSize":789,"pageCount":110,"total":110},["Reactive",4244],{"$snuxt-i18n-meta":4245,"$sappSettings":4246,"$sconstants":4263,"$snuxt-seo-utils:routeRules":4306,"$ssite-config":4307},{},{"IS_DEV_MODE_ON":626,"ASSETS_OPTIONS":4247,"BONDS_OPTIONS":4252,"REINVESTMENT_OPTIONS":4258,"BOND_PURCHASE_RESTRICTION_NOTICE":4260,"BOND_SALE_TIME_RESTRICTION_NOTICE":4261,"BOND_SALE_DATE_RESTRICTION_NOTICE":4262},{"isCommonHintActivated":626,"messageTitle":4248,"message":4249,"successMessage":68,"purchaseDisabled":4250,"salesDisabled":4251,"button":70,"banner":70},"З 16:15 до 17:00 — робимо сервіси Inzhur \nкращими та зручнішими!","Але на це потрібен ча
