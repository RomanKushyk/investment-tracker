едній час виходу з інвестиції - 4,5 години 🤩","Вашу заявку прийнято в обробку!\n\nПісля виконання угоди цінні папери автоматично з’являться у вашому кабінеті.",null,{"id":33,"officeButton":34,"registrationBannerText":35,"fundSold":36},2,"У кабінет","Особистий кабінет — це твій пункт управління інвестиціями з Inzhur: тут ти купуєш і продаєш сертифікати, поповнюєш баланс для нових інвестицій і бачиш всю аналітику — скільки сертифікатів є у твоєму володінні, скільки вільних грошей на балансі тощо. А ще саме тут знаходиться твоє унікальне посилання для запрошення друзів до інвестування з Inzhur:)","Сертифікати фонду розпродано",{"id":38,"name":39,"iban":40,"edrpou":41},1,"ТОВ «ІНЖУР КЕПІТАЛ»","UA553071230000026504020119504","36301402",[43,47,52,57],{"id":44,"title":45,"url":12,"icon":46,"isEnabled":8},19,"Telegram","telegram",{"id":48,"title":49,"url":50,"icon":51,"isEnabled":8},20,"YouTube","https://www.youtube.com/channel/UCizm4WrZeuwFwtfT8c6Yemw","youtube",{"id":53,"title":54,"url":55,"icon":56,"isEnabled":8},21,"Instagram","https://www.instagram.com/inzhur_reit?igsh=MW9nbm95d2p4aDJ6","instagram",{"id":33,"title":58,"url":59,"icon":60,"isEnabled":8},"Facebook","https://www.facebook.com/InzhurREIT","facebook",{"id":38,"accountOpening":62,"docSharingWhyThisData":63,"questionnaireWhyThisData":64,"fundAssetValueGrowth":65,"fundDividendLiquidity":66,"userAssetValue":67,"userDividendValue":68,"investorsChat":69,"docSharingNoDiia":70,"purchaseOrdersLocation":71,"lastBusinessDayPurchase":72,"userBonusesAvailable":73,"crsWhyThisData":31,"fundSaleAmount":31,"fundSaleTiming":74,"bankIdWhyThisData":31,"fundNetAssetValue":75,"fatcaWhyThisData":31,"minInvest":31,"fundSold":76,"userInvestedValue":31,"bondReturnRate":77,"bondIsin":78,"bondSpecialOffer":79,"bondYield":80,"bondMaturityDate":81,"bondSpread":82,"bondInfo":83,"bondPurchase":84},"Для того, щоб придбати інвестиційні сертифікати та стати щасливим співвласником, необхідно відкрити рахунок у цінних паперах, а також приєднатися до Умов та правил надання фінансових послуг Inzhur.","Якщо ви поширите свої дані через Дію, ми зможемо занести їх в анкету-заяву про приєднання до Умов та правил надання фінансових послуг Inzhur, а також верифікувати вас онлайн за лічені хвилини.","Ми маємо занести ваші контактні дані в анкету-заяву про приєднання до Умов та правил надання фінансових послуг Inzhur. Формальність, але без неї ніяк.","Дохідність за весь час володіння цінними паперами. Вона враховує зміну ціни сертифіката, отримані дивіденди та прибуток від продажу. Розрахована за формулою XIRR з урахуванням періоду володіння.\n\nПоки інвестор не отримав прибутку (наприклад, дивідендів або грошей від продажу), дохідність може показувати нуль. Як тільки з'явиться перший прибуток — значення оновиться.","Середня річна дохідність за весь час існування фонду","Поточна вартість активів по ціні продажу + вільні для доінвестування кошти","Сума дивідендів, виплачених у вибраний період","Станьте частиною інвестиційного спільноти Inzhur!\n\nІнвестуйте в будь-який з наших фондів від 4 000 ₴ і отримайте доступ до закритого чату інвесторів.\n\nТут ви будете отримувати останні новини, мати можливість купувати та продавати сертифікати, а також знаходити підтримку у спільноті однодумців.\n\nОчікуємо на вас!","Якщо ви не маєте документів в Дії, ми запропонуємо провести відеодзвінок в зручному для вас каналі та пройти відеоідентифікацію. Займає 5 хвилин вашого часу, при собі треба мати оригінал паспорту та ІПН","Відмінити попередню заявку можна на головній сторінці вашого особистого кабінету, у вкладці «Мої заявки», натиснувши «Скасувати заявку»","Якщо ви не зможете провести оплату до вказаного часу, або ж банк зарахує платіж пізніше — купівля цінних паперів відбудеться за ціною актуальною на перший робочий день наступного місяця. Залишок коштів буде на брокерському рахунку.","Бонуси зараховані після автоматичної сплати 23% податків","Якщо ваша заявка сформована пізніше, або у вихідний день - викуп буде проведено в найближчий робочий день.","Вартість викупу сертифікатів, якщо подати заявку на продаж","Наразі 100% сертифікатів цього фонду викуплені інвесторами та знаходяться в їхніх портфелях. Можливість придбання може з’явитися у разі нової емісії цінних паперів фонду. Перевір доступність інвестування у фонд пізніше.","Дохідність розраховано згідно сьогоднішньої ціни ОВДП за формулою YTM (дохідність до погашення).","International Securities Identification Number (ISIN) — міжнародний ідентифікаційний номер цінного папера. Це ідентифікатор усього конкретного випуску ОВДП.","Короткострокові ОВДП з унікальними умовами від Inzhur: без спреду, без комісій та націнок, з найкращою дохідністю на ринку та найкоротшими термінами погашення серед аналогів.","У каталозі Inzhur для облігацій може бути вказано як дохідність YTM, так і дохідність SIM:\n\nYTM (Yield to Maturity) — розрахуновий річний відсоток, який інвестор отримає за цією облігацією, якщо утримає її до дати погашення.\n\nSIM (Simple Interest Method) — простий відсоток для тих облігацій, у яких залишився один купонний платіж до дати погашення.","Дата повернення інвестору номінальної вартості облігацій разом з останнім купоном.","Подвійний показник:\n\nПродаж — вартість 1 облігації даного випуску у разі дострокового (до дати погашення) виходу з інвестиції.\n\nСпред — різниця між ціною купівлі та ціною продажу 1 облігації даного випуску у разі дострокового (до дати погашення) виходу з інвестиції.","Облігації внутрішньої державної позики: цінні папери, що випускаються Міністерством фінансів України і на 100% гарантовані державою. Експерти Inzhur вручну створюють для тебе найкращий каталог ОВДП в Україні: у нашому списку ти обов’язково знайдеш цікавий для тебе випуск — за ціною, дохідністю, спредом, датою погашення.","Номінальна вартість 1 цінного паперу даного випуску облігацій. В день погашення вона повертається інвестору, разом з останнім купоном.",{"id":38,"fundTitle":31,"bondTitle":31,"dividend":86,"sale":104},[87,93,99],{"id":38,"action":88,"title":89,"description":90,"hintTitle":31,"hintText":31,"bondTitle":91,"bondDescription":92,"bondHintTitle":31,"bondHintText":31},"BROKER","Зарахувати на брокерський рахунок","Дивіденди будуть накопичуватися на вашому Inzhur-рахунку. За вашим бажанням, ви можете активувати опцію \"Реінвестування\", та при накопиченні достатньої суми, ми автоматично придбаємо для вас частку у обраному фонді.","Зарахувати на брокерський рахунок.","Кошти, виплачені за купонами та погашенням ОВДП, будуть накопичуватися на вашому Inzhur-рахунку.",{"id":33,"action":94,"title":95,"description":96,"hintTitle":31,"hintText":31,"bondTitle":97,"bondDescription":98,"bondHintTitle":31,"bondHintText":31},"BANK","Виплачувати дивіденди на картку","Дивіденди будуть виплачуватися на картку, вказану у платіжних реквізитах.","Виплачувати купони та погашення на картку.","Виплата купонів та погашення ОВДП будуть зараховуватись на картку, вказану у платіжних реквізитах.",{"id":100,"action":101,"title":102,"description":103,"hintTitle":31,"hintText":31,"bondTitle":31,"bondDescription":31,"bondHintTitle":31,"bondHintText":31},564,"REINVEST","Реінвестування","Дивіденди автоматично реінвестуються в нові сертифікати у власності і ти зароблятимеш більше.",[105,112],{"id":106,"action":107,"title":108,"description":109,"hintTitle":31,"hintText":31,"bondTitle":110,"bondDescription":111,"bondHintTitle":31,"bondHintText":31},7,"Keep","Отримати гроші на брокерський рахунок","Гроші за продаж сертифікатів виплатяться на брокерський рахунок. За бажання ви зможете інвестувати в інший фонд або вивести кошти на картковий рахунок пізніше","Отримати гроші на картку","Гроші за продаж сертифікатів виплатяться на картковий рахунок, вказаний у платіжних реквізитах",{"id":113,"action":114,"title":110,"description":111,"hintTitle":31,"hintText":109,"bondTitle":108,"bondDescription":31,"bondHintTitle":31,"bondHintText":31},3,"Send to the bank account",{"id":38,"siteName":116,"siteDescription":117,"mainImage":118,"logo"  Журжій&quot;],&quot;description&quot;:[0,&quot;Inzhur — інвестиційна компанія. Ми даємо всім українцям та українкам змогу об&#39;єднуватися для інвестицій в українську оборонку, велику комерційну та житлову нерухомість від 11 гривень, енергетику та найкращий каталог облігацій — заробляючи на щомісячних дивідендах, капіталізації активів та купонних виплатах, залежно від обраних пропозицій.\n\nЗасновник та СЕО Inzhur — Андрій Журжій: підприємець з експертизою в сферах інвестування, управління активами та будівництва нерухомості. З 2008 року розвиває групу компаній, що створює інвестиційні продукти для великих українських та міжнародних брендів, а також для приватних інвесторів.&quot;],&quot;subtitle&quot;:[0,null],&quot;mobileTitle&quot;:[0,null],&quot;mobileDescription&quot;:[0,null]}],&quot;buttons&quot;:[1,[[0,{&quot;id&quot;:[0,1382],&quot;name&quot;:[0,&quot;Про Inzhur&quot;],&quot;target&quot;:[0,&quot;_self&quot;],&quot;action&quot;:[0,&quot;/about&quot;],&quot;icon&quot;:[0,null]}],[0,{&quot;id&quot;:[0,1383],&quot;name&quot;:[0,&quot;Про Андрія Журжія&quot;],&quot;target&quot;:[0,&quot;_self&quot;],&quot;action&quot;:[0,&quot;/founder&quot;],&quot;icon&quot;:[0,null]}]]],&quot;cover&quot;:[0,{&quot;data&quot;:[0,{&quot;id&quot;:[0,2925070],&quot;attributes&quot;:[0,{&quot;uploadDestination&quot;:[0,&quot;default&quot;],&quot;uploadPath&quot;:[0,&quot;&quot;],&quot;name&quot;:[0,&quot;bg_c9afbfcf70.jpg&quot;],&quot;alternativeText&quot;:[0,null],&quot;caption&quot;:[0,null],&quot;width&quot;:[0,4096],&quot;height&quot;:[0,2730],&quot;formats&quot;:[0,{&quot;large&quot;:[0,{&quot;ext&quot;:[0,&quot;.jpg&quot;],&quot;url&quot;:[0,&quot;https://d2zk2gr3fhkmim.cloudfront.net/large_bg_c9afbfcf70_dcdc87f8e9.jpg&quot;],&quot;hash&quot;:[0,&quot;large_bg_c9afbfcf70_dcdc87f8e9&quot;],&quot;mime&quot;:[0,&quot;image/jpeg&quot;],&quot;name&quot;:[0,&quot;large_bg_c9afbfcf70.jpg&quot;],&quot;path&quot;:[0,null],&quot;size&quot;:[0,36.82],&quot;width&quot;:[0,1000],&quot; 2zk2gr3fhkmim.cloudfront.net/bg_c9afbfcf70_dcdc87f8e9.jpg&quot;],&quot;previewUrl&quot;:[0,null],&quot;provider&quot;:[0,&quot;custom-s3-upload-provider&quot;],&quot;provider_metadata&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2026-09-22T03:52:46.023Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-09-22T03:52:46.023Z&quot;]}]}]}],&quot;caption&quot;:[0,{&quot;id&quot;:[0,38],&quot;title&quot;:[0,&quot;Андрій Журжій&quot;],&quot;description&quot;:[0,&quot;/ Засновник та СЕО Inzhur&quot;],&quot;subtitle&quot;:[0,null],&quot;mobileTitle&quot;:[0,null],&quot;mobileDescription&quot;:[0,null]}]}]}]}]}],[0,{&quot;id&quot;:[0,41],&quot;__component&quot;:[0,&quot;sections.faq&quot;],&quot;title&quot;:[0,&quot; &quot;],&quot;backgroundColor&quot;:[0,&quot;basic&quot;],&quot;header&quot;:[0,{&quot;id&quot;:[0,116],&quot;title&quot;:[0,&quot;Довідник Inzhur&quot;],&quot;description&quot;:[0,&quot;Все найголовніше про інвестування в облігації з Inzhur.&quot;],&quot;subtitle&quot;:[0,null],&quot;mobileTitle&quot;:[0,&quot;Довідник Inzhur&quot;],&quot;mobileDescription&quot;:[0,&quot;Все найголовніше про інвестування в облігації з Inzhur.&quot;]}],&quot;button&quot;:[0,{&quot;id&quot;:[0,1407],&quot;name&quot;:[0,&quot;Всі питання та відповіді про облігації&quot;],&quot;target&quot;:[0,&quot;_self&quot;],&quot;action&quot;:[0,&quot;/handbook&quot;],&quot;icon&quot;:[0,null]}],&quot;questions&quot;:[0,{&quot;data&quot;:[1,[[0,{&quot;id&quot;:[0,499],&quot;attributes&quot;:[0,{&quot;title&quot;:[0,&quot;Як працює Спеціальна пропозиція Inzhur з ОВДП? У чому переваги?&quot;],&quot;text&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;https://www.inzhur.reit/offer/ovdp\&quot;&gt;&lt;strong&gt;Спеціальна пропозиція Inzhur з ОВДП&lt;/strong&gt;&lt;/a&gt; &amp;nbsp;— це ідеальна заміна депозитам для тих, хто хоче інвестувати короткостроково, а потім виходити з інвестиції достроково та без спреду (ціна купівлі та продажу протягом дня не відрізняються).&lt;/p&gt;&lt;p&gt;Це виглядає так:&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Inzhur пропонує інвесторам короткострокові випуски ОВДП за ціною аукціону Мінфіну України&lt;/strong&gt;. Такі випуски&amp;nbsp;&lt;a href=\&quot;https://www.inzhur.reit/offer/ovdp\&quot;&gt;на сайті&lt;/a&gt;&amp;nbsp;та в застосунку (&lt;a href=\&quot;https://inzhur.onelink.me/1RCF/ow5l2fjw\&quot;&gt;iOS&lt;/a&gt;,&amp;nbsp;&lt;a href=\&quot;https://inzhur.onelink.me/1RCF/hmy2ntsx\&quot;&gt;Android&lt;/a&gt;)&amp;nbsp;Inzhur позначені як «Спеціальна пропозиція».&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Інвестор Inzhur купує облігації за Спеціальною пропозицією&lt;/strong&gt; — і заробляє на річному відсотку дохідності випуску. Якщо він утримає облігації до дати погашення, то зможе досягти показника річних в YTM — тобто максимального рівня дохідності цього випуску.&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Інвестор Inzhur може швидко продати придбані облігації в будь-який зручний час до дати погашення&lt;/strong&gt; — і заробити за ту кількість днів, протягом яких він володів облігацією. Навіть купивши сьогодні й продавши завтра, інвестор заробляє за 1 день, адже ціна облігації щодня змінюється з урахуванням НКД (накопиченого купонного доходу).&lt;/p&gt;&lt;p&gt;Жодних комісій та націнок при купівлі чи достроковому виході з інвестиції — це максимально вигідно, і саме тому ми називаємо Спеціальну пропозицію Inzhur вбивцею депозитів:)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;❗️Важливо&lt;/strong&gt;. Inzhur здатний запропонувати найкращі умови на ринку ОВДП, бо маржа компанії не закладена ні в ціну, ні в рівень прибутковості. Inzhur заробляє в іншому — на винагороді за управління активами фондів нерухомості: чим більше заробляє фонд, тим більша винагорода Inzhur у грошовому вимірі. Вкладаючи залучені інвестиції фондів у короткострокові ОВДП на аукціонах Мінфіну під 16-17%, Inzhur додатково заробляє для фондів 2,5-3% річних — у порівнянні з банківськими відсотками на залишок, які приносили б фондам 13,5%-14% річних. Отже, продаючи ці ж цінні папери інвесторам, Inzhur забезпечує для фондів можливість краще керувати власною ліквідністю і отримувати кращу дохідність.&lt;/p&gt;&quot;],&quot;videoURL&quot;:[0,null],&quot;forCorporate&quot;:[0,true],&quot;forCabinet&quot;:[0,true],&quot;createdAt&quot;:[0,&quot;2026-01-22T12:20:50.787Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-09-22T03:01:42.832Z&quot;],&quot;publishedAt&quot;:[0,&quot;2026-04-09T15:51:13.647Z&quot;],&quot;keywords&quot;:[0,null],&quot;chapter&quot;:[0,{&quot;data&quot;:[0,{&quot;id&quot;:[0,18],&quot;attributes&quot;:[0,{&quot;subtitle&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2025-03-12T12:04:56.424Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-11-04T14:57:14.366Z&quot;],&quot;name&quot;:[0,&quot;ОВДП&quot;],&quot;rank&quot;:[0,4]}]}]}],&quot;relatedChapter&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;article&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;generalDocuments&quot;:[0,{&quot;data&quot;:[1,[]]}]}]}],[0,{&quot;id&quot;:[0,538],&quot;attributes&quot;:[0,{&quot;title&quot;:[0,&quot;Як працює переведення ОВДП в Inzhur? У чому переваги?&quot;],&quot;text&quot;:[0,&quot;&lt;p&gt;Ти можеш&amp;nbsp;&lt;strong&gt;переводити в Inzhur будь-які власні ОВДП, придбані в інших брокерів&lt;/strong&gt;. А потім — керувати ними нарівні з рештою свого портфеля ОВДП в Inzhur: наприклад, достроково продавати.&lt;/p&gt;&lt;p&gt;👉 Головна перевага: завдяки функції переведення можна&amp;nbsp;&lt;strong&gt;отримати&lt;/strong&gt;&amp;nbsp;&lt;strong&gt;кращу ціну продажу для будь-яких своїх ОВДП&lt;/strong&gt;&lt;i&gt; —&amp;nbsp;&lt;/i&gt;навіть якщо їх було придбано в іншого брокера. Бо кращі ціни продажу ОВДП саме в Inzhur.&lt;/p&gt;&lt;p&gt;Облігації з’являться у особистому кабінеті (в застосунку та на сайті). Так ти отримаєш єдиний центр управління ОВДП в Inzhur, простий та швидкий.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Як перевести ОВДП в Inzhur від іншого брокера:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Напиши нам — на&amp;nbsp;&lt;/strong&gt;&lt;i&gt;&lt;strong&gt;hello@inzhur.reit&lt;/strong&gt;&lt;/i&gt;. Вкажи ISIN та кількість облігацій для переказу, додай до листа Звіт брокера про ці папери, завірений його цифровим підписом. У звіті має бути вказана сума купівлі ОВДП, що плануються до переведення.&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Сформуй запит на облікову операцію переведення — у цього брокера&lt;/strong&gt;. Якщо не знаєш, як це зробити, то просто напиши брокеру у підтримку.&amp;nbsp;&lt;a href=\&quot;https://t.me/InzhurREIT_bot\&quot;&gt;Або нам&lt;/a&gt; — ми обов’язково допоможемо.&lt;/p&gt;&lt;p&gt;А після схвалення переведення — зможеш зручно та вигідно керувати всім своїм портфелем ОВДП у Inzhur.&lt;/p&gt;&quot;],&quot;videoURL&quot;:[0,null],&quot;forCorporate&quot;:[0,true],&quot;forCabinet&quot;:[0,true],&quot;createdAt&quot;:[0,&quot;2026-11-04T14:56:35.954Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-11-04T14:56:52.713Z&quot;],&quot;publishedAt&quot;:[0,&quot;2026-11-04T14:56:52.705Z&quot;],&quot;keywords&quot;:[0,null],&quot;chapter&quot;:[0,{&quot;data&quot;:[0,{&quot;id&quot;:[0,18],&quot;attributes&quot;:[0,{&quot;subtitle&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2025-03-12T12:04:56.424Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-11-04T14:57:14.366Z&quot;],&quot;name&quot;:[0,&quot;ОВДП&quot;],&quot;rank&quot;:[0,4]}]}]}],&quot;relatedChapter&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;article&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;generalDocuments&quot;:[0,{&quot;data&quot;:[1,[]]}]}]}],[0,{&quot;id&quot;:[0,402],&quot;attributes&quot;:[0,{&quot;title&quot;:[0,&quot;Що таке ОВДП?&quot;],&quot;text&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;Облігації Внутрішніх Державних Позик.&lt;/strong&gt; Це державні цінні папери, які випускає уряд країни в особі Міністерства фінансів.&amp;nbsp;&lt;br&gt;&lt;br&gt;👉 Через них держава залучає ресурси громадян, що потім ідуть на підтримку економіки та зокрема, воєнних потреб країни.&amp;nbsp;&lt;br&gt;&lt;br&gt;👉 Кошти, зібр quot;height&quot;:[0,156]}]}],&quot;hash&quot;:[0,&quot;bg_c9afbfcf70_dcdc87f8e9&quot;],&quot;ext&quot;:[0,&quot;.jpg&quot;],&quot;mime&quot;:[0,&quot;image/jpeg&quot;],&quot;size&quot;:[0,361.29],&quot;url&quot;:[0,&quot;https://d2zk2gr3fhkmim.cloudfront.net/bg_c9afbfcf70_dcdc87f8e9.jpg&quot;],&quot;previewUrl&quot;:[0,null],&quot;provider&quot;:[0,&quot;custom-s3-upload-provider&quot;],&quot;provider_metadata&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2026-09-22T03:52:46.023Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-09-22T03:52:46.023Z&quot;]}]}]}],&quot;caption&quot;:[0,{&quot;id&quot;:[0,38],&quot;title&quot;:[0,&quot;Андрій Журжій&quot;],&quot;description&quot;:[0,&quot;/ Засновник та СЕО Inzhur&quot;],&quot;subtitle&quot;:[0,null],&quot;mobileTitle&quot;:[0,null],&quot;mobileDescription&quot;:[0,null]}]}]}]}]}],[0,{&quot;id&quot;:[0,41],&quot;__component&quot;:[0,&quot;sections.faq&quot;],&quot;title&quot;:[0,&quot; &quot;],&quot;backgroundColor&quot;:[0,&quot;basic&quot;],&quot;header&quot;:[0,{&quot;id&quot;:[0,116],&quot;title&quot;:[0,&quot;Довідник Inzhur&quot;],&quot;description&quot;:[0,&quot;Все найголовніше про інвестування в облігації з Inzhur.&quot;],&quot;subtitle&quot;:[0,null],&quot;mobileTitle&quot;:[0,&quot;Довідник Inzhur&quot;],&quot;mobileDescription&quot;:[0,&quot;Все найголовніше про інвестування в облігації з Inzhur.&quot;]}],&quot;button&quot;:[0,{&quot;id&quot;:[0,1407],&quot;name&quot;:[0,&quot;Всі питання та відповіді про облігації&quot;],&quot;target&quot;:[0,&quot;_self&quot;],&quot;action&quot;:[0,&quot;/handbook&quot;],&quot;icon&quot;:[0,null]}],&quot;questions&quot;:[0,{&quot;data&quot;:[1,[[0,{&quot;id&quot;:[0,499],&quot;attributes&quot;:[0,{&quot;title&quot;:[0,&quot;Як працює Спеціальна пропозиція Inzhur з ОВДП? У чому переваги?&quot;],&quot;text&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;https://www.inzhur.reit/offer/ovdp\&quot;&gt;&lt;strong&gt;Спеціальна пропозиція Inzhur з ОВДП&lt;/strong&gt;&lt;/a&gt; &amp;nbsp;— це ідеальна заміна депозитам для тих, хто хоче інвестувати короткостроково, а потім виходити з інвестиції достроково та без спреду (ціна купівлі та продажу протягом дня не відрізняються).&lt;/p&gt;&lt;p&gt;Це виглядає так:&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Inzhur пропонує інвесторам короткострокові випуски ОВДП за ціною аукціону Мінфіну України&lt;/strong&gt;. Такі випуски&amp;nbsp;&lt;a href=\&quot;https://www.inzhur.reit/offer/ovdp\&quot;&gt;на сайті&lt;/a&gt;&amp;nbsp;та в застосунку (&lt;a href=\&quot;https://inzhur.onelink.me/1RCF/ow5l2fjw\&quot;&gt;iOS&lt;/a&gt;,&amp;nbsp;&lt;a href=\&quot;https://inzhur.onelink.me/1RCF/hmy2ntsx\&quot;&gt;Android&lt;/a&gt;)&amp;nbsp;Inzhur позначені як «Спеціальна пропозиція».&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Інвестор Inzhur купує облігації за Спеціальною пропозицією&lt;/strong&gt; — і заробляє на річному відсотку дохідності випуску. Якщо він утримає облігації до дати погашення, то зможе досягти показника річних в YTM — тобто максимального рівня дохідності цього випуску.&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Інвестор Inzhur може швидко продати придбані облігації в будь-який зручний час до дати погашення&lt;/strong&gt; — і заробити за ту кількість днів, протягом яких він володів облігацією. Навіть купивши сьогодні й продавши завтра, інвестор заробляє за 1 день, адже ціна облігації щодня змінюється з урахуванням НКД (накопиченого купонного доходу).&lt;/p&gt;&lt;p&gt;Жодних комісій та націнок при купівлі чи достроковому виході з інвестиції — це максимально вигідно, і саме тому ми називаємо Спеціальну пропозицію Inzhur вбивцею депозитів:)&lt;/p&gt;&lt;p&gt;&lt;strong&gt;❗️Важливо&lt;/strong&gt;. Inzhur здатний запропонувати найкращі умови на ринку ОВДП, бо маржа компанії не закладена ні в ціну, ні в рівень прибутковості. Inzhur заробляє в іншому — на винагороді за управління активами фондів нерухомості: чим більше заробляє фонд, тим більша винагорода Inzhur у грошовому вимірі. Вкладаючи залучені інвестиції фондів у короткострокові ОВДП на аукціонах Мінфіну під 16-17%, Inzhur додатково заробляє для фондів 2,5-3% річних — у порівнянні з банківськими відсотками на залишок, які приносили б фондам 13,5%-14% річних. Отже, продаючи ці ж цінні папери інвесторам, Inzhur забезпечує для фондів можливість краще керувати власною ліквідністю і отримувати кращу дохідність.&lt;/p&gt;&quot;],&quot;videoURL&quot;:[0,null],&quot;forCorporate&quot;:[0,true],&quot;forCabinet&quot;:[0,true],&quot;createdAt&quot;:[0,&quot;2026-01-22T12:20:50.787Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-09-22T03:01:42.832Z&quot;],&quot;publishedAt&quot;:[0,&quot;2026-04-09T15:51:13.647Z&quot;],&quot;keywords&quot;:[0,null],&quot;chapter&quot;:[0,{&quot;data&quot;:[0,{&quot;id&quot;:[0,18],&quot;attributes&quot;:[0,{&quot;subtitle&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2025-03-12T12:04:56.424Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-11-04T14:57:14.366Z&quot;],&quot;name&quot;:[0,&quot;ОВДП&quot;],&quot;rank&quot;:[0,4]}]}]}],&quot;relatedChapter&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;article&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;generalDocuments&quot;:[0,{&quot;data&quot;:[1,[]]}]}]}],[0,{&quot;id&quot;:[0,538],&quot;attributes&quot;:[0,{&quot;title&quot;:[0,&quot;Як працює переведення ОВДП в Inzhur? У чому переваги?&quot;],&quot;text&quot;:[0,&quot;&lt;p&gt;Ти можеш&amp;nbsp;&lt;strong&gt;переводити в Inzhur будь-які власні ОВДП, придбані в інших брокерів&lt;/strong&gt;. А потім — керувати ними нарівні з рештою свого портфеля ОВДП в Inzhur: наприклад, достроково продавати.&lt;/p&gt;&lt;p&gt;👉 Головна перевага: завдяки функції переведення можна&amp;nbsp;&lt;strong&gt;отримати&lt;/strong&gt;&amp;nbsp;&lt;strong&gt;кращу ціну продажу для будь-яких своїх ОВДП&lt;/strong&gt;&lt;i&gt; —&amp;nbsp;&lt;/i&gt;навіть якщо їх було придбано в іншого брокера. Бо кращі ціни продажу ОВДП саме в Inzhur.&lt;/p&gt;&lt;p&gt;Облігації з’являться у особистому кабінеті (в застосунку та на сайті). Так ти отримаєш єдиний центр управління ОВДП в Inzhur, простий та швидкий.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Як перевести ОВДП в Inzhur від іншого брокера:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Напиши нам — на&amp;nbsp;&lt;/strong&gt;&lt;i&gt;&lt;strong&gt;hello@inzhur.reit&lt;/strong&gt;&lt;/i&gt;. Вкажи ISIN та кількість облігацій для переказу, додай до листа Звіт брокера про ці папери, завірений його цифровим підписом. У звіті має бути вказана сума купівлі ОВДП, що плануються до переведення.&lt;/p&gt;&lt;p&gt;👉&amp;nbsp;&lt;strong&gt;Сформуй запит на облікову операцію переведення — у цього брокера&lt;/strong&gt;. Якщо не знаєш, як це зробити, то просто напиши брокеру у підтримку.&amp;nbsp;&lt;a href=\&quot;https://t.me/InzhurREIT_bot\&quot;&gt;Або нам&lt;/a&gt; — ми обов’язково допоможемо.&lt;/p&gt;&lt;p&gt;А після схвалення переведення — зможеш зручно та вигідно керувати всім своїм портфелем ОВДП у Inzhur.&lt;/p&gt;&quot;],&quot;videoURL&quot;:[0,null],&quot;forCorporate&quot;:[0,true],&quot;forCabinet&quot;:[0,true],&quot;createdAt&quot;:[0,&quot;2026-11-04T14:56:35.954Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-11-04T14:56:52.713Z&quot;],&quot;publishedAt&quot;:[0,&quot;2026-11-04T14:56:52.705Z&quot;],&quot;keywords&quot;:[0,null],&quot;chapter&quot;:[0,{&quot;data&quot;:[0,{&quot;id&quot;:[0,18],&quot;attributes&quot;:[0,{&quot;subtitle&quot;:[0,null],&quot;createdAt&quot;:[0,&quot;2025-03-12T12:04:56.424Z&quot;],&quot;updatedAt&quot;:[0,&quot;2026-11-04T14:57:14.366Z&quot;],&quot;name&quot;:[0,&quot;ОВДП&quot;],&quot;rank&quot;:[0,4]}]}]}],&quot;relatedChapter&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;article&quot;:[0,{&quot;data&quot;:[0,null]}],&quot;generalDocuments&quot;:[0,{&quot;data&quot;:[1,[]]}]}]}],[0,{&quot;id&quot;:[0,402],&quot;attributes&quot;:[0,{&quot;title&quot;:[0,&quot;Що таке ОВДП?&quot;],&quot;text&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;Облігації Внутрішніх Державних Позик.&lt;/strong&gt; Це державні цінні папери, які випускає ур
