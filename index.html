<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- One colour, because the app has ONE theme. A dark `theme-color` keyed
         to `prefers-color-scheme` would tint the browser chrome dark above a
         page that is still light — a seam, not a match. The dark value returns
         with the Phase 5 dark theme (PLAN-NOW A9), together with the
         `[data-theme=dark]` attribute that A9's own checklist specifies and
         that a media query could not follow anyway. -->
    <meta name="theme-color" content="#f6f5f3" />
    <title>Quirenote — Invest Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
