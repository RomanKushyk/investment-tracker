AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Quirenote user data: one Aurora DSQL cluster per environment, the migration runner
  that fills it, and the Cognito pool whose users own its rows. Deployed twice, as
  quirenote-backend-user-dev and quirenote-backend-user-prod. The ARCHIVE is
  deliberately not here: it is provider data shared by every environment and lives,
  once, in the quirenote-backend stack. See docs/DECISIONS.md, **Cloud target** and
  **Auth model**.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]

  AuthCertificateArn:
    Type: String
    MinLength: 1
    AllowedPattern: ^arn:aws:acm:us-east-1:\d{12}:certificate/.+$
    ConstraintDescription: must be an ACM certificate ARN in us-east-1
    # CONSTRAINED, AND THE CONSTRAINT IS THE CHEAP HALF OF A MESSY FAILURE. The workflow passes
    # this unconditionally, so an unset secret arrives as the empty string an unconstrained String
    # accepts — the pool is then created and the DOMAIN fails, and because the pool is Retain +
    # DeletionProtection ACTIVE the rollback KEEPS it: one deletion-protected orphan per attempt.

  ApiCertificateArn:
    Type: String
    MinLength: 1
    AllowedPattern: ^arn:aws:acm:eu-north-1:\d{12}:certificate/.+$
    ConstraintDescription: must be an ACM certificate ARN in eu-north-1
    # THE REGION IS THE OPPOSITE OF THE ONE ABOVE, and copying that pattern is how the mistake
    # gets made: an HTTP API custom domain is REGIONAL, so ACM wants the certificate in the API's
    # own Region, where the pool's is fronted by CloudFront and reads us-east-1 only. Neither
    # parameter has a default, because no value would be right and both carry the account id.

  OpenRegistration:
    Type: String
    AllowedValues: [closed, open]
    Default: closed
    # A PARAMETER RATHER THAN A SETTINGS ROW, because opening registration needs two things true
    # at once — the pool accepting `SignUp` (`AllowAdminCreateUserOnly`, an `UpdateUserPool`
    # parameter, so a deploy) and the trigger no longer refusing. AND CLOSING IT AGAIN DOES NOT
    # UNDO IT: every account created meanwhile keeps its Cognito profile, so what still holds the
    # line is the `status`/`role` check the API makes on every request.

  # A SWITCH RATHER THAN THE PAIR'S EMPTINESS: `sam deploy` resends an absent parameter's
  # previous value, so a deleted secret never reaches `''`. Not `on`/`off`: YAML 1.1 booleans.
  GoogleSignIn:
    Type: String
    AllowedValues: [disabled, enabled]
    Default: disabled
  GoogleClientId:
    Type: String
    Default: ''
  GoogleClientSecret:
    Type: String
    Default: ''
    NoEcho: true

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

  # ONE CONDITION READ IN THREE PLACES — the pool's `AllowAdminCreateUserOnly`, the trigger's
  # `OPEN_REGISTRATION` and the approve handler's. The pool's arms point the OPPOSITE way to
  # both handlers', so a copied `!If` reads plausibly and inverts one of them.
  IsRegistrationOpen: !Equals [!Ref OpenRegistration, open]

  HasGoogle: !Equals [!Ref GoogleSignIn, enabled]

Resources:
  # No VPC here either: DSQL is a public IAM-authenticated endpoint, and a NAT Gateway would
  # cost multiples of everything else in both stacks combined.
  UserCluster:
    Type: AWS::DSQL::Cluster
    # Retain: this is somebody's portfolio, so a `sam delete` must not be able to destroy it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      Tags:
        - Key: app
          # THE TAG IS THE BACKUP DECISION: the Backup selection matches `app=quirenote` and nothing
          # else, into a LOCKED vault a recovery point cannot leave early. Dev's cluster is files and a
          # dispatch; production user data cannot be re-derived from anything.
          Value: !If [IsProd, quirenote, quirenote-dev]

  # ITS OWN FUNCTION, NOT A MODE ON THE CAPTURE ONE, and what separates them is blast radius: a
  # mode would give the function that runs unattended on a schedule, with a DLQ that retries it,
  # the standing right to CREATE and ALTER the user tables. ONE CLUSTER PER RUNNER for the same
  # reason — but the deploy role can invoke both, so what keeps a dev run off production is the
  # environment each CALLER resolves, not IAM: `migrate.yml` from its `target`, and
  # `deploy-backend.yml`'s plan and apply from the ref (`infra/docs/role-deploy.md`, an accepted
  # risk).
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: migrate.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Tracing: Active
      # 900, the Lambda maximum: `CREATE INDEX ASYNC` returns a job the runner waits on, so the
      # ceiling is an index BUILD, and a wait killed there leaves a ledger row open over it.
      Timeout: 900
      # NO SCHEDULE AND NO DLQ: DSQL runs one DDL statement per transaction with no cross-statement
      # rollback, so an automatic retry of a half-applied file is what the ledger exists to make
      # unnecessary. Concurrency is unbounded for the reason the capture gives — a reservation drops
      # the unreserved pool below the required minimum of 10 and fails the deploy outright.
      Environment:
        Variables:
          DSQL_ENDPOINT: !GetAtt UserCluster.Endpoint
          AWS_REGION_NAME: !Ref AWS::Region
          NODE_OPTIONS: --enable-source-maps
          # THE BOOTSTRAP MODE NEEDS A POOL and a hand-typed invoke carries none, where a trigger reads
          # it off the event — which is why `pre-signup.ts` has no variable at all.
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Sid: ConnectToDsqlAsAdmin
              Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt UserCluster.ResourceArn
            # THE RUNNER CAN MINT AN IDENTITY, stated rather than hidden: bootstrapping the first
            # super-admin needs a `sub`, which only `AdminCreateUser` produces. Two calls and no third.
            # INLINE, unlike the trigger's grant, because this function is not in the chain the pool
            # depends on — so naming the pool from here builds no cycle.
            - Sid: BootstrapTheFirstSuperAdmin
              Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${MigrateFunction}
      RetentionInDays: 30

  # ONE POOL PER ENVIRONMENT, beside the cluster whose `app_user` rows its `sub` values key: a
  # shared pool would make a dev sign-in mint a production identity (*Auth model*). THREE OF
  # THESE PROPERTIES CANNOT BE CHANGED AFTER CREATION, which is why the rehearsal in
  # `docs/reference/COGNITO-POOL-PARAMS.md` happened first — getting one wrong is not an edit,
  # it is recreating the pool with users already in it.
  UserPool:
    Type: AWS::Cognito::UserPool
    # WHAT RETAINING IT ACROSS A STACK DELETE LEAVES: the pool survives and its trigger does not,
    # so `LambdaConfig.PreSignUp` points at an ARN that no longer exists and every federated
    # sign-in against the orphan fails. Written here so the state is recognised, not diagnosed.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: [PreSignUpPermission]
    Properties:
      UserPoolName: !Sub quirenote-${Environment}
      # CREATE-TIME ONLY #1. Never `AliasAttributes`: aliases let several users hold one address,
      # resolved as "only the last to verify it can sign in" — silently, for an existing account.
      UsernameAttributes: [email]
      # CREATE-TIME ONLY #2, reported ABSENT rather than defaulted by `DescribeUserPool`, so the
      # effective default cannot be read off a pool: omitted, matching is case SENSITIVE and one
      # address becomes two accounts. A matching rule and not a rewriting one, which is why
      # `app_user_email_lower_ck` still has work to do.
      UsernameConfiguration:
        CaseSensitive: false
      # CREATE-TIME ONLY #3 — required attributes cannot change after creation, and `Schema` is not
      # an `UpdateUserPool` parameter either.
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors: [PASSWORD, WEB_AUTHN]
      WebAuthnUserVerification: required
      # THE RELYING PARTY IS EFFECTIVELY PERMANENT. A passkey is registered against one RP ID and no
      # browser will offer it to another, and AWS states that adding a custom domain later stops
      # passkeys working on the prefix domain through an RP ID mismatch — so the prefix domain is no
      # step on the way here. AND IT IS THE APEX, NOT THE AUTH HOST: matched by registrable suffix,
      # quirenote.com covers managed login AND the SPA's own origin, where auth.quirenote.com closes
      # off a native `StartWebAuthnRegistration`. THE COST IS A CREDENTIAL SCOPED TO EVERY SUBDOMAIN.
      WebAuthnRelyingPartyID: !If [IsProd, quirenote.com, dev.quirenote.com]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [IsRegistrationOpen, false, true]
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub quirenote-${Environment}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # ALLOW_USER_AUTH is choice-based sign-in, the flow a passkey is selected through; SRP is the
      # explicit spelling of a path that must keep working. NO ALLOW_REFRESH_TOKEN_AUTH, because AWS
      # refuses it alongside rotation, and which path replaces it is open rather than picked here.
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_USER_SRP_AUTH]
      # ONE DAY, AND IT ANSWERS THE THREE REFRESH REQUIREMENTS THE BROWSER BCP SINGLES
      # OUT (draft-ietf-oauth-browser-based-apps §6.3.2.3), two of them alternatives rather than
      # items on a list: rotate on each use OR sender-constrain, which Cognito does not offer;
      # cap the lifetime OR expire on inactivity; and the flat MUST NOT on a rotated token
      # outliving the original. The section binds more than those three — it also incorporates
      # RFC 9700, whose replay question is open in `docs/reference/COGNITO-POOL-PARAMS.md`.
      RefreshTokenValidity: 24
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: hours
        AccessToken: minutes
        IdToken: minutes
      # THE GRACE PERIOD IS 60 SECONDS RATHER THAN 0, for a race the SPA creates: the access token
      # lives in memory, so two tabs opening together submit the same refresh token and at 0 the
      # second is signed out. 60 is the documented maximum.
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 60
      EnableTokenRevocation: true
      # `!Ref` ON THE PROVIDER, NOT THE LITERAL STRING `Google`, AND THAT IS THE ORDERING: a literal
      # derives no edge, so on the deploy where the credentials FIRST arrive CloudFormation would be
      # free to update this client before creating the provider. A `DependsOn` naming a conditional
      # resource is an error in its own right, which is why the reference sits inside the arm.
      SupportedIdentityProviders: !If [HasGoogle, [COGNITO, !Ref GoogleIdentityProvider], [COGNITO]]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !If
          - IsProd
          - https://quirenote.com/auth/callback
          - https://dev.quirenote.com/auth/callback
      LogoutURLs:
        - !If [IsProd, https://quirenote.com/, https://dev.quirenote.com/]
      PreventUserExistenceErrors: ENABLED

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      # `email_verified` IS MAPPED ON PURPOSE: unmapped, the claim reaches the trigger as undefined,
      # which reads as unverified — so Google sign-in would stop linking and make second accounts.
      AttributeMapping:
        email: email
        email_verified: email_verified

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    DependsOn: [UserPoolClient]
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !If [IsProd, auth.quirenote.com, auth.dev.quirenote.com]
      ManagedLoginVersion: 2
      CustomDomainConfig:
        CertificateArn: !Ref AuthCertificateArn

  # WITHOUT THIS THE DOMAIN ABOVE SERVES A BROKEN PAGE: managed login is nonfunctional until a
  # style exists, and version 2 does not fall back to the classic UI — it fails.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: pre-signup.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Tracing: Active
      Timeout: 5
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
          # THE OTHER HALF OF THE SWITCH. Quoted, and read as the exact string `true`: a variable
          # arrives as text and `Boolean('false')` is true, which would open registration anywhere.
          OPEN_REGISTRATION: !If [IsRegistrationOpen, 'true', 'false']
      # NO POLICIES BLOCK: the grant is PreSignUpPolicy below, for the cycle reason given there.

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PreSignUpFunction}
      RetentionInDays: 30

  # THE CYCLE, AND THE FIRST OF TWO PLACES IT IS BROKEN. The pool names the function, so nothing
  # the pool depends on may name the pool — and a trigger not permitted to be invoked fails the
  # sign-up rather than skipping the link. Hence SourceAccount rather than SourceArn.
  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # THE SECOND PLACE, and here the cycle costs nothing: a policy resource is created after both,
  # so it can name the real pool ARN where an inline one would wildcard every pool in the
  # account. THE COST IS A WINDOW on a fresh create, uncloseable by `DependsOn`, on a pool with
  # no users yet.
  PreSignUpPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: LinkFederatedIdentity
      Roles: [!Ref PreSignUpFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              # Two calls and no third: nothing here may create, disable or delete a user. The
              # test holds one statement on one pool, so a third action here is caught by neither.
              - cognito-idp:ListUsers
              - cognito-idp:AdminLinkProviderForUser
            Resource: !GetAtt UserPool.Arn

  # `POST /v1/applications` STANDS OUTSIDE THE AUTHORIZER ON PURPOSE: it creates the very
  # `app_user` row every other route is checked against (*Auth model*, one of three such
  # surfaces). EVERY OTHER ROUTE NAMES THE AUTHORIZER and `DefaultAuthorizer` is deliberately
  # NOT set — SAM renders an opted-out route against a scheme it never declares, and
  # `FailOnWarnings` would roll the stack back on a warning nobody can predict before a deploy.
  PublicApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      FailOnWarnings: true
      # AUTHENTICATION HERE, AUTHORIZATION IN THE HANDLER. This authorizer proves the token and
      # NOTHING ELSE: it cannot prove anything that has happened since the token was issued, so
      # `status` and `role` are read from `app_user` on every request, never `cognito:groups`.
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              # THE AUDIENCE ADMITS BOTH TOKEN KINDS AND ONLY THE HANDLER CAN TELL THEM APART: API Gateway
              # matches `aud`, or `client_id` when `aud` is absent, so an ID and an access token both pass.
              # Only the ID token carries `email`, so `authorize.ts` requires `token_use: id`.
              audience:
                - !Ref UserPoolClient
      DefaultRouteSettings:
        ThrottlingRateLimit: 25
        ThrottlingBurstLimit: 50
      # THE ROUTE'S OWN CEILING, UNDER THE STAGE'S, AND THIS IS WHAT WAF IS USUALLY BOUGHT FOR — the
      # only defence against a flood of DISTINCT addresses, and what it protects is the
      # account-level token bucket rather than the table. QUOTED, because the key is `<METHOD>
      # <path>` and YAML 1.1 reads a bare ON/OFF/NO/YES as a boolean: a key arriving as `true` would
      # configure nothing and fail nowhere. Every route has one, the admin routes included.
      RouteSettings:
        'POST /v1/applications':
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
        'POST /admin/users/{id}/approve':
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
        'POST /admin/users/{id}/reject':
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
      # BOTH HOSTS PER ENVIRONMENT, or the Amplify URL fails at the preflight. THE `!If` IS ON THE
      # WHOLE BLOCK, NOT ON `AllowOrigins`, AND THE DIFFERENCE IS SILENT: given an intrinsic at
      # `AllowOrigins`, SAM keeps only that value and DROPS the methods, headers and max-age,
      # emitting a bare list where an object belongs. One level up it renames the keys inside both
      # arms instead. The cost is three shared lines twice; `public-api.test.ts` holds both.
      CorsConfiguration: !If
        - IsProd
        - AllowOrigins:
            [
              https://quirenote.com,
              https://www.quirenote.com,
              https://main.d17m4jf400my6.amplifyapp.com,
            ]
          AllowMethods: [POST, OPTIONS]
          AllowHeaders: [authorization, content-type]
          MaxAge: 600
        - AllowOrigins: [https://dev.quirenote.com, https://dev.d17m4jf400my6.amplifyapp.com]
          AllowMethods: [POST, OPTIONS]
          AllowHeaders: [authorization, content-type]
          MaxAge: 600
      Domain:
        DomainName: !If [IsProd, api.quirenote.com, api.dev.quirenote.com]
        CertificateArn: !Ref ApiCertificateArn
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2

  ApplicationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: applications.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Tracing: Active
      # TIMEOUT × RATE IS A CONCURRENCY BUDGET, and on this account it binds before API Gateway
      # does: the unreserved pool is about ten, and EVERY function in both stacks shares it.
      Timeout: 5
      Environment:
        Variables:
          DSQL_ENDPOINT: !GetAtt UserCluster.Endpoint
          AWS_REGION_NAME: !Ref AWS::Region
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - Statement:
            # THE SAME ADMIN GRANT THE RUNNER HOLDS, and the widest thing about this endpoint: the
            # only database role this cluster has is `admin`. What bounds the reach is the handler.
            - Sid: ConnectToDsqlAsAdmin
              Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt UserCluster.ResourceArn
      Events:
        Submit:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Method: POST
            Path: /v1/applications
            # NO `Auth` BLOCK, AND THAT IS THE ONE PLACE IN THIS FILE WHERE ABSENCE IS THE DECISION: this
            # endpoint creates the row every other route is checked against, so there is nothing to check
            # it with. `public-api.test.ts` names it as the only route allowed to be here.

  ApplicationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApplicationsFunction}
      RetentionInDays: 30

  ApproveFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: approve.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Tracing: Active
      # LONGER THAN THE APPLICATION'S 5 for the extra round trip, not extra work: `AdminCreateUser`
      # sends an email before it answers. What bounds the concurrency is the ROUTES' throttles, not
      # the role check — that runs HERE, after the connection, so a `pending` applicant reaches this
      # function exactly as often as they care to ask.
      Timeout: 10
      Environment:
        Variables:
          DSQL_ENDPOINT: !GetAtt UserCluster.Endpoint
          AWS_REGION_NAME: !Ref AWS::Region
          NODE_OPTIONS: --enable-source-maps
          USER_POOL_ID: !Ref UserPool
          # THE THIRD CONSUMER OF THE ONE SWITCH: the gate is what writes a row for somebody who got in
          # while the door was open, so a switch driving only the other two would let them through the
          # pool and then refuse them at every route.
          OPEN_REGISTRATION: !If [IsRegistrationOpen, 'true', 'false']
      Policies:
        - Statement:
            - Sid: ConnectToDsqlAsAdmin
              Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt UserCluster.ResourceArn
            # THE WIDEST GRANT IN THIS STACK AFTER THE RUNNER'S: this function can mint an identity and
            # take one away. `AdminDeleteUser` is deliberately absent — a grant held for a call nobody
            # makes is a call somebody can make later without anyone deciding.
            - Sid: RuleOnApplications
              Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Approve:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Method: POST
            Path: /admin/users/{id}/approve
            Auth:
              Authorizer: CognitoJwt
        Reject:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Method: POST
            Path: /admin/users/{id}/reject
            Auth:
              Authorizer: CognitoJwt

  ApproveLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApproveFunction}
      RetentionInDays: 30

  # THE OTHER HALF OF THE TAG DECISION ON `UserCluster`. Both existing checks read the ARCHIVE
  # alone, deliberately, so neither cluster can make the other look fresh — the cost of that is
  # a second check, and it belongs beside the cluster it reads. DEV GETS NONE OF IT, its cluster
  # being outside the vault, so `IsProd` carries the one difference between the two stacks — and
  # none of it renders on a `dev` push, so its first real execution is a production deploy.
  BackupFreshnessFunction:
    Type: AWS::Serverless::Function
    Condition: IsProd
    Properties:
      CodeUri: dist/
      Handler: backup-freshness.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Tracing: Active
      Timeout: 10
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
          BACKUP_VAULT_NAME: quirenote-backups
          # THE FILTER, AND THE POINT OF THE WHOLE SECTION. One vault holds every backed-up cluster, so
          # an unfiltered read would keep a vault-wide age fresh on the ARCHIVE's nightly points while
          # this cluster's had stopped — and against a stale arn kept across a replacement, it is what
          # makes the replacement read as "no recovery point" that same night.
          DSQL_CLUSTER_ARN: !GetAtt UserCluster.ResourceArn
          DSQL_CLUSTER_ID: !GetAtt UserCluster.Identifier
      Policies:
        - Statement:
            - Sid: ReadThisClusterBackupFreshness
              Effect: Allow
              Action: backup:ListRecoveryPointsByBackupVault
              Resource: !Sub 'arn:${AWS::Partition}:backup:${AWS::Region}:${AWS::AccountId}:backup-vault:quirenote-backups'

  BackupFreshnessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProd
    Properties:
      LogGroupName: !Sub /aws/lambda/${BackupFreshnessFunction}
      RetentionInDays: 30

  # 04:00 UTC, AND THE TIMEZONE IS THE DECISION RATHER THAN THE HOUR: the backup plan runs on
  # `Etc/UTC`, so `Europe/Kyiv` — correct for the capture, which captures a Kyiv trading day —
  # would drift this an hour twice a year against a job that does not move. Once a day, and no
  # DLQ: a lost datapoint is replaced by tomorrow's firing.
  BackupFreshnessSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: IsProd
    Properties:
      Description: Publish the age of prod's newest user-data backup, after the nightly plan has run.
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: cron(0 4 * * ? *)
      ScheduleExpressionTimezone: Etc/UTC
      Target:
        Arn: !GetAtt BackupFreshnessFunction.Arn
        RoleArn: !GetAtt BackupFreshnessSchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  BackupFreshnessSchedulerRole:
    Type: AWS::IAM::Role
    Condition: IsProd
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeBackupFreshness
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BackupFreshnessFunction.Arn

  # DIMENSIONED BY CLUSTER, WHICH IS WHAT LETS IT SHARE A NAME WITH THE ARCHIVE'S: CloudWatch
  # keys a custom metric on namespace, name AND dimension set, and rolls nothing up across them.
  # NO `DefaultValue`: CloudWatch Logs rejects a transformation carrying both that and
  # dimensions, a 400 that appears at deploy time and never at validate time.
  UserBackupAgeMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: IsProd
    Properties:
      LogGroupName: !Ref BackupFreshnessLogGroup
      FilterPattern: '{ $.metric = "backupAgeHours" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: BackupAgeHours
          MetricValue: $.value
          Dimensions:
            - Key: cluster
              Value: $.cluster

  # 48 hours, not 24: the plan runs daily with a start window, so one late night is normal.
  # `notBreaching` is only honest because of the two alarms below — the value is published BY
  # this check, so its absence means the check failed. ONE WAY FOR IT TO GO ABSENT IS STILL
  # UNCOVERED: a run that succeeds and emits a line the filter no longer MATCHES.
  UserBackupAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmDescription: >-
        Production user data has no completed backup in the last 48h. Check that this
        cluster still carries `app=quirenote`, then the quirenote-archive-daily plan
        and the quirenote-backups vault in AWS Backup (eu-north-1) — that plan is named
        for the archive but its selection matches the tag, so it is this cluster's plan
        too. Both are outside this stack: infra/scripts/bootstrap-backups.sh.
      Namespace: Quirenote
      MetricName: BackupAgeHours
      Dimensions: [{ Name: cluster, Value: !GetAtt UserCluster.Identifier }]
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 48
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # THE ALARM THAT MAKES THE ONE ABOVE MEAN ANYTHING: a publisher that stopped and backups that
  # stopped are different faults, and only this one is invisible by construction. TWO PERIODS,
  # and not for the obvious reason — what they buy is the BOUNDARY, the window ending at now, so
  # ordinary jitter around a once-daily cron can empty a one-period window though every day ran.
  BackupFreshnessSilenceAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmDescription: >-
        The backup-freshness check has stopped running, so the age of prod's user-data
        backup is no longer being measured. Check the schedule and its role. Expect it on
        a first deploy too, until the first scheduled run clears it — the function has no
        invocations yet, and missing data here is treated as breaching.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref BackupFreshnessFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  # THE THIRD FAULT, AND NEITHER ALARM ABOVE CAN SEE IT: `Invocations` counts a FAILED invocation
  # too, so the silence alarm stays OK, and no age is published, so the age alarm stays OK on
  # `notBreaching`. THRESHOLD 1, because whether Scheduler retries a FUNCTION error the way it
  # retries a delivery failure is unmeasured — and the other mistake is silence.
  BackupFreshnessErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmDescription: >-
        The backup-freshness check threw. It could not read the vault, so the age of
        prod's user-data backup is unknown rather than stale — check the function's
        grant, its BACKUP_VAULT_NAME and DSQL_CLUSTER_ARN, and that the vault still
        exists.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref BackupFreshnessFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # THERE IS NO CLOUDWATCH METRIC FOR MONTHLY ACTIVES, so the pool's TOTAL user count stands in:
  # a strict upper bound, firing EARLY and never late. IN THIS STACK, NOT THE CAPTURE'S, the
  # pool being per-environment — handing the capture a pool id is the coupling the check above
  # already refused (*Alerting*). Dev identities count too, so this bounds prod's share alone.
  PoolUsageFunction:
    Type: AWS::Serverless::Function
    Condition: IsProd
    Properties:
      CodeUri: dist/
      Handler: pool-usage.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Tracing: Active
      Timeout: 10
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            # ONE CALL, AND THE BOUNDARY IS THE POINT: `DescribeUserPool` reads CONFIGURATION, so a
            # job holding this grant cannot read a user at all — refused by the policy, not by rule.
            - Sid: ReadThisPoolsUserCount
              Effect: Allow
              Action: cognito-idp:DescribeUserPool
              Resource: !GetAtt UserPool.Arn

  PoolUsageLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProd
    Properties:
      LogGroupName: !Sub /aws/lambda/${PoolUsageFunction}
      RetentionInDays: 30

  PoolUsageSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: IsProd
    Properties:
      Description: Publish how many identities prod's Cognito pool holds, against the free tier.
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: cron(0 5 * * ? *)
      ScheduleExpressionTimezone: Etc/UTC
      Target:
        Arn: !GetAtt PoolUsageFunction.Arn
        RoleArn: !GetAtt PoolUsageSchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  PoolUsageSchedulerRole:
    Type: AWS::IAM::Role
    Condition: IsProd
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokePoolUsage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PoolUsageFunction.Arn

  # UNDIMENSIONED, unlike `UserBackupAgeMetricFilter` above, which carries a key only because TWO
  # stacks publish under one name. AND `DefaultValue` IS LEGAL HERE AND MUST STILL NOT BE SET: it
  # would publish 0 for every period with no matching event — on the HEALTHY side of the
  # `GreaterThan` below, and enough datapoints to make that alarm's `notBreaching` mean nothing.
  PoolUsersMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: IsProd
    Properties:
      LogGroupName: !Ref PoolUsageLogGroup
      FilterPattern: '{ $.metric = "poolUsers" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: PoolUsers
          MetricValue: $.value

  PoolUsersAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmDescription: >-
        Prod's Cognito pool holds more than 8,000 identities — 80% of the 10,000 monthly
        actives Essentials bills nothing for. This is TOTAL USERS, not MAU: it is an upper
        bound, so it fires early rather than late, and it is set ahead of the 85% free-tier
        alert AWS mails the root account. Check the sign-up path and the approval queue.
      Namespace: Quirenote
      MetricName: PoolUsers
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PoolUsageSilenceAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmDescription: >-
        The pool-usage check has stopped running, so prod's identity count is no longer
        being measured against the free tier. Check the schedule and its role. Expect it on
        a first deploy too, until the first scheduled run clears it — the function has no
        invocations yet, and missing data here is treated as breaching.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref PoolUsageFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  PoolUsageErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmDescription: >-
        The pool-usage check threw, so prod's identity count is unknown rather than low —
        check the function's cognito-idp:DescribeUserPool grant and its USER_POOL_ID. A
        pool that answers without EstimatedNumberOfUsers lands here too, deliberately:
        publishing zero for a count nobody could read would sit on the healthy side of the
        threshold.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref PoolUsageFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ClusterIdentifier:
    Value: !GetAtt UserCluster.Identifier
  ClusterArn:
    Value: !GetAtt UserCluster.ResourceArn
  MigrateFunctionName:
    Value: !Ref MigrateFunction
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AuthDomain:
    Value: !If [IsProd, auth.quirenote.com, auth.dev.quirenote.com]
  # THE ONE VALUE NOBODY CAN CONSTRUCT: Cognito names the CloudFront distribution itself, and
  # the Cloudflare record has to point at this exact name, DNS-only.
  UserPoolDomainCloudFrontAlias:
    Value: !GetAtt UserPoolDomain.CloudFrontDistribution
  ApiDomain:
    Value: !If [IsProd, api.quirenote.com, api.dev.quirenote.com]
  # THE SAME ONE NOBODY CAN CONSTRUCT, one service along. READ THROUGH SAM'S REFERENCEABLE
  # PROPERTY rather than the generated logical id: the transform creates the DomainName under a
  # hashed id AWS documents as changeable, so `PublicApi.DomainName` is the only stable way in.
  ApiDomainRegionalTarget:
    Value: !GetAtt PublicApi.DomainName.RegionalDomainName
  ApiEndpoint:
    Value: !Sub https://${PublicApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
