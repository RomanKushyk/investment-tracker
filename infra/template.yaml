AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Quirenote Phase 1 — daily capture of the Inzhur price feed into Aurora DSQL.
  Raw payloads only; the observation schema is deferred until ~3 weeks of real
  data exist. See docs/superpowers/specs/2026-08-04-data-model.md.

Parameters:
  # AlertEmail removed 2026-08-11 with the SNS subscription it fed (D45). It also
  # took the owner's address out of a public repository, which it had no reason
  # to be in once nothing consumed it.
  FeedUrl:
    Type: String
    Default: https://www.inzhur.reit/_api/assets

Globals:
  Function:
    Runtime: nodejs22.x
    # 20% cheaper per GB-second than x86 at an identical request price, and Node
    # 22 runs natively. Free either way at this volume — a free choice.
    Architectures: [arm64]
    MemorySize: 256
    # SAM's default is 3 SECONDS. Fetching and parsing 165 KB of JSON blows
    # through that on a cold start.
    #
    # 300 rather than 60 because the same function runs the NBU backfill, which
    # walks ~2,600 business days back to 2016 in bounded chunks. The daily run
    # still finishes in seconds, and Lambda bills duration, not the ceiling.
    Timeout: 300
    Tracing: Active

Resources:
  # --------------------------------------------------------------------------
  # Database
  # --------------------------------------------------------------------------
  # No VPC anywhere in this stack. DSQL is a public IAM-authenticated endpoint
  # and Lambda has internet egress by default, so nothing here needs a VPC —
  # which is the single most important cost decision in the file. A NAT Gateway
  # is ~$33/month, roughly 1600x the rest of this stack combined.
  PriceCluster:
    Type: AWS::DSQL::Cluster
    # Retain on stack delete: the provider publishes no price history, so this
    # archive is the only copy that will ever exist. A `sam delete` must not be
    # able to destroy it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      Tags:
        - Key: app
          Value: quirenote

  # --------------------------------------------------------------------------
  # Capture function
  # --------------------------------------------------------------------------
  CaptureFunction:
    Type: AWS::Serverless::Function
    Properties:
      # No BuildMethod, deliberately. Both SAM builders — the builtin esbuild one
      # and the makefile one — copy the CodeUri directory into a sandbox before
      # running, so the handler's `../../src/core` imports resolve to nothing.
      # The workflow therefore runs esbuild itself, from the repo, and hands SAM
      # a finished bundle to package. That keeps the parser bundled from its
      # single source instead of duplicated, and takes SAM's builder semantics
      # out of the equation entirely.
      CodeUri: dist/
      Handler: capture.handler
      # No ReservedConcurrentExecutions. A new AWS account's Lambda concurrency
      # quota is small, and reserving any of it drops the unreserved pool below
      # the required minimum of 10 — the deploy fails outright. It bought little
      # anyway: this function is invoked once a day by a schedule capped at 3
      # retries with a DLQ, so its concurrency is already bounded by the trigger
      # rather than by a reservation.
      Environment:
        Variables:
          FEED_URL: !Ref FeedUrl
          # `Endpoint`, not `VpcEndpointServiceName` — the latter exists to
          # reach the cluster from inside a VPC, which is precisely what this
          # stack avoids.
          DSQL_ENDPOINT: !GetAtt PriceCluster.Endpoint
          DSQL_CLUSTER_ID: !GetAtt PriceCluster.Identifier
          AWS_REGION_NAME: !Ref AWS::Region
          NODE_OPTIONS: --enable-source-maps
          # Business days of identical prices before the stale-price alarm.
          # An environment variable rather than a constant so it can be
          # recalibrated from real data without a deploy — the right value is
          # an empirical question nobody can answer yet.
          STALE_AFTER_DAYS: '5'
          # The alert channel checks ITSELF here (D44/D45). Looked up by
          # NAME rather than ARN on purpose: a configuration ARN carries
          # the account id, and this repository is public.
          ALERT_CONFIG_NAME: quirenote-backend-alarms
          # The backup checks itself here, the same way the alert channel does
          # (D49). The vault is NOT part of this stack on purpose — a backup
          # inside the stack it protects dies with it — so it is named, not
          # referenced. `infra/scripts/bootstrap-backups.sh` creates it.
          BACKUP_VAULT_NAME: quirenote-backups
          # Filtering recovery points by the cluster's own ARN is what keeps a
          # recreated cluster from inheriting the old one's freshness for the
          # full 35-day retention.
          DSQL_CLUSTER_ARN: !GetAtt PriceCluster.ResourceArn
      Policies:
        - Statement:
            - Sid: ConnectToDsqlAsAdmin
              Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt PriceCluster.ResourceArn
            # Read-only, and only about whether a recovery point exists — never
            # about creating, deleting or restoring one. The vault lives outside
            # this stack, so it is addressed by constructed ARN; the pseudo
            # parameters keep the account id out of this public repository.
            - Sid: ReadOwnBackupFreshness
              Effect: Allow
              Action: backup:ListRecoveryPointsByBackupVault
              Resource: !Sub 'arn:${AWS::Partition}:backup:${AWS::Region}:${AWS::AccountId}:backup-vault:quirenote-backups'
            # Read-only, and only about the notification configuration itself —
            # never about what it delivers. This is what lets a dead alert
            # channel be seen rather than assumed (D44). AWS supports no
            # resource-level scoping for either list operation.
            - Sid: ReadOwnAlertChannel
              Effect: Allow
              Action:
                - notifications:ListNotificationConfigurations
                - notifications:ListChannels
              Resource: '*'
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt CaptureDlq.Arn

  # Declared explicitly rather than letting Lambda auto-create it: the implicit
  # log group defaults to "Never expire", which is the one line here that would
  # grow without bound.
  CaptureLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CaptureFunction}
      RetentionInDays: 30

  CaptureDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days

  # --------------------------------------------------------------------------
  # Schedule
  # --------------------------------------------------------------------------
  CaptureSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Capture the Inzhur feed at 01:00 Europe/Kyiv.
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      # Six fields, and one of day-of-month / day-of-week must be '?'.
      ScheduleExpression: cron(0 1 * * ? *)
      # Load-bearing. Ukraine still observes DST in 2026 — the 2024 abolition law
      # was never signed and clocks moved on 29 March — so a fixed-UTC schedule
      # would silently drift an hour twice a year. Kyiv transitions at 03:00
      # local, so a 01:00 run never lands in a skipped or repeated hour.
      ScheduleExpressionTimezone: Europe/Kyiv
      Target:
        Arn: !GetAtt CaptureFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        # Scheduler's defaults are 185 attempts over 24 hours. A retry that lands
        # tomorrow would stamp the wrong as_of, so both are cut hard.
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt CaptureDlq.Arn

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeCapture
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CaptureFunction.Arn

  # --------------------------------------------------------------------------
  # Alarms — 3 of the 10 always-free
  # --------------------------------------------------------------------------
  # Renamed from `AlertTopic` on 2026-08-11, which mints a NEW topic ARN — that
  # is the point, not a side effect (D44). SNS deactivated the email
  # subscription on the previous ARN immediately, three times running, while the
  # same address on an older topic kept delivering. The suppression appears to
  # be keyed to the endpoint+topic pair, so a fresh ARN is the way out. The name
  # is also simply better: it says what the topic alerts about.
  # The SNS topic is GONE, and with it every alarm's SNS action.
  #
  # It was kept at first on "a second channel may want it", which was wrong on
  # two counts. It contributed nothing to delivery — the push that verified the
  # channel arrived while the SNS subscription was already dead, so it can only
  # have travelled EventBridge -> AWS User Notifications -> Console Mobile App,
  # a path SNS is not on. And it could not even be updated: removing the
  # subscription block failed the deploy outright, because CloudFormation tries
  # to Unsubscribe using a stored ARN that SNS had already replaced with the
  # literal string "Deleted" (`An ARN must have at least 6 elements, not 1`).
  #
  # CloudWatch publishes alarm state changes to EventBridge for every alarm,
  # independently of AlarmActions. Alarms with no action still alert.

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The capture function threw.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref CaptureFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # THE important one. A scheduler that never fires produces no logs, no errors
  # and no metrics — it is invisible by construction, and a missed day is
  # permanently unrecoverable because the provider publishes no history.
  #
  # `TreatMissingData: breaching` is the whole point: the default (`missing`)
  # parks a dead job in INSUFFICIENT_DATA and emails nothing, forever. This is
  # the single most common way solo-operator cron monitoring silently fails.
  SilenceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The capture function did not run in 24h.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref CaptureFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  # A frozen upstream is the one failure that looks exactly like success: the
  # fetch returns 200, the parse yields all 35 entries, every value is a
  # plausible number — and none of them has moved. Neither the error alarm nor
  # the silence alarm can see it, because nothing errored and the job did run.
  #
  # A metric filter over the log line costs nothing (filters are free; the
  # metric is one of 10 free custom metrics) and needs no extra IAM.
  StalePricesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: STALE_PRICES
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: StalePrices
          MetricValue: '1'
          DefaultValue: 0

  StalePricesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Prices have not moved for several consecutive business days.
      Namespace: Quirenote
      MetricName: StalePrices
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # notBreaching, unlike the silence alarm: no data here means no stale
      # capture was logged, which is the healthy state. The silence alarm is
      # what covers "nothing ran at all".
      TreatMissingData: notBreaching

  # The streak VALUE, published on every business-day capture rather than only
  # when it is bad. This is what makes the staleness check itself observable:
  # a metric that appears only on failure cannot tell "healthy" apart from
  # "the check stopped running".
  # The alert channel measuring itself (D44/D45). Emitted on EVERY scheduled
  # run, healthy or not — a signal that appears only on failure cannot tell
  # "fine" from "the check stopped running", which is the same reasoning as
  # UnchangedDays one level up.
  AlertChannelsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "alertChannels" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: AlertChannels
          MetricValue: $.value

  # Zero channels means alarms are being raised into nothing.
  #
  # This alarm notifies through the channel it is measuring, which is circular
  # and deliberately so: it is the BACKUP. The primary is that the number is
  # readable without any delivery — in the log, on a dashboard, and in the run
  # journal. On 2026-08-11 the alerting was dead for hours while every indicator
  # read healthy; the fix is not a cleverer alarm, it is a value someone can look
  # at.
  #
  # notBreaching on missing data: no data means the capture itself stopped, and
  # SilenceAlarm already says that. Two alarms for one fault is how alarms get
  # muted.
  AlertChannelAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        The alert configuration has no delivery channel, so nothing here can
        reach anyone. Re-associate the Console Mobile App device in AWS User
        Notifications (us-east-1).
      Namespace: Quirenote
      MetricName: AlertChannels
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

  # The backup measuring itself (D49), emitted on every scheduled run like the
  # two above. The archive spent its whole existence with no backup at all while
  # deletion protection made it look protected, and a backup PLAN fails the same
  # silent way: it simply stops producing recovery points.
  BackupAgeMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "backupAgeHours" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: BackupAgeHours
          MetricValue: $.value

  # 48 hours, not 24. The plan runs daily with a 60-minute start window, so a
  # single late or skipped night is normal operation; the signal wanted is "the
  # plan has stopped", not "last night ran late". At 24 the alarm would page for
  # something that fixes itself, and an alarm that pages for nothing gets muted.
  #
  # notBreaching on missing data, for the same reason as AlertChannelAlarm: this
  # value is published BY the capture, so its absence means the capture stopped —
  # which SilenceAlarm already says. Two alarms for one fault is how alarms get
  # muted.
  BackupAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        The price archive has no completed backup in the last 48h. Check the
        quirenote-archive-daily plan and the quirenote-backups vault in AWS
        Backup (eu-north-1) — the vault is outside this stack, see
        infra/scripts/bootstrap-backups.sh.
      Namespace: Quirenote
      MetricName: BackupAgeHours
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 48
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  UnchangedDaysMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "unchangedDays" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: UnchangedDays
          MetricValue: $.value
          Dimensions:
            - Key: source
              Value: $.source

  # Fires only if the streak stops being published for five consecutive days —
  # i.e. the capture runs but the check silently does not.
  #
  # Five, not one: the value is emitted on business days only, so a normal
  # weekend already produces two blank days and a public-holiday long weekend
  # can produce four. One day would page every Saturday and be muted by
  # Christmas.
  #
  # This deliberately does NOT cover "the streak is computed but always wrong" —
  # no alarm can, because the correct value is exactly what is unknown. That one
  # is answered by looking at the graph once, which is now possible.
  StreakCheckLivenessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The staleness check has stopped reporting for 5 days.
      Namespace: Quirenote
      MetricName: UnchangedDays
      Dimensions: [{ Name: source, Value: inzhur }]
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 0
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A capture invocation landed in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt CaptureDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ClusterIdentifier:
    Value: !GetAtt PriceCluster.Identifier
  ClusterArn:
    Value: !GetAtt PriceCluster.ResourceArn
  FunctionName:
    Value: !Ref CaptureFunction
