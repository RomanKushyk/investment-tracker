AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Quirenote Phase 1 — daily capture of the Inzhur price feed into Aurora DSQL.
  Raw payloads only; the observation schema is deferred until ~3 weeks of real
  data exist. See docs/superpowers/specs/2026-08-04-data-model.md.

Parameters:
  FeedUrl:
    Type: String
    Default: https://www.inzhur.reit/_api/assets

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    # SAM's default is 3 SECONDS. Lambda bills the duration used rather than the ceiling, so a
    # high one is free — and at 300 two sources retrying can be killed mid-retry, no row written.
    Timeout: 600
    Tracing: Active

Resources:
  # NO VPC anywhere in this stack, the single most important cost decision in the file: DSQL is
  # a public IAM-authenticated endpoint, and a NAT Gateway would cost multiples of all the rest.
  PriceCluster:
    Type: AWS::DSQL::Cluster
    # The provider publishes no price history, so this archive is the only copy that will ever
    # exist. A `sam delete` must not be able to destroy it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      Tags:
        - Key: app
          Value: quirenote

  CaptureFunction:
    Type: AWS::Serverless::Function
    Properties:
      # NO BuildMethod, deliberately: both SAM builders copy the CodeUri directory into a
      # sandbox first, so the handler's `../../src/core` imports resolve to nothing. The
      # workflow runs esbuild from the repo instead, keeping one parser rather than a copy.
      CodeUri: dist/
      Handler: capture.handler
      # No ReservedConcurrentExecutions: reserving any of this account's small quota drops the
      # unreserved pool below the required minimum of 10 and the deploy fails outright.
      Environment:
        Variables:
          FEED_URL: !Ref FeedUrl
          DSQL_ENDPOINT: !GetAtt PriceCluster.Endpoint
          DSQL_CLUSTER_ID: !GetAtt PriceCluster.Identifier
          AWS_REGION_NAME: !Ref AWS::Region
          NODE_OPTIONS: --enable-source-maps
          # The alert channel and the backup each check THEMSELVES here. Named, not referenced:
          # the vault is outside the stack it protects, one inside dying with the accident.
          ALERT_CONFIG_NAME: quirenote-backend-alarms
          BACKUP_VAULT_NAME: quirenote-backups
          # The ARN filter is what stops a recreated cluster inheriting the old one's freshness.
          DSQL_CLUSTER_ARN: !GetAtt PriceCluster.ResourceArn
      Policies:
        - Statement:
            - Sid: ConnectToDsqlAsAdmin
              Effect: Allow
              Action: dsql:DbConnectAdmin
              Resource: !GetAtt PriceCluster.ResourceArn
            # Both read-only, and only about whether a thing EXISTS. The vault is outside this
            # stack, so the pseudo parameters build its ARN without the account id.
            - Sid: ReadOwnBackupFreshness
              Effect: Allow
              Action: backup:ListRecoveryPointsByBackupVault
              Resource: !Sub 'arn:${AWS::Partition}:backup:${AWS::Region}:${AWS::AccountId}:backup-vault:quirenote-backups'
            - Sid: ReadOwnAlertChannel
              Effect: Allow
              Action:
                - notifications:ListNotificationConfigurations
                - notifications:ListChannels
              Resource: '*'
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt CaptureDlq.Arn

  # Declared rather than left to Lambda: the implicit log group never expires.
  CaptureLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CaptureFunction}
      RetentionInDays: 30

  CaptureDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days

  # THE MIGRATION RUNNER IS NOT HERE — in `template-user.yaml`, or it would hold admin here.

  CaptureSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Capture the Inzhur feed at 01:00 Europe/Kyiv, retrying every two hours until 11:00.
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      # SIX FIRINGS TWO HOURS APART, STILL ONE SCHEDULE. The retry cannot be a RetryPolicy:
      # Scheduler spaces attempts by its own exponential backoff, clustering them minutes
      # apart, and a provider under maintenance is still under maintenance five minutes later.
      #
      # WHY IT STOPS AT 11:00 — the ceiling is the FEED REFRESH, not midnight. Inzhur settles
      # prices at ~13:00 Kyiv and `asOfFor` derives as_of as (Kyiv date - 1), so a capture
      # after the refresh reads the CURRENT day's prices and stamps them with yesterday's date:
      # wrong data wearing a correct label, worse than a missing day. NBU is immune, its file
      # being fetched BY date. 01:00 -> 11:00 is the widest window left, and six is how many
      # two-hour attempts fit in it. Constant spacing, not backoff — one client waiting out a
      # maintenance window, and every firing after the first is a no-op once a source settles.
      ScheduleExpression: cron(0 1,3,5,7,9,11 * * ? *)
      # Load-bearing. Ukraine still observes DST, so a fixed-UTC schedule would drift an hour
      # twice a year; Kyiv transitions at 03:00 local, so a 01:00 run never lands in a skipped
      # or repeated hour.
      ScheduleExpressionTimezone: Europe/Kyiv
      Target:
        Arn: !GetAtt CaptureFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        # The OTHER retry: the firings above cover a provider being down, this a delivery
        # failing. Cut hard because Scheduler's default would land it tomorrow, on a wrong as_of.
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt CaptureDlq.Arn

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeCapture
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CaptureFunction.Arn

  # THERE IS NO SNS TOPIC AND NO AlarmActions, on purpose: CloudWatch publishes alarm state
  # changes to EventBridge for every alarm regardless, so an alarm with no action still alerts.
  # Where `notBreaching` guards a value the capture publishes, absence means the capture
  # stopped — which SilenceAlarm already says, and the second alarm for one fault gets muted.
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The capture function threw.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref CaptureFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # THE important one, and `breaching` is the whole point. A scheduler that never fires
  # produces no logs, no errors and no metrics — invisible by construction, and a missed day is
  # unrecoverable — where the default would park a dead job in INSUFFICIENT_DATA forever.
  SilenceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The capture function did not run in 24h.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref CaptureFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  # On EVERY run, healthy or not: a failure-only signal cannot tell "fine" from "stopped".
  AlertChannelsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "alertChannels" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: AlertChannels
          MetricValue: $.value

  # Zero channels means alarms are raised into nothing. This one notifies through the channel
  # it measures — circular, and deliberately the BACKUP to reading the number itself.
  AlertChannelAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        The alert configuration has no delivery channel, so nothing here can
        reach anyone. Re-associate the Console Mobile App device in AWS User
        Notifications (us-east-1).
      Namespace: Quirenote
      MetricName: AlertChannels
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

  # The backup measuring itself: a PLAN fails silently, and deletion protection still looks safe.
  BackupAgeMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "backupAgeHours" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: BackupAgeHours
          MetricValue: $.value

  # 48 hours, not 24: the plan runs daily with a start window, so one late night is normal
  # operation and the signal wanted is "the plan has stopped".
  BackupAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        The price archive has no completed backup in the last 48h. Check the
        quirenote-archive-daily plan and the quirenote-backups vault in AWS
        Backup (eu-north-1) — the vault is outside this stack, see
        infra/scripts/bootstrap-backups.sh.
      Namespace: Quirenote
      MetricName: BackupAgeHours
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 48
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # NO ALARM, on purpose: zero is the healthy reading most of the time, since NBU publishes
  # nothing at weekends. The graph is the signal, and it reads one source at a time — so
  # DIMENSIONED BY SOURCE, or Inzhur's daily rows fill NBU's weekend zeros and a dead NBU
  # observer looks healthy. No DefaultValue beside Dimensions in any filter here: CloudWatch
  # Logs rejects a transformation carrying both, a 400 that appears only at deploy time.
  ObservationsWrittenMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "observationsWritten" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: ObservationsWritten
          MetricValue: $.value
          Dimensions:
            - Key: source
              Value: $.source

  # THE SHAPE OF THE FEED — these three are graphed and never alarmed, because no threshold is
  # right for both sources: a floor on `entryCount` is a guess the first delisting invalidates,
  # `skippedRefs` is routinely non-empty on NBU alone, and stale bonds are this feed's steady
  # state. What DOES alarm is a NAMED ref going missing, through the handler's own throw.
  EntryCountMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "entryCount" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: EntryCount
          MetricValue: $.value
          Dimensions:
            - Key: source
              Value: $.source

  SkippedRefsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "skippedRefs" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: SkippedRefs
          MetricValue: $.value
          Dimensions:
            - Key: source
              Value: $.source

  QuoteMaxStaleDaysMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: '{ $.metric = "quoteMaxStaleDays" }'
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: QuoteMaxStaleDays
          MetricValue: $.value
          Dimensions:
            - Key: source
              Value: $.source

  # THE ONE VERDICT WORTH WAKING SOMEONE FOR, and safe to alarm on because it was measured
  # first. Not a staleness signal: no yield the model can produce explains the quote at all.
  UnexplainedQuoteMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaptureLogGroup
      FilterPattern: UNEXPLAINED_QUOTE
      MetricTransformations:
        - MetricNamespace: Quirenote
          MetricName: UnexplainedQuote
          MetricValue: '1'
          DefaultValue: 0

  UnexplainedQuoteAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A bond quote cannot be explained by any yield the model can produce.
      Namespace: Quirenote
      MetricName: UnexplainedQuote
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A capture invocation landed in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt CaptureDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ClusterIdentifier:
    Value: !GetAtt PriceCluster.Identifier
  ClusterArn:
    Value: !GetAtt PriceCluster.ResourceArn
  FunctionName:
    Value: !Ref CaptureFunction
