# THE WORKSPACE IS THE PACKAGE BOUNDARY. Without this key only the root package is a member,
# which is what left `infra/` installing itself with a second package manager and importing the
# domain layer by relative path across a `package.json` (*Core is pure*).
packages:
  - 'packages/*'
  - 'infra'

allowBuilds:
  esbuild: false
  # `@scarf/scarf`'s postinstall is install-time analytics. Refused outright rather than left
  # to the ERR_PNPM_IGNORED_BUILDS notice every install prints, which is one nobody reads.
  '@scarf/scarf': false
  # `msw`'s postinstall only copies the browser worker script into a `msw.workerDirectory` this repo
  # does not set: the suite runs it in node.
  msw: false

# pnpm 11 no longer reads package.json's `pnpm` field, so overrides live here. `^0.28.1`
# dedupes `@esbuild-kit/core-utils` (deprecated, pinned `~0.18.20`) onto the copy vite and tsx
# float on, satisfying GHSA-67mh-4wv8-2f99. NO GATE COVERS THIS LINE: nothing runs the
# `core-utils` edge — drizzle-kit declares it and never loads it — so a green suite is no
# evidence here. IT BUYS ONE MINOR: on 0.x the caret stops below 0.29, so when vite widens the
# tree is back to three copies, silently. `pnpm why esbuild` should report two, not three.
overrides:
  '@esbuild-kit/core-utils>esbuild': '^0.28.1'

# Accepted as it stands: the fix is minimatch 11.0.1, and no parent's range reaches it. The 3.x line
# (eslint 9) does not contain the vulnerable code. The 10.x line (typescript-estree) has it only
# behind `optimizationLevel >= 2`, and its one caller takes the default 1 and runs only for
# `projectService`/`allowDefaultProject`, which `eslint.config.js` does not set. REMOVE THIS ENTRY
# once `pnpm why minimatch -r` lists only 11.0.1 or later: pnpm drops the GHSA on every version
# line, so its audit never marks that moment.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
