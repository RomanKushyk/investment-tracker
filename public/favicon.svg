<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Quirenote">
  <!-- Mark 04 "Серія днів": four days, height is value and opacity is age.
       Bar centres are EVEN (6/12/18/24) with an even stroke (4), which is what
       actually lands on whole pixels at 16px: a bar spans [x-2, x+2] in user
       units, halved to device pixels that is [(x-2)/2, (x+2)/2], and both ends
       are integers only when x is even. Odd centres — the first attempt — put
       every edge on a half-pixel and rendered the icon blurred across three
       columns instead of covering two. The bar tops are even for the same
       reason, since the round caps extend two units past the endpoint.
       The cost, taken deliberately: with four bars at a pitch of 6 the drawing
       cannot be both even-aligned and exactly centred, so it sits one unit left
       of centre — 0.5px at 16px, against a blur that was visible.
       Transparent and theme-aware: the browser paints the tab in its own theme,
       so a fixed colour would go invisible in one of them. -->
  <style>
    path { stroke: #26262a }
    @media (prefers-color-scheme: dark) { path { stroke: #e9e8e6 } }
  </style>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M6 24v-4" opacity=".45" />
    <path d="M12 24v-10" opacity=".65" />
    <path d="M18 24v-6" opacity=".8" />
    <path d="M24 24v-16" />
  </g>
</svg>
