<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Quirenote">
  <!-- The tab's own drawing, since the app's plate scaled down smears the «q». The light pair is
       the default because Safari ignores the query; never write a double hyphen in here, or the
       file is not well-formed and the icon renders BLANK. -->
  <style>
    .plate { fill: #8a5a3a }
    .q { fill: #f8f5ef }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #d8b494 }
      .q { fill: #19181a }
    }
  </style>
  <rect class="plate" width="16" height="16" rx="4" />
  <path class="q" fill-rule="evenodd" d="M6 3 H10 A2 2 0 0 1 12 5 V8 A2 2 0 0 1 10 10 H6 A2 2 0 0 1 4 8 V5 A2 2 0 0 1 6 3 Z M7 5 H9 A1 1 0 0 1 10 6 V7 A1 1 0 0 1 9 8 H7 A1 1 0 0 1 6 7 V6 A1 1 0 0 1 7 5 Z" />
  <path class="q" d="M10 6 H12 V12 A1 1 0 0 1 11 13 A1 1 0 0 1 10 12 Z" />
</svg>
