name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Always reflect the newest push: supersede an in-flight deploy rather than racing it.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # AMPLIFY_APP_ID / AWS_REGION / AWS_ROLE_ARN live in this environment's scope.
    environment:
      name: dev
      url: https://dev.d17m4jf400my6.amplifyapp.com
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY diagnostic for the OIDC trust failure — remove once the deploy is green.
      # Prints decoded claims and a secret fingerprint only; never the token itself.
      - name: Debug OIDC claims
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "--- token claims ---"
          printf '%s' "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, ref, environment}'
          echo "--- AWS_ROLE_ARN fingerprint (expect length 53, sha256 17c95c178ed1eda6) ---"
          printf '%s' "$ROLE_ARN" | wc -c | tr -d ' ' | sed 's/^/length: /'
          printf '%s' "$ROLE_ARN" | sha256sum | cut -c1-16 | sed 's/^/sha256: /'

      - uses: actions/setup-node@v4
        with:
          node-version: 26 # must match local Node

      - name: Enable pnpm via corepack
        run: corepack enable # honors packageManager: pnpm@11.10.0

      - run: pnpm install --frozen-lockfile

      # Quality gate — everything below runs before any AWS credential exists,
      # so a failing check can never deploy.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build # already runs tsc --noEmit

      - name: Zip the contents of dist
        run: cd dist && zip -qr ../dist.zip .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Amplify and wait for the job
        run: ./scripts/deploy-amplify.sh dist.zip
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: dev
