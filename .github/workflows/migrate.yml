name: Apply migrations

# THE REPAIR PATH AND THE BOOTSTRAP. `deploy-backend.yml` plans, rehearses and applies on every
# push that ships SQL, so the ordinary migration never comes through here. DSQL runs one DDL
# statement per transaction with no cross-statement rollback, so a half-applied file is the failure
# mode: the ledger in `infra/src/migrate.ts` makes it recoverable and this dispatch is how an
# operator finishes it, watching. `bootstrap` is here and nowhere else — it mints a real identity,
# it has no rehearsal, and no automatic path may reach it.
#
# `target` picks the cluster, never the SQL; resolving `prod` resolves an environment whose
# deployment branch policy admits `main` alone. The concurrency group is shared with the deploy's
# apply job — group names are repository-wide — so the two can never meet at one database.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        required: true
        default: rehearse
        type: choice
        options:
          - rehearse # throwaway schema, dropped CASCADE at the end
          - dry-run # read the files, contact no object
          - apply # public, for real
          # LAST, AND IT APPLIES NOTHING: it mints the first super-admin, without which the
          # system cannot be started at all. Minting a real identity has no rehearsal.
          - bootstrap # the first super-admin, named by `email` below
      email:
        description: bootstrap only — the address to make a super-admin
        required: false
        # THE INVITATION EXPIRES: the temporary password lasts seven days and `ForgotPassword`
        # refuses an account that never used it, so one left unopened needs a hand-run
        # `admin-create-user --message-action RESEND`; a re-run only reports `existing`.
        type: string
      target:
        description: Which environment's user database
        required: true
        # NO DEFAULT — but a `choice` without one does NOT open empty, GitHub preselects the
        # FIRST option. So what protects an operator who dispatches without touching the
        # dropdown is the ORDER below, and a test pins that order rather than the absence.
        type: choice
        options:
          - dev
          - prod

concurrency:
  # PER TARGET: two runs at one database must serialize, and dev must not hold up prod.
  group: migrate-${{ inputs.target }}
  cancel-in-progress: false # never interrupt DDL in flight

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Lambda's 900s is the only bound on an invoke the action deliberately gives no client
    # timeout; without this a hung one holds this group, and the cluster with it, for six hours.
    timeout-minutes: 45
    environment:
      name: ${{ inputs.target }}
    steps:
      # NO CHECKOUT: the SQL applied is the copy baked into the DEPLOYED bundle, not the ref.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ONE CALL, AND THE SAME ONE THE DEPLOY MAKES: `$/` resolves the action out of this
      # repository at the commit the run is on, with no checkout — so the resolve, the invoke
      # and the three verdicts are written once and neither caller can drift from the other.
      - uses: $/.github/actions/invoke-migration
        with:
          target: ${{ inputs.target }}
          mode: ${{ inputs.mode }}
          email: ${{ inputs.email }}
