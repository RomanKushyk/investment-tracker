name: Apply migrations

# MANUAL ONLY, AND IT MUST STAY SO. DSQL runs one DDL statement per transaction with no
# cross-statement rollback, so a half-applied file is the failure mode and the ledger in
# `infra/src/migrate.ts` is what makes it recoverable. `deploy-backend.yml` ships this handler
# and deliberately never runs it. `target` picks the cluster, never the SQL; resolving `prod`
# resolves an environment whose deployment branch policy admits `main` alone.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        required: true
        default: rehearse
        type: choice
        options:
          - rehearse # throwaway schema, dropped CASCADE at the end
          - dry-run # read the files, contact no object
          - apply # public, for real
          # LAST, AND IT APPLIES NOTHING: it mints the first super-admin, without which the
          # system cannot be started at all. Minting a real identity has no rehearsal.
          - bootstrap # the first super-admin, named by `email` below
      email:
        description: bootstrap only — the address to make a super-admin
        required: false
        # THE INVITATION EXPIRES: the temporary password lasts seven days and `ForgotPassword`
        # refuses an account that never used it, so one left unopened needs a hand-run
        # `admin-create-user --message-action RESEND`; a re-run only reports `existing`.
        type: string
      target:
        description: Which environment's user database
        required: true
        # NO DEFAULT — but a `choice` without one does NOT open empty, GitHub preselects the
        # FIRST option. So what protects an operator who dispatches without touching the
        # dropdown is the ORDER below, and a test pins that order rather than the absence.
        type: choice
        options:
          - dev
          - prod

concurrency:
  # PER TARGET: two runs at one database must serialize, and dev must not hold up prod.
  group: migrate-${{ inputs.target }}
  cancel-in-progress: false # never interrupt DDL in flight

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    steps:
      # NO CHECKOUT: the SQL applied is the copy baked into the DEPLOYED bundle, not the ref.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Read from the stack, not constructed: SAM appends a generated suffix to the name.
      - name: Resolve the function
        id: fn
        run: |
          stack="quirenote-backend-user-${{ inputs.target }}"
          # `|| true` so the guard below speaks — under `bash -e` a bare assignment takes its
          # substitution's status. Stderr stays: AccessDenied must not read as "deploy first".
          name=$(aws cloudformation describe-stacks \
            --stack-name "$stack" \
            --query "Stacks[0].Outputs[?OutputKey=='MigrateFunctionName'].OutputValue" \
            --output text || true)
          if [ -z "$name" ] || [ "$name" = "None" ]; then
            echo "MigrateFunctionName is not an output of $stack — deploy first" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Invoke
        run: |
          # `--cli-read-timeout 0` is NO CLIENT TIMEOUT, and the one setting here that could
          # start a second migration — the CLI's clock starts before the function's 900s
          # ceiling and `ReadTimeoutError` is in botocore's retryable set, so a trip would
          # RE-INVOKE into a migration in flight. `AWS_MAX_ATTEMPTS=1` is the other half.
          # `--output json`, or the FunctionError check below has no key name to read.
          # BUILT, NOT SUBSTITUTED: the address is free text, so pasting it into the shell
          # string is shell injection and into the JSON is JSON injection. `jq -n --arg` quotes
          # both, and the mode travels the same way so there is one rule rather than two.
          payload=$(jq -n --arg mode "$MIGRATE_MODE" --arg email "$BOOTSTRAP_EMAIL" \
            '{mode: $mode} + (if $email == "" then {} else {email: $email} end)')
          AWS_MAX_ATTEMPTS=1 aws lambda invoke \
            --function-name "${{ steps.fn.outputs.name }}" \
            --cli-binary-format raw-in-base64-out \
            --payload "$payload" \
            --cli-read-timeout 0 \
            --output json \
            out.json > invoke.json
          cat invoke.json
          echo '--- report ---'
          cat out.json
          # An unhandled error is a 200 with FunctionError set, so `invoke`'s exit code is not
          # the answer — and `jq -e` exits 2 on a parse error, which an `if` reads as "no
          # FunctionError". Each file is parse-checked before the `jq -e` that reads it.
          jq empty invoke.json
          if jq -e 'has("FunctionError")' invoke.json > /dev/null; then
            echo 'the migration handler raised' >&2
            exit 1
          fi
          jq empty out.json
          # A REHEARSAL THAT LEFT ITS SCHEMA BEHIND COMES BACK 200 WITH NO FunctionError, and this
          # is the only place its name reaches anyone short of CloudWatch.
          if jq -e '.teardown.dropped == false' out.json > /dev/null; then
            echo "the rehearsal applied cleanly but could not drop $(jq -r '.teardown.schema' out.json) — check the cluster and drop it by hand" >&2
            exit 1
          fi
        env:
          MIGRATE_MODE: ${{ inputs.mode }}
          BOOTSTRAP_EMAIL: ${{ inputs.email }}

      # The report is the only evidence a run leaves, and a log expires.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrate-${{ inputs.target }}-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            out.json
            invoke.json
          if-no-files-found: warn
