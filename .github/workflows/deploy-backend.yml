name: Deploy backend

# Separate workflow from the frontend deploy, not a job inside it. The two have
# different blast radii, different IAM roles and different failure modes: a
# broken SPA build must never block the price capture, and a stack rollback must
# never hold up a UI fix. They also change on completely different cadences.
on:
  push:
    branches: [dev]
    paths:
      - 'infra/**'
      # The handler bundles the parser from src/core, so a parser change is a
      # backend change even though nothing under infra/ moved.
      - 'src/core/inzhur/**'
      - 'src/core/dates.ts'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never interrupt a CloudFormation update in flight

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Enable pnpm via corepack
        run: corepack enable

      # The app's own deps: the handler imports zod through src/core.
      - run: pnpm install --frozen-lockfile

      # npm, not pnpm, and deliberately so. pnpm's symlinked store left `pg`
      # unable to resolve its own transitive deps (pg-types, pg-protocol) when
      # esbuild bundled it on the runner. infra has three dependencies and is
      # not a workspace member, so pnpm buys nothing here while a flat
      # node_modules removes an entire class of resolution problem.
      - name: Install backend deps
        working-directory: infra
        run: npm ci

      # The parser is shared code, so its tests gate the backend too. Runs
      # before any AWS credential exists — a failing test cannot deploy.
      - run: pnpm vitest run src/core/inzhur

      # Bundled here rather than by `sam build`: both SAM builders copy the
      # CodeUri directory into a sandbox first, so `../../src/core` — the shared
      # parser the handler deliberately imports rather than duplicates — is not
      # present when they run. Running esbuild against the real checkout is the
      # only way to keep one parser and one source of truth.
      - name: Bundle the handler
        working-directory: infra
        run: |
          npx --yes esbuild@0.28.2 src/capture.ts \
            --bundle --platform=node --target=node22 --format=cjs \
            --outfile=dist/capture.js --sourcemap \
            --external:pg-native
          ls -la dist/

      # Catches what typecheck cannot: that the bundle actually LOADS. The first
      # deploy shipped an ESM bundle and died at runtime on `Dynamic require of
      # "events"` — pg is CommonJS, and `require` does not exist in ESM output.
      #
      # Run from a directory with no package.json, exactly like the Lambda zip:
      # infra/package.json declares "type": "module", which would make node read
      # the same file as ESM here and give a misleading result.
      - name: Smoke-test the bundle
        run: |
          mkdir -p /tmp/bundle-check
          cp infra/dist/capture.js /tmp/bundle-check/
          cd /tmp/bundle-check
          node -e "
            const m = require('./capture.js');
            if (typeof m.handler !== 'function') throw new Error('handler missing from bundle');
            if (m.asOfFor(new Date('2026-08-11T22:00:00Z')) !== '2026-08-11') {
              throw new Error('asOfFor wrong: Kyiv date arithmetic broken in the bundle');
            }
            console.log('bundle loads, handler present, as_of correct');
          "

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # No `sam build` step — `sam deploy` packages CodeUri (dist/) as-is.
      - name: Deploy
        working-directory: infra
        run: |
          sam deploy \
            --stack-name kubushka-backend \
            --region "$AWS_REGION" \
            --s3-bucket "kubushka-sam-artifacts-${AWS_ACCOUNT_ID}" \
            --role-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/kubushka-backend-cfn-exec" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
