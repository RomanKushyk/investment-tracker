name: Deploy backend

on:
  push:
    # BOTH BRANCHES, DIFFERENT STACKS: `dev` the archive and the dev user stack, `main` the
    # prod user stack alone — one archive serves every environment (*Cloud target*).
    branches: [dev, main]
    paths:
      - 'infra/**'
      # NO EXCLUSION FOR THE DRAFT DDL: `deploy-frontend.yml` already ignores `infra/**`, so a
      # drafts-only push excluded here would match NO workflow and run no gates at all.
      # THE WHOLE PACKAGE, NOT THE MODULES THE HANDLERS IMPORT: the handlers bundle it, and a
      # list of modules fails one way only — an import added to a handler and no deploy
      # triggered, in silence. A superset costs a no-op run; a subset ships nothing.
      - 'packages/core/**'
      # The derivation identifier's own formula: changed alone, the SPA would deploy a new value
      # and the Lambdas keep the old one. `scripts/derivation-id.test.ts` holds both filters.
      - 'scripts/derivation-id.ts'
      # The bundle INLINES root dependencies, so a `zod` bump changes the deployed Lambda's
      # code — without these two a security bump would ship the frontend and leave it behind.
      - 'package.json'
      - 'pnpm-lock.yaml'
      # `.github/**`, not just this file: deploy-frontend skips `**/*.md`, so without this NO
      # workflow runs on the commit that replaces the landing page. Do not narrow it to a list.
      - '.github/**'
  workflow_dispatch:

concurrency:
  # PER BRANCH — true only while `main` deploys no archive, or two `sam deploy` meet one stack.
  #
  # THE WHOLE RUN, NOT THE DEPLOY JOB, and that is what keeps the bundle still under the migration:
  # a run is not finished while its `migrate` job rehearses and applies, so it keeps this group,
  # and the next push cannot `sam deploy` a new handler and new `dist/migrations/*.sql` underneath
  # an apply already in flight against the old one. Grouped on the deploy job alone, the second of
  # two quick pushes would do exactly that, and the apply would run SQL its own plan never counted.
  group: deploy-backend-${{ github.ref_name }}
  # `max` QUEUES UP TO 100 RATHER THAN KEEPING ONE, and it is what makes holding the group safe:
  # the default `single` CANCELS whichever run was already pending when a new one arrives, so a
  # migration slow enough to outlast two pushes would drop the middle one — stack never updated,
  # nothing red. Queued, they wait and run in order. Invalid with `cancel-in-progress: true`.
  queue: max
  cancel-in-progress: false # never interrupt a CloudFormation update in flight

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # THIS JOB INVOKES THE RUNNER TOO, in its last step, and holds the workflow group while it
    # does: the plan carries no client timeout either, so a hung invoke here would queue every
    # later push on the branch behind it for the six-hour default. WELL CLEAR OF A SLOW STACK
    # rather than tight — a managed-login domain change takes CloudFormation tens of minutes, and
    # a timeout here kills `sam deploy` while CloudFormation carries on regardless.
    timeout-minutes: 120
    outputs:
      # What the gated job below is conditioned on. Read from the runner AFTER the stack update, so
      # it counts the statements in the bundle THIS run shipped.
      pending: ${{ steps.plan.outputs.pending }}
      # What `notify` says this run deployed, off the archive deploy's own outcome rather than a
      # second copy of its `!= 'main'`, as the description check below reads it.
      archive: ${{ steps.archive.outcome }}
    environment:
      # EVERY REF THAT IS NOT `main` RESOLVES `dev`, INCLUDING A TAG: a dispatch on `vX.Y.Z`
      # asks for the DEV stacks from production's tree, and the branch policy refuses it, as does
      # the dev role's trust, which names `refs/heads/dev`.
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable pnpm via corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      # THE WHOLE SUITE, not a path-filtered selection: a hand-kept list of tests drifts from the
      # tree, and deploy-frontend skips an infra-only push, leaving these tests green but never run.
      - run: pnpm test

      # Same asymmetry: prettier covers infra/, and an infra-only push runs it nowhere else.
      - run: pnpm format:check

      # AND THE SAME AGAIN, TWICE: root `tsconfig.json` does not include infra/, and esbuild strips
      # types without checking them. `pnpm exec` because infra resolves typescript from the ROOT
      # tree. All of this before any credential.
      - run: pnpm exec tsc --noEmit -p infra
      - run: pnpm lint

      # Bundled here rather than by `sam build`: both SAM builders sandbox the CodeUri
      # directory, so the symlink to the domain package vanishes with it. The list is held to the
      # templates by a test, and so is the ABSENCE of `--packages=external`, which would
      # externalise `@quirenote/core` into a bare require Lambda cannot resolve.
      - name: Bundle the handlers
        working-directory: infra
        run: |
          # The derivation identifier from the function vite.config.ts reads, so the Lambdas and the
          # SPA built from one commit read one value; printed quoted, as `--define` takes it.
          id=$(node ../scripts/derivation-id.ts)
          for entry in capture migrate pre-signup applications approve auth-relay backup-freshness pool-usage rate-ahead archive-reader-grant view mutations; do
            npx --yes esbuild@0.28.2 "src/$entry.ts" \
              --bundle --platform=node --target=node22 --format=cjs \
              --outfile="dist/$entry.js" --sourcemap \
              --define:__DERIVATION_ID__="$id" \
              --external:pg-native
          done
          # The SQL is DATA read at runtime, not code esbuild can inline, so it rides along.
          mkdir -p dist/migrations
          cp migrations/*.sql dist/migrations/
          ls -la dist/ dist/migrations/

      # Catches what typecheck cannot: that the bundle LOADS — an ESM one dies on `Dynamic
      # require of "events"`. No package.json here, like the zip, or node would read it as ESM.
      - name: Smoke-test the bundle
        run: |
          mkdir -p /tmp/bundle-check
          # HELD TO THE TEMPLATES' HANDLERS BY A TEST, not to the esbuild loop above, because this
          # line is hand-kept: a handler left out of it deploys having never once been loaded.
          cp infra/dist/capture.js infra/dist/migrate.js infra/dist/pre-signup.js infra/dist/applications.js infra/dist/approve.js infra/dist/auth-relay.js infra/dist/backup-freshness.js infra/dist/pool-usage.js infra/dist/rate-ahead.js infra/dist/archive-reader-grant.js infra/dist/view.js infra/dist/mutations.js /tmp/bundle-check/
          cp -r infra/dist/migrations /tmp/bundle-check/
          cd /tmp/bundle-check
          # `import.meta.url` is EMPTY in a cjs bundle, so the SQL is found by LAMBDA_TASK_ROOT.
          LAMBDA_TASK_ROOT=/tmp/bundle-check node -e "
            const g = require('./migrate.js');
            if (typeof g.handler !== 'function') throw new Error('handler missing from migrate bundle');
            // The stub's ledger read comes back empty, so every statement reads as pending —
            // what an unmigrated cluster says, and the assertion is that the SQL was FOUND.
            g.migrate({ query: async () => ({ rows: [] }) }, { mode: 'dry-run' }).then((r) => {
              const pending = r.files.reduce((n, f) => n + f.pending, 0);
              // PER FILE, because the totals cannot see a single empty one: migrate() reports
              // one entry per MIGRATIONS entry, so those lengths agree by construction. The
              // floor is a floor, not a count — a count derived here would compare the bundle
              // against itself, and a hand-kept figure is invisible to all five gates.
              const empty = r.files.filter((f) => f.pending === 0).map((f) => f.file);
              if (empty.length || r.files.length !== g.MIGRATIONS.length || pending < 8) {
                throw new Error('migrate bundle cannot read its SQL: ' + JSON.stringify(r));
              }
              console.log('migrate bundle loads and finds its migrations');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          node -e "
            const m = require('./capture.js');
            if (typeof m.handler !== 'function') throw new Error('handler missing from bundle');
            // 22:00Z on the 11th is 01:00 Kyiv on the 12th: the scheduled firing, and the
            // instant where subtracting from the UTC date would silently yield D-2. That the
            // two rules DIFFER is asserted as well, because one as_of would pass either way.
            const run = new Date('2026-08-11T22:00:00Z');
            if (m.inzhurAsOf(run) !== '2026-08-12') {
              throw new Error('inzhurAsOf wrong: it must be the Kyiv date of the run (D71)');
            }
            if (m.nbuAsOf(run) !== '2026-08-11') {
              throw new Error('nbuAsOf wrong: it must be the previous Kyiv date (D71)');
            }
            if (m.inzhurAsOf(run) === m.nbuAsOf(run)) {
              throw new Error('the two as_of rules collapsed back into one (D71)');
            }
            console.log('bundle loads, handler present, both as_of rules correct');
          "
          # A stranger reaches this path: a bundle that fails to load fails the SIGN-UP.
          node -e "
            const p = require('./pre-signup.js');
            if (typeof p.handler !== 'function') throw new Error('handler missing from pre-signup bundle');
            const event = (verified) => ({
              triggerSource: 'PreSignUp_ExternalProvider',
              userPoolId: 'eu-north-1_EXAMPLE',
              userName: 'Google_1',
              request: { userAttributes: { email: 'a@b.com', email_verified: verified } },
              response: {},
            });
            let linked = 0;
            const idp = {
              listUsers: async () => ({ Users: [{ Username: 'u', UserStatus: 'CONFIRMED' }] }),
              adminLinkProviderForUser: async () => { linked++; return {}; },
            };
            // AND THE REFUSAL, in the bundled shape: an address with no local account must
            // reject. A stranger reaches this path, and a refusal that only works as ESM is
            // a refusal that does not work.
            const empty = { listUsers: async () => ({ Users: [] }), adminLinkProviderForUser: async () => ({}) };
            // AND THE SOURCE THAT MUST NEVER BE REFUSED, the mirror of the case above: AWS
            // fires this trigger on AdminCreateUser too, and that call IS approval.
            const approving = { triggerSource: 'PreSignUp_AdminCreateUser', userPoolId: 'eu-north-1_EXAMPLE', userName: 'u', request: { userAttributes: { email: 'a@b.com' } }, response: {} };
            Promise.all([
              p.preSignUp(event('true'), idp),
              p.preSignUp(event('false'), idp),
              p.preSignUp(event('true'), empty).then(() => 'resolved', () => 'refused'),
              p.preSignUp(approving, empty).then(() => 'admitted', () => 'refused'),
            ])
              .then(([, , unapproved, approval]) => {
                if (approval !== 'admitted') {
                  throw new Error('pre-signup bundle refused the approval path');
                }
                // One link across the first two: the verified event links, the unverified one
                // must not. A bundle that linked both, or neither, is the failure.
                if (linked !== 1) {
                  throw new Error('pre-signup bundle links on the wrong condition: ' + linked);
                }
                if (unapproved !== 'refused') {
                  throw new Error('pre-signup bundle admitted an address with no application');
                }
                console.log('pre-signup bundle loads, links only a verified address and refuses an unapproved one');
              }).catch((e) => { console.error(e); process.exit(1); });
          "
          # The applications route is UNAUTHENTICATED: it fails for a stranger with no account.
          node -e "
            const a = require('./applications.js');
            if (typeof a.handler !== 'function') throw new Error('handler missing from applications bundle');
            const asked = [];
            const client = { query: async (text, values) => { asked.push({ text, values }); return { rows: [] }; } };
            const submit = (email) => ({ body: JSON.stringify({ email }), isBase64Encoded: false });
            Promise.all([
              a.applications(client, submit('New@Quirenote.com')),
              // Escaped rather than typed, because the character is the point — a capital I
              // with a dot, which JavaScript folds to two codepoints and Postgres does not —
              // and a non-ASCII byte inside a shell string inside YAML has too many places to
              // be re-encoded on the way to node.
              a.applications(client, submit(String.fromCharCode(304) + 'REN@quirenote.com')),
            ]).then(([ok, bad]) => {
              if (ok.statusCode !== 202) throw new Error('valid address not accepted: ' + ok.statusCode);
              if (bad.statusCode !== 400) throw new Error('bad address not refused: ' + bad.statusCode);
              // One statement for two submissions: the refusal never reached the cluster, and
              // the acceptance was bound rather than interpolated.
              if (asked.length !== 1) throw new Error('cluster asked ' + asked.length + ' times, wanted 1');
              if (asked[0].values[0] !== 'new@quirenote.com') {
                throw new Error('address not folded: ' + asked[0].values[0]);
              }
              console.log('applications bundle loads, accepts one address and refuses the other');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # Both refusals land BEFORE any Cognito call — which would spend a monthly active user
          # and mail an address, neither retractable.
          node -e "
            const a = require('./approve.js');
            if (typeof a.handler !== 'function') throw new Error('handler missing from approve bundle');
            process.env.USER_POOL_ID = 'eu-north-1_EXAMPLE';
            const ADMIN = '9f1e2d3c-0000-4000-8000-00000000ad11';
            const DEMO = '00000000-0000-4000-8000-00000000de70';
            const calls = [];
            const idp = {
              adminCreateUser: async () => { calls.push('create'); return {}; },
              adminGetUser: async () => { calls.push('get'); return {}; },
              adminDisableUser: async () => { calls.push('disable'); return {}; },
            };
            const client = (role) => ({
              query: async (text) => ({
                rows: text.includes('applied_at')
                  ? [{ user_id: DEMO, email: 'demo@quirenote.com', status: 'active', role: 'demo', applied_at: new Date() }]
                  : [{ user_id: ADMIN, email: 'owner@quirenote.com', status: 'active', role: role }],
              }),
            });
            const event = {
              routeKey: 'POST /admin/users/{id}/approve',
              pathParameters: { id: DEMO },
              requestContext: { authorizer: { jwt: { claims: { token_use: 'id', sub: ADMIN, email: 'owner@quirenote.com' } } } },
            };
            Promise.all([
              a.approve(client('super_admin'), idp, event),
              a.approve(client('user'), idp, event),
            ]).then(([demo, ordinary]) => {
              if (demo.statusCode !== 409) throw new Error('approve bundle did not refuse a demo row: ' + demo.statusCode);
              if (ordinary.statusCode !== 403) throw new Error('approve bundle admitted an ordinary user: ' + ordinary.statusCode);
              if (calls.length) throw new Error('approve bundle called Cognito on a refusal: ' + calls.join());
              console.log('approve bundle loads and refuses a demo row and an ordinary caller, without calling Cognito');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # The relay holds the client secret and a stranger reaches it: both refusals land before
          # the environment is read or Cognito is called.
          node -e "
            const r = require('./auth-relay.js');
            if (typeof r.handler !== 'function') throw new Error('handler missing from auth-relay bundle');
            const calls = [];
            const idp = new Proxy({}, { get: (_, op) => async () => { calls.push(String(op)); return {}; } });
            const relay = r.createRelay(idp);
            const start = (headers, body) => ({ routeKey: 'POST /auth/start', headers, body: JSON.stringify(body) });
            Promise.all([
              relay(start({ 'sec-fetch-site': 'same-site' }, { USERNAME: 'a@quirenote.com', PREFERRED_CHALLENGE: 'WEB_AUTHN' })),
              relay(start({ 'x-csrf': '1', 'sec-fetch-site': 'same-site' }, { USERNAME: 'a@quirenote.com', PREFERRED_CHALLENGE: 'PASSWORD', PASSWORD: 'p' })),
            ]).then(([forged, password]) => {
              if (forged.statusCode !== 403) throw new Error('auth-relay bundle admitted a request with no custom header: ' + forged.statusCode);
              if (password.statusCode !== 400) throw new Error('auth-relay bundle admitted a plain password: ' + password.statusCode);
              if (calls.length) throw new Error('auth-relay bundle called Cognito on a refusal: ' + calls.join());
              console.log('auth-relay bundle loads and refuses a forged request and a plain password, without calling Cognito');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # What matters here is the FILTER: a read that lost `ByResourceArn` answers with the
          # whole vault, ARCHIVE included, and calls prod's data fresh on a night it was not.
          node -e "
            const b = require('./backup-freshness.js');
            if (typeof b.handler !== 'function') throw new Error('handler missing from backup-freshness bundle');
            const target = { vault: 'quirenote-backups', clusterArn: 'arn:cluster', cluster: 'cluster-id' };
            const asked = [];
            const vault = (points) => ({ listRecoveryPoints: async (input) => { asked.push(input); return { RecoveryPoints: points }; } });
            Promise.all([
              b.backupFreshness(vault([{ Status: 'COMPLETED', CompletionDate: new Date('2026-09-15T02:00:00Z') }]), target, new Date('2026-09-15T12:00:00Z')),
              b.backupFreshness(vault([]), target, new Date('2026-09-15T12:00:00Z')),
            ]).then(([fresh, none]) => {
              if (asked[0].ByResourceArn !== target.clusterArn) throw new Error('the read was not filtered by the cluster arn');
              if (asked[0].BackupVaultName !== target.vault) throw new Error('the read named the wrong vault');
              if (fresh.value !== 10) throw new Error('age wrong: ' + fresh.value);
              if (fresh.cluster !== target.cluster) throw new Error('the metric line carries no cluster dimension');
              if (!(none.value > fresh.value)) throw new Error('an empty vault did not read as older than a backed-up one: ' + none.value);
              console.log('backup-freshness bundle loads, filters by the cluster arn, and puts an empty vault at the bad end');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # Here the REFUSAL is what matters: a pool answering without `EstimatedNumberOfUsers`
          # must throw, or an unreadable count sits on the alarm's HEALTHY side forever.
          node -e "
            const u = require('./pool-usage.js');
            if (typeof u.handler !== 'function') throw new Error('handler missing from pool-usage bundle');
            const asked = [];
            const idp = (answer) => ({ describeUserPool: async (input) => { asked.push(input); return answer; } });
            Promise.all([
              u.poolUsage(idp({ UserPool: { EstimatedNumberOfUsers: 7 } }), 'eu-north-1_EXAMPLE'),
              u.poolUsage(idp({ UserPool: { EstimatedNumberOfUsers: 0 } }), 'eu-north-1_EXAMPLE'),
              u.poolUsage(idp({ UserPool: {} }), 'eu-north-1_EXAMPLE').then(() => 'published', () => 'refused'),
            ]).then(([counted, empty, unknown]) => {
              if (asked[0].UserPoolId !== 'eu-north-1_EXAMPLE') throw new Error('the read named the wrong pool');
              if (counted.value !== 7) throw new Error('count wrong: ' + counted.value);
              if (counted.metric !== 'poolUsers') throw new Error('the metric key the filter reads is gone: ' + counted.metric);
              if (empty.value !== 0) throw new Error('an empty pool was not published as zero: ' + empty.value);
              if (unknown !== 'refused') throw new Error('an unreadable count was published as a number');
              if (u.FREE_TIER_USERS !== 10000) throw new Error('the free-tier ceiling moved: ' + u.FREE_TIER_USERS);
              console.log('pool-usage bundle loads, counts an empty pool as zero, and refuses a count it could not read');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # 13:00Z is 16:00 Kyiv, the first firing: past NBU's 15:30, so tomorrow is due as well as
          # today. And no stored rate must REFUSE, or an age nobody read sits on the alarm's healthy side.
          node -e "
            const r = require('./rate-ahead.js');
            if (typeof r.handler !== 'function') throw new Error('handler missing from rate-ahead bundle');
            const asked = [];
            const rates = { ensure: async (client, date) => { asked.push(date); } };
            const stored = { query: async (text, values) => ({ rows: [{ day: values[0], rate: '44.8153' }] }) };
            const empty = { query: async () => ({ rows: [] }) };
            const firing = new Date('2026-09-29T13:00:00Z');
            Promise.all([
              r.rateAhead(stored, rates, firing),
              r.rateAhead(empty, rates, firing).then(() => 'published', () => 'refused'),
            ]).then(([fresh, none]) => {
              if (fresh.metric !== 'rateAgeDays') throw new Error('the metric key the filter reads is gone: ' + fresh.metric);
              if (fresh.value !== 0) throw new Error('a rate stored for today did not read as age zero: ' + fresh.value);
              if (none !== 'refused') throw new Error('no stored rate was published as an age');
              if (asked.join() !== '2026-09-29,2026-09-30') throw new Error('16:00 Kyiv did not ask for today and tomorrow: ' + asked.join());
              console.log('rate-ahead bundle loads, asks for today and tomorrow after 15:30 Kyiv, and refuses an age it could not read');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # CloudFormation waits on this bundle's answer, so one that cannot load holds the archive
          # deploy for the whole ServiceTimeout. The grant runs on a stub, in the shape it ships.
          node -e "
            const g = require('./archive-reader-grant.js');
            if (typeof g.handler !== 'function') throw new Error('handler missing from archive-reader-grant bundle');
            const sent = [];
            const answers = (text) => text.includes('FROM pg_tables WHERE') ? [{ tablename: 'bond_terms' }] : text.includes('rolcanlogin') ? [{ rolcanlogin: true }] : [];
            const client = { query: async (text) => { sent.push(text); return { rows: answers(text) }; } };
            const arn = 'arn:aws:iam::123456789012:role/quirenote-backend-archive-reader';
            g.grantReader(client, { ReaderRoleArn: arn }).then(() => {
              if (!sent.some((s) => s.startsWith('AWS IAM GRANT archive_reader TO ') && s.includes(arn))) throw new Error('no mapping sent: ' + JSON.stringify(sent));
              if (!sent.includes('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO archive_reader')) throw new Error('no default grant sent: ' + JSON.stringify(sent));
              if (!sent.some((s) => s.includes('has_table_privilege'))) throw new Error('the effective privileges were not checked: ' + JSON.stringify(sent));
              if (!sent.includes('GRANT SELECT ON public.\"bond_terms\" TO archive_reader')) throw new Error('no table grant sent: ' + JSON.stringify(sent));
              console.log('archive-reader-grant bundle loads, sends the mapping, the default and the table grant, and checks the reader');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # Six periods, the editors' rows and the account's settings, the stored ones over the
          # defaults, under a weak tag, a 304 to it stripped of its W/, a day's quotes under a tag of
          # its own, a date that is no day refused by name, a pending caller refused, no archive opened
          # for a ledger linking nothing, and the identifier the bundle step defined.
          node -e "
            const v = require('./view.js');
            if (typeof v.handler !== 'function') throw new Error('handler missing from view bundle');
            const id = v.derivationId();
            if (!/^[0-9a-f]{40}$/.test(id)) throw new Error('no derivation identifier in the view bundle: ' + id);
            const SUB = '9f1e2d3c-0000-4000-8000-0000000000d4';
            const EMAIL = 'owner@quirenote.com';
            let opened = 0;
            const deps = (status) => ({
              user: {
                query: async (text) => ({
                  rows: text.includes('data_version')
                    ? [{ data_version: '0' }]
                    : text.includes('FROM app_user')
                      ? [{ user_id: SUB, email: EMAIL, status: status, role: 'user', settings: JSON.stringify({ period: '3m' }) }]
                      : [],
                }),
              },
              archive: async () => { opened += 1; throw new Error('archive opened'); },
              rate: { served: async () => ({ rate: 41.4983, date: '2026-10-06' }) },
              now: () => Date.parse('2026-10-06T09:00:00Z'),
              derivationId: id,
            });
            const event = (headers, routeKey, query) => ({
              routeKey: routeKey || 'GET /view',
              headers: headers,
              ...(query ? { queryStringParameters: query } : {}),
              requestContext: { authorizer: { jwt: { claims: { token_use: 'id', sub: SUB, email: EMAIL } } } },
            });
            (async () => {
              const ok = await v.view(deps('active'), event({}));
              const tag = ok.headers.etag;
              if (ok.statusCode !== 200) throw new Error('an active caller was not served: ' + ok.statusCode);
              if (!tag || !tag.startsWith('W/')) throw new Error('the tag is not weak: ' + tag);
              if (ok.headers['cache-control'] !== 'private, no-cache') throw new Error('cache policy: ' + ok.headers['cache-control']);
              if (ok.headers['derivation-id'] !== id) throw new Error('no identifier header');
              const periods = Object.keys(JSON.parse(ok.body).view.periods).sort().join();
              if (periods !== '12m,1m,3m,6m,all,ytd') throw new Error('periods: ' + periods);
              const keys = Object.keys(JSON.parse(ok.body)).join();
              if (keys !== 'view,fx,assets,transactions,today,deleteCounts,settings,etag') throw new Error('body keys: ' + keys);
              const served = JSON.parse(ok.body).settings;
              if (served.period !== '3m' || served.language !== 'uk') throw new Error('the settings are not the stored ones over the defaults: ' + JSON.stringify(served));
              const again = await v.view(deps('active'), event({ 'if-none-match': tag.slice(2) }));
              if (again.statusCode !== 304 || 'body' in again || 'content-type' in again.headers || again.headers.etag !== tag) {
                throw new Error('the repeat was not a bare 304: ' + JSON.stringify(again));
              }
              const day = await v.view(deps('active'), event({}, 'GET /view/day', { date: '2026-10-05' }));
              if (day.statusCode !== 200) throw new Error('a day was not served: ' + day.statusCode);
              const dayKeys = Object.keys(JSON.parse(day.body)).join();
              if (dayKeys !== 'date,quotes,previous,savedAt') throw new Error('day body keys: ' + dayKeys);
              if (!day.headers.etag.startsWith('W/') || day.headers.etag === tag) throw new Error('the day tag is not a weak tag of its own: ' + day.headers.etag);
              const refused = await v.view(deps('active'), event({}, 'GET /view/day', { date: '2026-02-30' }));
              if (refused.statusCode !== 400 || JSON.parse(refused.body).issues[0].field !== 'date') throw new Error('a date that is no day was not refused by name: ' + refused.body);
              const pending = await v.view(deps('pending'), event({}));
              if (pending.statusCode !== 403 || JSON.parse(pending.body).error !== 'pending') throw new Error('a pending caller was admitted');
              if (opened !== 0) throw new Error('the archive was opened for a ledger that links nothing');
              console.log('view bundle loads, serves six periods, the editors rows and the stored settings under a weak tag, answers it 304 compared weakly, serves a day under a tag of its own and refuses a date that is no day, refuses a pending caller and opens no archive');
            })().catch((e) => { console.error(e); process.exit(1); });
          "
          # The export under a strong tag no cache keeps, a bare 304 to it, a write with no or a `*`
          # precondition refused before its key is claimed, and a pending caller refused; and the
          # settings patch: a type other than a merge patch refused, a theme refused by name, an empty
          # patch answered with the defaults and writing nothing, a pending caller refused.
          node -e "
            const m = require('./mutations.js');
            if (typeof m.handler !== 'function') throw new Error('handler missing from mutations bundle');
            const SUB = '9f1e2d3c-0000-4000-8000-0000000000d4';
            const EMAIL = 'owner@quirenote.com';
            const sent = [];
            const deps = (status) => ({
              user: {
                query: async (text) => {
                  sent.push(text);
                  return {
                    rows: text.includes('data_version')
                      ? [{ data_version: '0' }]
                      : text.includes('FROM app_user')
                        ? [{ user_id: SUB, email: EMAIL, status: status, role: 'user', settings: null }]
                        : [],
                  };
                },
              },
              token: () => '00000000-0000-4000-8000-000000000001',
              sleep: async () => {},
            });
            const claims = { authorizer: { jwt: { claims: { token_use: 'id', sub: SUB, email: EMAIL } } } };
            const read = (headers) => ({ routeKey: 'GET /state', headers: headers, requestContext: claims });
            const write = (headers) => ({
              routeKey: 'POST /mutations',
              headers: headers,
              body: JSON.stringify({ ops: [{ op: 'dataset.clear' }] }),
              requestContext: claims,
            });
            (async () => {
              const ok = await m.state(deps('active'), read({}));
              if (ok.statusCode !== 200 || ok.headers.etag !== '\"0\"') throw new Error('the export was not served under its tag: ' + JSON.stringify(ok));
              if (ok.headers['cache-control'] !== 'private, no-store') throw new Error('cache policy: ' + ok.headers['cache-control']);
              if (Object.keys(JSON.parse(ok.body)).join() !== 'assets,transactions,prices') throw new Error('export shape: ' + ok.body);
              const again = await m.state(deps('active'), read({ 'if-none-match': ok.headers.etag }));
              if (again.statusCode !== 304 || 'body' in again) throw new Error('the repeat was not a bare 304: ' + JSON.stringify(again));
              const key = '00000000-0000-4000-8000-0000000000aa';
              for (const headers of [{ 'idempotency-key': key }, { 'idempotency-key': key, 'if-match': '*' }]) {
                const res = await m.mutations(deps('active'), write(headers));
                if (res.statusCode !== 428) throw new Error('a write without a precondition was not refused 428: ' + JSON.stringify(res));
              }
              if (sent.some((s) => s.includes('mutation_key'))) throw new Error('a refused write claimed its key');
              const pending = await m.mutations(deps('pending'), write({}));
              if (pending.statusCode !== 403 || JSON.parse(pending.body).error !== 'pending') throw new Error('a pending caller was admitted');
              const patch = (headers, body) => ({ routeKey: 'PATCH /settings', headers: headers, body: body, requestContext: claims });
              const MERGE = 'application/merge-patch+json';
              if (typeof m.settings !== 'function') throw new Error('settings missing from mutations bundle');
              const wrongType = await m.settings(deps('active'), patch({ 'content-type': 'application/json' }, '{}'));
              if (wrongType.statusCode !== 415 || wrongType.headers['accept-patch'] !== MERGE) throw new Error('a patch of another type was not refused 415: ' + JSON.stringify(wrongType));
              const theme = await m.settings(deps('active'), patch({ 'content-type': MERGE }, JSON.stringify({ theme: 'dark' })));
              if (theme.statusCode !== 422 || JSON.parse(theme.body).issues[0].field !== 'theme') throw new Error('a theme was not refused by name: ' + theme.body);
              const empty = await m.settings(deps('active'), patch({ 'content-type': MERGE }, '{}'));
              if (empty.statusCode !== 200 || JSON.parse(empty.body).period !== 'all') throw new Error('an empty patch did not answer the defaults: ' + JSON.stringify(empty));
              const barred = await m.settings(deps('pending'), patch({ 'content-type': MERGE }, '{}'));
              if (barred.statusCode !== 403 || JSON.parse(barred.body).error !== 'pending') throw new Error('a pending caller patched settings');
              if (sent.some((s) => s.includes('UPDATE app_user SET settings'))) throw new Error('a refused or empty patch wrote the column');
              console.log('mutations bundle loads, exports under a strong tag no cache keeps, answers it 304, refuses a write with no or a * precondition before claiming its key, refuses a pending caller, and refuses a settings patch of another type or naming a theme, answers an empty one with the defaults and writes nothing');
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      # NO STEP HERE GATES THE DEPLOY ON WHAT THE PUSH CHANGED: a `changed` step is a rejected
      # design [*Deployment*].

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # On `main` too, where the archive exists though it is not deployed. No `|| true`: a failed
      # read fails with AWS's error, and an empty or `None` answer fails here rather than deploy.
      - name: Read the archive cluster identifier
        id: archive-id
        run: |
          id=$(aws cloudformation describe-stacks --stack-name quirenote-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterIdentifier'].OutputValue" --output text)
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "::error::quirenote-backend answered no ClusterIdentifier output"
            exit 1
          fi
          echo "cluster-id=$id" >> "$GITHUB_OUTPUT"

      # USER STACK FIRST, ARCHIVE SECOND, in two steps: the archive deploy DELETES the old
      # migration function, so running it first leaves the plan step below — and any later
      # dispatch of `migrate.yml` — resolving nothing.
      - name: Deploy the user stack
        working-directory: infra
        run: |
          # The four on this line go every time: none has a default, so an unset value has to
          # fail rather than resolve.
          overrides=("Environment=${ENVIRONMENT}" "AuthCertificateArn=${AUTH_CERTIFICATE_ARN}" "ApiCertificateArn=${API_CERTIFICATE_ARN}" "ArchiveClusterId=${ARCHIVE_CLUSTER_ID}")
          # THE GOOGLE SWITCH GOES EVERY TIME, like `OpenRegistration` below: left out, it keeps its
          # previous value. The PAIR goes only when set, as `sam deploy` REFUSES an empty value.
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            overrides+=("GoogleSignIn=enabled" "GoogleClientId=${GOOGLE_CLIENT_ID}" "GoogleClientSecret=${GOOGLE_CLIENT_SECRET}")
          # ONE HALF IS A MISTAKE, NOT A CHOICE: switching off here would drop Google sign-in, green.
          elif [ -n "$GOOGLE_CLIENT_ID" ] || [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET must be set together, or neither to switch Google sign-in off"
            exit 1
          else
            overrides+=("GoogleSignIn=disabled")
          fi
          # ALWAYS PASSED, AND THE `else` IS THE POINT: `sam deploy` sends `UsePreviousValue`
          # for any parameter absent once the stack exists, so clearing the variable would
          # leave the stack `open`, pool and trigger still admitting strangers.
          if [ -n "$OPEN_REGISTRATION" ]; then
            overrides+=("OpenRegistration=${OPEN_REGISTRATION}")
          else
            overrides+=("OpenRegistration=closed")
          fi
          # ONE PREFIX PER ENVIRONMENT, the only one its deploy role may write: `sam deploy` reuses an
          # object already at its md5-named key, so a shared namespace lets dev plant prod's bundle.
          sam deploy \
            --template-file template-user.yaml \
            --stack-name "quirenote-backend-user-${ENVIRONMENT}" \
            --parameter-overrides "${overrides[@]}" \
            --region "$AWS_REGION" \
            --s3-bucket "quirenote-sam-artifacts-${AWS_ACCOUNT_ID}" \
            --s3-prefix "${ENVIRONMENT}" \
            --role-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/quirenote-backend-cfn-exec" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          # TWO CERTIFICATES, IN TWO REGIONS, AND NEITHER SUBSTITUTES FOR THE OTHER — the pool's
          # is fronted by CloudFront, the API's custom domain is regional. See the template.
          AUTH_CERTIFICATE_ARN: ${{ secrets.AUTH_CERTIFICATE_ARN }}
          API_CERTIFICATE_ARN: ${{ secrets.API_CERTIFICATE_ARN }}
          # A VARIABLE, NOT A SECRET: which environment runs `open` is not worth hiding.
          OPEN_REGISTRATION: ${{ vars.OPEN_REGISTRATION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ARCHIVE_CLUSTER_ID: ${{ steps.archive-id.outputs.cluster-id }}

      # Skipped on `main`, so a dispatch there cannot repair the archive — dispatch on `dev`.
      # NAMED_IAM for the reader role's fixed name.
      - name: Deploy the archive stack
        id: archive
        if: github.ref_name != 'main'
        working-directory: infra
        run: |
          sam deploy \
            --stack-name quirenote-backend \
            --region "$AWS_REGION" \
            --s3-bucket "quirenote-sam-artifacts-${AWS_ACCOUNT_ID}" \
            --s3-prefix "${ENVIRONMENT}" \
            --role-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/quirenote-backend-cfn-exec" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          # The job's own rule rather than a literal `dev`, so the prefix follows the credentials.
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      # This run gave its user stack the identifier read before the archive deployed, prod's holds
      # what `main` last read: a replaced cluster fails the run, repaired here and on `main`.
      - name: Check the archive kept the cluster the user stack was given
        if: steps.archive.outcome == 'success'
        run: |
          id=$(aws cloudformation describe-stacks --stack-name quirenote-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterIdentifier'].OutputValue" --output text)
          if [ "$id" != "$GIVEN" ]; then
            echo "::error::the archive now answers ClusterIdentifier $id; this run gave the dev user stack $GIVEN, and prod's keeps what main last read. Re-run this workflow on dev, then dispatch it on main."
            exit 1
          fi
        env:
          GIVEN: ${{ steps.archive-id.outputs.cluster-id }}

      # A CHANGE SET DOES NOT COUNT THE STACK `Description` AS A CHANGE, AND `sam deploy` HAS NO
      # OTHER ROUTE. A commit that changes only that text gets back "No updates are to be
      # performed", `--no-fail-on-empty-changeset` above reports that as success, and the text an
      # operator reads in the console stays whatever it was — a correction merged, deployed green
      # and never applied. THE FLAG IS NOT THE FAULT: a commit that touches no backend resource
      # SHOULD deploy green; what tells that apart from "what I shipped is not what is deployed" is
      # a read of the stack afterwards, and nothing else can. A `Metadata` key and a parameter
      # default are refused the same way; an added `Output` is not, its change set being created
      # rather than refused.
      #
      # AND THE REPAIR WORKS: `update-stack`, which is not a change set, applies the very body
      # `create-change-set` refuses, so the failure below names a step that does something.
      #
      # IT FAILS THE JOB THE PLAN IS IN. A migration THIS RUN'S OWN COMMIT ships is never stranded
      # by that — new SQL means a new zip, so the change set is not empty and the Description
      # lands with it — but one left pending by an earlier run waits for the `migrate.yml`
      # dispatch that is its repair path anyway.
      - name: Check each stack this run deployed carries the description it shipped
        working-directory: infra
        run: |
          check() {
            # `$( )` DROPS THE TRAILING NEWLINE ON BOTH SIDES, the one a folded scalar carries and
            # CloudFormation stores, so this compares the text rather than YAML's chomping.
            shipped=$(node -e 'const {parseDocument}=require("yaml"),fs=require("fs");process.stdout.write(String(parseDocument(fs.readFileSync(process.argv[1],"utf8")).toJS().Description??""))' "$2")
            # NO `|| true`: under `bash -e` a read that fails takes the job down with the AWS
            # error, which beats comparing against an empty string and blaming the deploy.
            deployed=$(aws cloudformation describe-stacks --stack-name "$1" \
              --query 'Stacks[0].Description' --output text)
            if [ "$shipped" != "$deployed" ]; then
              echo "::error::$1 is not running the description $2 shipped"
              printf 'shipped  (%s): %s\n' "$2" "$shipped"
              printf 'deployed (%s): %s\n' "$1" "$deployed"
              echo 'Re-submit the DEPLOYED template with the new Description, which differs from'
              echo 'what is deployed in nothing else:'
              echo "  aws cloudformation get-template --stack-name $1 --template-stage Original --query TemplateBody --output text > t.yaml"
              echo "  # replace the Description in t.yaml with the one in $2, then, with one"
              echo "  # ParameterKey=<name>,UsePreviousValue=true per parameter the stack declares:"
              echo "  aws cloudformation update-stack --stack-name $1 --template-body file://t.yaml --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND --parameters ..."
              exit 1
            fi
            echo "$1 carries the description $2 ships"
          }
          check "quirenote-backend-user-${ENVIRONMENT}" template-user.yaml
          # OFF THE DEPLOY'S OWN OUTCOME rather than a second copy of its condition: `main` ships
          # no archive, and a restated `!= 'main'` here is one edit away from comparing
          # production's tree against a stack `dev` deployed.
          [ "${{ steps.archive.outcome }}" != success ] || check quirenote-backend template.yaml
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      # LAST IN THIS JOB, AND THAT IS THE POINT: a plan read before `sam deploy` counts the
      # statements the PREVIOUS bundle carried, and would gate this run on them. It runs here
      # rather than in the gated job below because that job's `if:` reads its count, and because a
      # plan contacts no object the migration owns.
      - name: Plan the migration
        id: plan
        uses: $/.github/actions/invoke-migration
        with:
          target: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          mode: dry-run

  # THE APPLY, AND NO HUMAN IN FRONT OF IT: a required reviewer is a rejected design
  # [*User schema and deletes*]. The `notify` job below is the signal instead — a failure that
  # reaches the task list beats a human asked to approve one.
  #
  # SKIPPED OUTRIGHT WHEN NOTHING IS PENDING, so a version cut carrying no schema deploys
  # untouched.
  migrate:
    needs: deploy
    # `!= '0'`, NOT A NUMERIC TEST, AND THE DIRECTION IS DELIBERATE: an output that failed to
    # resolve is the empty string, which this reads as "something might be pending" and runs. The
    # cost of being wrong that way is a rehearse and an apply that do nothing; the cost of the
    # other way is a schema change nobody notices, the state this job exists to prevent.
    if: needs.deploy.outputs.pending != '0'
    runs-on: ubuntu-latest
    # TWO INVOCATIONS OF A RUNNER WITH NO CLIENT TIMEOUT. The action drops `--cli-read-timeout`
    # so a slow migration is never re-invoked, which leaves Lambda's own 900s as the only bound —
    # and Actions cannot see it. A hung invoke would otherwise hold this group, and a paid runner,
    # for the 360-minute default, blocking the very dispatch that would repair it.
    timeout-minutes: 45
    concurrency:
      # THE SAME STRING `migrate.yml` TAKES FOR THIS CLUSTER. Group names are repository-wide, so
      # an apply from here and a hand dispatch can never overlap on one database — the
      # serialisation DSQL cannot give, having no advisory locks.
      group: migrate-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false # never interrupt DDL in flight
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      # NO CHECKOUT: the SQL applied is the copy baked into the DEPLOYED bundle, not the ref. `$/`
      # is what keeps that true while still sharing one action — it resolves from this repository
      # at the commit the run is on, without a workspace.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # REHEARSE FIRST, ON THE TARGET CLUSTER, FROM THE SAME BUNDLE: a throwaway schema dropped
      # CASCADE. It stands in for the rollback DSQL does not have, and it is worth a second
      # invocation only because it runs against the database that is about to change.
      - uses: $/.github/actions/invoke-migration
        with:
          target: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          mode: rehearse

      - uses: $/.github/actions/invoke-migration
        with:
          target: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          mode: apply

  # THE SIGNAL INSTEAD OF A REVIEWER, and it gates nothing. Nobody watches an automatic apply, and
  # the two things that would otherwise carry the news are both weak: a red run is an email governed
  # by a personal notification setting this repository cannot read or test, and a log expires. An
  # issue is durable and is this repository's only task list.
  #
  # THE CONDITION IS READ OFF THE RESULTS, NOT `failure()`, and that is not style. GitHub documents
  # `failure()` as true "if any ancestor job fails" — `deploy` is an ancestor, and it runs the whole
  # suite, so a single failing unit test would open an issue saying the code was live against an
  # unmigrated schema when `sam deploy` had not run at all. The three clauses below say exactly
  # the state worth waking someone for: the stacks deployed, and the schema did not follow.
  #
  # `!= success && != skipped` RATHER THAN `== failure`, because a job CANCELLED while pending on
  # `migrate-<target>` — which a hand dispatch can do — leaves the same state and is not a failure.
  # `skipped` is the healthy case: nothing was pending.
  #
  # A FAILED PLAN IS DELIBERATELY OUTSIDE THIS. It fails `deploy`, so the first clause excludes it —
  # the stacks did deploy, but no migration was attempted, nothing is half-applied, and a red deploy
  # is the ordinary signal for it. Widening to any red deploy is what would file an issue per broken
  # test and teach the channel to be ignored.
  notify:
    needs: [deploy, migrate]
    if: >-
      always() && needs.deploy.result == 'success' &&
      needs.migrate.result != 'success' && needs.migrate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REPLACES the workflow's grant for this job rather than adding to it: no `id-token`, no AWS,
    # nothing to write but the issue.
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ needs.migrate.result }}
          ARCHIVE: ${{ needs.deploy.outputs.archive }}
        run: |
          # ONE OPEN ISSUE PER CLUSTER, commented rather than duplicated: a migration that fails
          # keeps failing on every later push, and three issues about one broken ledger is triage
          # work that hides the first report. The marker is invisible in the rendered body.
          marker="<!-- deploy-backend-migration-failure:${TARGET} -->"
          # `main` deploys the user stack alone, and this body is the only durable record.
          if [ "$ARCHIVE" = success ]; then stacks='Both stacks deployed'; else stacks='The user stack deployed'; fi
          body=$(printf '%s\n\n@%s the schema did NOT follow the code on `%s` — the apply came back `%s`.\n\n%s this commit, so the handlers of the `%s` user stack run against a schema that has not followed them. Expand/contract is what makes it survivable; it is not a state to leave.\n\n- Run: %s\n- Commit: `%s`\n- Report: the `migrate-%s-*` artifacts on that run carry `out.json`, one per mode.\n\n**Read the report before repairing — the mode that failed decides the repair.** A failed `rehearse` is repaired by what the `errorMessage` in the report says. `was not started` is the budget refusing a statement: that statement and every one after it were never rehearsed, and a rehearsal, which replays the whole history, can never get further, so read them, then dispatch `migrate.yml` with `target: %s`, `mode: apply`, again for as long as each run gets further, since an apply resumes where the ledger stops. The message lists what each finished file cost and the run total, which tells a history grown past one invocation from one file that ate it. `Task timed out` is the invocation killed, by one statement that ran long or by a teardown left too little time, and nothing names which: do NOT apply, and drop by hand whatever `migrate_rehearsal_*` schema the cluster still holds. A SQL error is SQL the cluster refused on a throwaway schema: fix the migration on a branch, and do NOT apply. Anything else, such as no report at all, is read off the run log before anything is applied. A failed `apply` is resumable — dispatch `migrate.yml` with `target: %s`, `mode: apply`, since the ledger is keyed by statement hash and a re-run continues rather than restarting, which is what a half-applied file needs. If the report names a rehearsal schema that would not drop, drop `migrate_rehearsal_*` by hand first.\n' \
            "$marker" "$OWNER" "$TARGET" "$OUTCOME" "$stacks" "$TARGET" "$RUN_URL" "$SHA" "$TARGET" "$TARGET" "$TARGET")
          # THE LIST API, NOT SEARCH: `--author` keeps gh on it, as the bot `github-actions[bot]`;
          # `--label`, `--search`, `--milestone`, `--type` and their short forms switch gh to
          # search, an INDEX minutes behind a just-created issue, and a miss here duplicates.
          # `|| true` because the step runs under `bash -e`, where one 5xx on the lookup would
          # abort before either branch and lose the only durable signal the run leaves.
          existing=$(gh issue list --repo "$REPO" --state open --author 'github-actions[bot]' \
            --limit 100 --json number,body \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].number // empty" \
            || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "commented on #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create --repo "$REPO" \
              --title "Migration failed on $TARGET — the code is live and the schema is not" \
              --label bug --label area:infra --body "$body")
            echo "opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi
