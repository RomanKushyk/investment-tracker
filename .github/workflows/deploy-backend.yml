name: Deploy backend

on:
  push:
    # BOTH BRANCHES, DIFFERENT STACKS: `dev` the archive and the dev user stack, `main` the
    # prod user stack alone — one archive serves every environment (*Cloud target*).
    branches: [dev, main]
    paths:
      - 'infra/**'
      # NO EXCLUSION FOR THE DRAFT DDL: `deploy-frontend.yml` already ignores `infra/**`, so a
      # drafts-only push excluded here would match NO workflow and run no gates at all.
      # THE WHOLE PACKAGE, NOT THE MODULES THE HANDLERS IMPORT: the handlers bundle it, and the
      # four-file list this replaced could only ever fail one way — an import added to a handler
      # and no deploy triggered, in silence. A superset costs a no-op run; a subset ships nothing.
      - 'packages/core/**'
      # The bundle INLINES root dependencies, so a `zod` bump changes the deployed Lambda's
      # code — without these two a security bump would ship the frontend and leave it behind.
      - 'package.json'
      - 'pnpm-lock.yaml'
      # `.github/**`, not just this file: deploy-frontend skips `**/*.md`, so without this NO
      # workflow runs on the commit that replaces the landing page. Do not narrow it to a list.
      - '.github/**'
  workflow_dispatch:

concurrency:
  # PER BRANCH — true only while `main` deploys no archive, or two `sam deploy` meet one stack.
  #
  # THE WHOLE RUN, NOT THE DEPLOY JOB, and that is what keeps the bundle still under the migration:
  # a run is not finished while its `migrate` job rehearses and applies, so it keeps this group,
  # and the next push cannot `sam deploy` a new handler and new `dist/migrations/*.sql` underneath
  # an apply already in flight against the old one. Grouped on the deploy job alone, the second of
  # two quick pushes would do exactly that, and the apply would run SQL its own plan never counted.
  group: deploy-backend-${{ github.ref_name }}
  # `max` QUEUES UP TO 100 RATHER THAN KEEPING ONE, and it is what makes holding the group safe:
  # the default `single` CANCELS whichever run was already pending when a new one arrives, so a
  # migration slow enough to outlast two pushes would drop the middle one — stack never updated,
  # nothing red. Queued, they wait and run in order. Invalid with `cancel-in-progress: true`.
  queue: max
  cancel-in-progress: false # never interrupt a CloudFormation update in flight

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # THIS JOB INVOKES THE RUNNER TOO, in its last step, and holds the workflow group while it
    # does: the plan carries no client timeout either, so a hung invoke here would queue every
    # later push on the branch behind it for the six-hour default. WELL CLEAR OF A SLOW STACK
    # rather than tight — a managed-login domain change takes CloudFormation tens of minutes, and
    # a timeout here kills `sam deploy` while CloudFormation carries on regardless.
    timeout-minutes: 120
    outputs:
      # What the gated job below is conditioned on. Read from the runner AFTER the stack update, so
      # it counts the statements in the bundle THIS run shipped.
      pending: ${{ steps.plan.outputs.pending }}
    environment:
      # EVERY REF THAT IS NOT `main` RESOLVES `dev`, INCLUDING A TAG: a dispatch on `vX.Y.Z`
      # asks for the DEV stacks from production's tree, and only the branch policy refuses it.
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable pnpm via corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      # THE WHOLE SUITE, not a path-filtered selection: two hand-kept lists both leaked, and
      # deploy-frontend skips an infra-only push, leaving these tests green but never run.
      - run: pnpm test

      # Same asymmetry: prettier covers infra/, but only deploy-frontend ran it.
      - run: pnpm format:check

      # AND THE SAME AGAIN, TWICE: root `tsconfig.json` excludes infra/, so a type error there
      # survived `pnpm typecheck`, esbuild stripped it, and it would have deployed. `pnpm exec`
      # because infra resolves typescript from the ROOT tree. All of this before any credential.
      - run: pnpm exec tsc --noEmit -p infra
      - run: pnpm lint

      # Bundled here rather than by `sam build`: both SAM builders sandbox the CodeUri
      # directory, so the symlink to the domain package vanishes with it. The list is held to the
      # templates by a test, and so is the ABSENCE of `--packages=external`, which would
      # externalise `@quirenote/core` into a bare require Lambda cannot resolve.
      - name: Bundle the handlers
        working-directory: infra
        run: |
          for entry in capture migrate pre-signup applications approve backup-freshness pool-usage; do
            npx --yes esbuild@0.28.2 "src/$entry.ts" \
              --bundle --platform=node --target=node22 --format=cjs \
              --outfile="dist/$entry.js" --sourcemap \
              --external:pg-native
          done
          # The SQL is DATA read at runtime, not code esbuild can inline, so it rides along.
          mkdir -p dist/migrations
          cp migrations/*.sql dist/migrations/
          ls -la dist/ dist/migrations/

      # Catches what typecheck cannot: that the bundle LOADS — an ESM one dies on `Dynamic
      # require of "events"`. No package.json here, like the zip, or node would read it as ESM.
      - name: Smoke-test the bundle
        run: |
          mkdir -p /tmp/bundle-check
          # HELD TO THE BUNDLE LIST BY A TEST, because this line is hand-kept: a guard derived
          # from the esbuild step alone let a handler deploy having never once been loaded.
          cp infra/dist/capture.js infra/dist/migrate.js infra/dist/pre-signup.js infra/dist/applications.js infra/dist/approve.js infra/dist/backup-freshness.js infra/dist/pool-usage.js /tmp/bundle-check/
          cp -r infra/dist/migrations /tmp/bundle-check/
          cd /tmp/bundle-check
          # `import.meta.url` is EMPTY in a cjs bundle, so the SQL is found by LAMBDA_TASK_ROOT.
          LAMBDA_TASK_ROOT=/tmp/bundle-check node -e "
            const g = require('./migrate.js');
            if (typeof g.handler !== 'function') throw new Error('handler missing from migrate bundle');
            // The stub's ledger read comes back empty, so every statement reads as pending —
            // what an unmigrated cluster says, and the assertion is that the SQL was FOUND.
            g.migrate({ query: async () => ({ rows: [] }) }, { mode: 'dry-run' }).then((r) => {
              const pending = r.files.reduce((n, f) => n + f.pending, 0);
              // PER FILE, because the totals cannot see a single empty one: migrate() reports
              // one entry per MIGRATIONS entry, so those lengths agree by construction. The
              // floor is a floor, not a count — a count derived here would compare the bundle
              // against itself, and a hand-kept figure is invisible to all five gates.
              const empty = r.files.filter((f) => f.pending === 0).map((f) => f.file);
              if (empty.length || r.files.length !== g.MIGRATIONS.length || pending < 8) {
                throw new Error('migrate bundle cannot read its SQL: ' + JSON.stringify(r));
              }
              console.log('migrate bundle loads and finds its migrations');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          node -e "
            const m = require('./capture.js');
            if (typeof m.handler !== 'function') throw new Error('handler missing from bundle');
            // 22:00Z on the 11th is 01:00 Kyiv on the 12th: the scheduled firing, and the
            // instant where subtracting from the UTC date would silently yield D-2. That the
            // two rules DIFFER is asserted as well, because one as_of would pass either way.
            const run = new Date('2026-08-11T22:00:00Z');
            if (m.inzhurAsOf(run) !== '2026-08-12') {
              throw new Error('inzhurAsOf wrong: it must be the Kyiv date of the run (D71)');
            }
            if (m.nbuAsOf(run) !== '2026-08-11') {
              throw new Error('nbuAsOf wrong: it must be the previous Kyiv date (D71)');
            }
            if (m.inzhurAsOf(run) === m.nbuAsOf(run)) {
              throw new Error('the two as_of rules collapsed back into one (D71)');
            }
            console.log('bundle loads, handler present, both as_of rules correct');
          "
          # A stranger reaches this path: a bundle that fails to load fails the SIGN-UP.
          node -e "
            const p = require('./pre-signup.js');
            if (typeof p.handler !== 'function') throw new Error('handler missing from pre-signup bundle');
            const event = (verified) => ({
              triggerSource: 'PreSignUp_ExternalProvider',
              userPoolId: 'eu-north-1_EXAMPLE',
              userName: 'Google_1',
              request: { userAttributes: { email: 'a@b.com', email_verified: verified } },
              response: {},
            });
            let linked = 0;
            const idp = {
              listUsers: async () => ({ Users: [{ Username: 'u', UserStatus: 'CONFIRMED' }] }),
              adminLinkProviderForUser: async () => { linked++; return {}; },
            };
            // AND THE REFUSAL, in the bundled shape: an address with no local account must
            // reject. A stranger reaches this path, and a refusal that only works as ESM is
            // a refusal that does not work.
            const empty = { listUsers: async () => ({ Users: [] }), adminLinkProviderForUser: async () => ({}) };
            // AND THE SOURCE THAT MUST NEVER BE REFUSED, the mirror of the case above: AWS
            // fires this trigger on AdminCreateUser too, and that call IS approval.
            const approving = { triggerSource: 'PreSignUp_AdminCreateUser', userPoolId: 'eu-north-1_EXAMPLE', userName: 'u', request: { userAttributes: { email: 'a@b.com' } }, response: {} };
            Promise.all([
              p.preSignUp(event('true'), idp),
              p.preSignUp(event('false'), idp),
              p.preSignUp(event('true'), empty).then(() => 'resolved', () => 'refused'),
              p.preSignUp(approving, empty).then(() => 'admitted', () => 'refused'),
            ])
              .then(([, , unapproved, approval]) => {
                if (approval !== 'admitted') {
                  throw new Error('pre-signup bundle refused the approval path');
                }
                // One link across the first two: the verified event links, the unverified one
                // must not. A bundle that linked both, or neither, is the failure.
                if (linked !== 1) {
                  throw new Error('pre-signup bundle links on the wrong condition: ' + linked);
                }
                if (unapproved !== 'refused') {
                  throw new Error('pre-signup bundle admitted an address with no application');
                }
                console.log('pre-signup bundle loads, links only a verified address and refuses an unapproved one');
              }).catch((e) => { console.error(e); process.exit(1); });
          "
          # The applications route is UNAUTHENTICATED: it fails for a stranger with no account.
          node -e "
            const a = require('./applications.js');
            if (typeof a.handler !== 'function') throw new Error('handler missing from applications bundle');
            const asked = [];
            const client = { query: async (text, values) => { asked.push({ text, values }); return { rows: [] }; } };
            const submit = (email) => ({ body: JSON.stringify({ email }), isBase64Encoded: false });
            Promise.all([
              a.applications(client, submit('New@Quirenote.com')),
              // Escaped rather than typed, because the character is the point — a capital I
              // with a dot, which JavaScript folds to two codepoints and Postgres does not —
              // and a non-ASCII byte inside a shell string inside YAML has too many places to
              // be re-encoded on the way to node.
              a.applications(client, submit(String.fromCharCode(304) + 'REN@quirenote.com')),
            ]).then(([ok, bad]) => {
              if (ok.statusCode !== 202) throw new Error('valid address not accepted: ' + ok.statusCode);
              if (bad.statusCode !== 400) throw new Error('bad address not refused: ' + bad.statusCode);
              // One statement for two submissions: the refusal never reached the cluster, and
              // the acceptance was bound rather than interpolated.
              if (asked.length !== 1) throw new Error('cluster asked ' + asked.length + ' times, wanted 1');
              if (asked[0].values[0] !== 'new@quirenote.com') {
                throw new Error('address not folded: ' + asked[0].values[0]);
              }
              console.log('applications bundle loads, accepts one address and refuses the other');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # Both refusals land BEFORE any Cognito call — which would spend a monthly active user
          # and mail an address, neither retractable.
          node -e "
            const a = require('./approve.js');
            if (typeof a.handler !== 'function') throw new Error('handler missing from approve bundle');
            process.env.USER_POOL_ID = 'eu-north-1_EXAMPLE';
            const ADMIN = '9f1e2d3c-0000-4000-8000-00000000ad11';
            const DEMO = '00000000-0000-4000-8000-00000000de70';
            const calls = [];
            const idp = {
              adminCreateUser: async () => { calls.push('create'); return {}; },
              adminGetUser: async () => { calls.push('get'); return {}; },
              adminDisableUser: async () => { calls.push('disable'); return {}; },
            };
            const client = (role) => ({
              query: async (text) => ({
                rows: text.includes('applied_at')
                  ? [{ user_id: DEMO, email: 'demo@quirenote.com', status: 'active', role: 'demo', applied_at: new Date() }]
                  : [{ user_id: ADMIN, email: 'owner@quirenote.com', status: 'active', role: role }],
              }),
            });
            const event = {
              routeKey: 'POST /admin/users/{id}/approve',
              pathParameters: { id: DEMO },
              requestContext: { authorizer: { jwt: { claims: { token_use: 'id', sub: ADMIN, email: 'owner@quirenote.com' } } } },
            };
            Promise.all([
              a.approve(client('super_admin'), idp, event),
              a.approve(client('user'), idp, event),
            ]).then(([demo, ordinary]) => {
              if (demo.statusCode !== 409) throw new Error('approve bundle did not refuse a demo row: ' + demo.statusCode);
              if (ordinary.statusCode !== 403) throw new Error('approve bundle admitted an ordinary user: ' + ordinary.statusCode);
              if (calls.length) throw new Error('approve bundle called Cognito on a refusal: ' + calls.join());
              console.log('approve bundle loads and refuses a demo row and an ordinary caller, without calling Cognito');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # What matters here is the FILTER: a read that lost `ByResourceArn` answers with the
          # whole vault, ARCHIVE included, and calls prod's data fresh on a night it was not.
          node -e "
            const b = require('./backup-freshness.js');
            if (typeof b.handler !== 'function') throw new Error('handler missing from backup-freshness bundle');
            const target = { vault: 'quirenote-backups', clusterArn: 'arn:cluster', cluster: 'cluster-id' };
            const asked = [];
            const vault = (points) => ({ listRecoveryPoints: async (input) => { asked.push(input); return { RecoveryPoints: points }; } });
            Promise.all([
              b.backupFreshness(vault([{ Status: 'COMPLETED', CompletionDate: new Date('2026-09-15T02:00:00Z') }]), target, new Date('2026-09-15T12:00:00Z')),
              b.backupFreshness(vault([]), target, new Date('2026-09-15T12:00:00Z')),
            ]).then(([fresh, none]) => {
              if (asked[0].ByResourceArn !== target.clusterArn) throw new Error('the read was not filtered by the cluster arn');
              if (asked[0].BackupVaultName !== target.vault) throw new Error('the read named the wrong vault');
              if (fresh.value !== 10) throw new Error('age wrong: ' + fresh.value);
              if (fresh.cluster !== target.cluster) throw new Error('the metric line carries no cluster dimension');
              if (!(none.value > fresh.value)) throw new Error('an empty vault did not read as older than a backed-up one: ' + none.value);
              console.log('backup-freshness bundle loads, filters by the cluster arn, and puts an empty vault at the bad end');
            }).catch((e) => { console.error(e); process.exit(1); });
          "
          # Here the REFUSAL is what matters: a pool answering without `EstimatedNumberOfUsers`
          # must throw, or an unreadable count sits on the alarm's HEALTHY side forever.
          node -e "
            const u = require('./pool-usage.js');
            if (typeof u.handler !== 'function') throw new Error('handler missing from pool-usage bundle');
            const asked = [];
            const idp = (answer) => ({ describeUserPool: async (input) => { asked.push(input); return answer; } });
            Promise.all([
              u.poolUsage(idp({ UserPool: { EstimatedNumberOfUsers: 7 } }), 'eu-north-1_EXAMPLE'),
              u.poolUsage(idp({ UserPool: { EstimatedNumberOfUsers: 0 } }), 'eu-north-1_EXAMPLE'),
              u.poolUsage(idp({ UserPool: {} }), 'eu-north-1_EXAMPLE').then(() => 'published', () => 'refused'),
            ]).then(([counted, empty, unknown]) => {
              if (asked[0].UserPoolId !== 'eu-north-1_EXAMPLE') throw new Error('the read named the wrong pool');
              if (counted.value !== 7) throw new Error('count wrong: ' + counted.value);
              if (counted.metric !== 'poolUsers') throw new Error('the metric key the filter reads is gone: ' + counted.metric);
              if (empty.value !== 0) throw new Error('an empty pool was not published as zero: ' + empty.value);
              if (unknown !== 'refused') throw new Error('an unreadable count was published as a number');
              if (u.FREE_TIER_USERS !== 10000) throw new Error('the free-tier ceiling moved: ' + u.FREE_TIER_USERS);
              console.log('pool-usage bundle loads, counts an empty pool as zero, and refuses a count it could not read');
            }).catch((e) => { console.error(e); process.exit(1); });
          "

      # NO DEPLOY GATE HERE, AND THAT IS STILL A DECISION, though half its reasoning has expired.
      # A `changed` step suppressing the deploy on a prose push was written and removed because
      # `concurrency` cancelled PENDING runs, so a real infra push could be dropped from the queue
      # while the next run's range no longer covered it — stack never updated, nothing red. That
      # half is closed: `queue: max` above queues rather than cancels, so a push's range is no
      # longer lost. What remains is that a range-based gate still needs a watermark of the last
      # SHA actually deployed to be correct across a re-run or a revert, and a skipped deploy is
      # worse than a wasted one. Reconsidering it is its own change, not a line here.

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # USER STACK FIRST, ARCHIVE SECOND, in two steps: the archive deploy DELETES the old
      # migration function, so running it first leaves the plan step below — and any later
      # dispatch of `migrate.yml` — resolving nothing.
      - name: Deploy the user stack
        working-directory: infra
        run: |
          # THE GOOGLE PAIR BELOW IS PASSED ONLY WHEN SET, because `sam deploy` REFUSES an empty
          # value in its own parser, before any AWS call. The three on this line go every time:
          # neither certificate has a default, so an unset secret has to fail rather than resolve.
          overrides=("Environment=${ENVIRONMENT}" "AuthCertificateArn=${AUTH_CERTIFICATE_ARN}" "ApiCertificateArn=${API_CERTIFICATE_ARN}")
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            overrides+=("GoogleClientId=${GOOGLE_CLIENT_ID}" "GoogleClientSecret=${GOOGLE_CLIENT_SECRET}")
          fi
          # ALWAYS PASSED, AND THE `else` IS THE POINT: `sam deploy` sends `UsePreviousValue`
          # for any parameter absent once the stack exists, so clearing the variable would
          # leave the stack `open`, pool and trigger still admitting strangers.
          if [ -n "$OPEN_REGISTRATION" ]; then
            overrides+=("OpenRegistration=${OPEN_REGISTRATION}")
          else
            overrides+=("OpenRegistration=closed")
          fi
          sam deploy \
            --template-file template-user.yaml \
            --stack-name "quirenote-backend-user-${ENVIRONMENT}" \
            --parameter-overrides "${overrides[@]}" \
            --region "$AWS_REGION" \
            --s3-bucket "quirenote-sam-artifacts-${AWS_ACCOUNT_ID}" \
            --role-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/quirenote-backend-cfn-exec" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          # TWO CERTIFICATES, IN TWO REGIONS, AND NEITHER SUBSTITUTES FOR THE OTHER — the pool's
          # is fronted by CloudFront, the API's custom domain is regional. See the template.
          AUTH_CERTIFICATE_ARN: ${{ secrets.AUTH_CERTIFICATE_ARN }}
          API_CERTIFICATE_ARN: ${{ secrets.API_CERTIFICATE_ARN }}
          # A VARIABLE, NOT A SECRET: which environment runs `open` is not worth hiding.
          OPEN_REGISTRATION: ${{ vars.OPEN_REGISTRATION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # Skipped on `main`, so a dispatch there cannot repair the archive — dispatch on `dev`.
      - name: Deploy the archive stack
        id: archive
        if: github.ref_name != 'main'
        working-directory: infra
        run: |
          sam deploy \
            --stack-name quirenote-backend \
            --region "$AWS_REGION" \
            --s3-bucket "quirenote-sam-artifacts-${AWS_ACCOUNT_ID}" \
            --role-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/quirenote-backend-cfn-exec" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      # A CHANGE SET DOES NOT COUNT THE STACK `Description` AS A CHANGE, AND `sam deploy` HAS NO
      # OTHER ROUTE. A commit that changes only that text gets back "No updates are to be
      # performed", `--no-fail-on-empty-changeset` above reports that as success, and the text an
      # operator reads in the console stays whatever it was — a correction merged, deployed green
      # and never applied. THE FLAG IS NOT THE FAULT: a commit that touches no backend resource
      # SHOULD deploy green. What was missing is the run telling that apart from "what I shipped
      # is not what is deployed", which nothing but a read of the stack afterwards can do. A
      # `Metadata` key and a parameter default are refused the same way; an added `Output` is not,
      # its change set being created rather than refused.
      #
      # AND THE REPAIR WORKS: `update-stack`, which is not a change set, applies the very body
      # `create-change-set` refuses, so the failure below names a step that does something.
      #
      # IT FAILS THE JOB THE PLAN IS IN. A migration THIS RUN'S OWN COMMIT ships is never stranded
      # by that — new SQL means a new zip, so the change set is not empty and the Description
      # lands with it — but one left pending by an earlier run waits for the `migrate.yml`
      # dispatch that is its repair path anyway.
      - name: Check each stack this run deployed carries the description it shipped
        working-directory: infra
        run: |
          check() {
            # `$( )` DROPS THE TRAILING NEWLINE ON BOTH SIDES, the one a folded scalar carries and
            # CloudFormation stores, so this compares the text rather than YAML's chomping.
            shipped=$(node -e 'const {parseDocument}=require("yaml"),fs=require("fs");process.stdout.write(String(parseDocument(fs.readFileSync(process.argv[1],"utf8")).toJS().Description??""))' "$2")
            # NO `|| true`: under `bash -e` a read that fails takes the job down with the AWS
            # error, which beats comparing against an empty string and blaming the deploy.
            deployed=$(aws cloudformation describe-stacks --stack-name "$1" \
              --query 'Stacks[0].Description' --output text)
            if [ "$shipped" != "$deployed" ]; then
              echo "::error::$1 is not running the description $2 shipped"
              printf 'shipped  (%s): %s\n' "$2" "$shipped"
              printf 'deployed (%s): %s\n' "$1" "$deployed"
              echo 'Re-submit the DEPLOYED template with the new Description, which differs from'
              echo 'what is deployed in nothing else:'
              echo "  aws cloudformation get-template --stack-name $1 --template-stage Original --query TemplateBody --output text > t.yaml"
              echo "  # replace the Description in t.yaml with the one in $2, then, with one"
              echo "  # ParameterKey=<name>,UsePreviousValue=true per parameter the stack declares:"
              echo "  aws cloudformation update-stack --stack-name $1 --template-body file://t.yaml --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND --parameters ..."
              exit 1
            fi
            echo "$1 carries the description $2 ships"
          }
          check "quirenote-backend-user-${ENVIRONMENT}" template-user.yaml
          # OFF THE DEPLOY'S OWN OUTCOME rather than a second copy of its condition: `main` ships
          # no archive, and a restated `!= 'main'` here is one edit away from comparing
          # production's tree against a stack `dev` deployed.
          [ "${{ steps.archive.outcome }}" != success ] || check quirenote-backend template.yaml
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      # LAST IN THIS JOB, AND THAT IS THE POINT: a plan read before `sam deploy` counts the
      # statements the PREVIOUS bundle carried, and would gate this run on them. It runs here
      # rather than in the gated job below because this job already holds the parent environment's
      # credentials, and because a plan contacts no object the migration owns.
      - name: Plan the migration
        id: plan
        uses: $/.github/actions/invoke-migration
        with:
          target: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          mode: dry-run

  # THE APPLY, AND NO HUMAN IN FRONT OF IT. A required reviewer here was written and removed: it
  # gates a whole ENVIRONMENT, so it lived in a `migrate-prod` of its own — `prod` also admits
  # `deploy-frontend.yml`, and a rule there would hold every release for a click. What retired it
  # is that the click carried no evidence: consent was spent before the rehearsal ran, on a
  # statement count, by the same person who had just fast-forwarded `main`. The gate is replaced
  # by the `notify` job below — a failure that reaches the task list beats a human asked to
  # approve one. [*User schema and deletes*]
  #
  # SKIPPED OUTRIGHT WHEN NOTHING IS PENDING, so a version cut carrying no schema deploys
  # untouched.
  migrate:
    needs: deploy
    # `!= '0'`, NOT A NUMERIC TEST, AND THE DIRECTION IS DELIBERATE: an output that failed to
    # resolve is the empty string, which this reads as "something might be pending" and runs. The
    # cost of being wrong that way is a rehearse and an apply that do nothing; the cost of the
    # other way is a schema change nobody notices, which is what this whole job ended.
    if: needs.deploy.outputs.pending != '0'
    runs-on: ubuntu-latest
    # TWO INVOCATIONS OF A RUNNER WITH NO CLIENT TIMEOUT. The action drops `--cli-read-timeout`
    # so a slow migration is never re-invoked, which leaves Lambda's own 900s as the only bound —
    # and Actions cannot see it. A hung invoke would otherwise hold this group, and a paid runner,
    # for the 360-minute default, blocking the very dispatch that would repair it.
    timeout-minutes: 45
    concurrency:
      # THE SAME STRING `migrate.yml` TAKES FOR THIS CLUSTER. Group names are repository-wide, so
      # an apply from here and a hand dispatch can never overlap on one database — the
      # serialisation DSQL cannot give, having no advisory locks.
      group: migrate-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false # never interrupt DDL in flight
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      # NO CHECKOUT: the SQL applied is the copy baked into the DEPLOYED bundle, not the ref. `$/`
      # is what keeps that true while still sharing one action — it resolves from this repository
      # at the commit the run is on, without a workspace.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # REHEARSE FIRST, ON THE TARGET CLUSTER, FROM THE SAME BUNDLE: a throwaway schema dropped
      # CASCADE. It stands in for the rollback DSQL does not have, and it is worth a second
      # invocation only because it runs against the database that is about to change.
      - uses: $/.github/actions/invoke-migration
        with:
          target: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          mode: rehearse

      - uses: $/.github/actions/invoke-migration
        with:
          target: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          mode: apply

  # THE SIGNAL THAT REPLACED THE REVIEWER, and the reason removing one was safe. Nobody watches an
  # automatic apply, and the two things that would otherwise carry the news are both weak: a red run
  # is an email governed by a personal notification setting this repository cannot read or test, and
  # a log expires. An issue is durable and is this repository's only task list.
  #
  # THE CONDITION IS READ OFF THE RESULTS, NOT `failure()`, and that is not style. GitHub documents
  # `failure()` as true "if any ancestor job fails" — `deploy` is an ancestor, and it runs the whole
  # suite, so a single failing unit test would have opened an issue claiming production was live
  # against an unmigrated schema when `sam deploy` had not run at all. The three clauses below say
  # exactly the state worth waking someone for: the stacks updated, and the schema did not follow.
  #
  # `!= success && != skipped` RATHER THAN `== failure`, because a job CANCELLED while pending on
  # `migrate-<target>` — which a hand dispatch can do — leaves the same state and is not a failure.
  # `skipped` is the healthy case: nothing was pending.
  #
  # A FAILED PLAN IS DELIBERATELY OUTSIDE THIS. It fails `deploy`, so the first clause excludes it —
  # the stacks did update, but no migration was attempted, nothing is half-applied, and a red deploy
  # is the ordinary signal for it. Widening to any red deploy is what would file an issue per broken
  # test and teach the channel to be ignored.
  notify:
    needs: [deploy, migrate]
    if: >-
      always() && needs.deploy.result == 'success' &&
      needs.migrate.result != 'success' && needs.migrate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REPLACES the workflow's grant for this job rather than adding to it: no `id-token`, no AWS,
    # nothing to write but the issue.
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ needs.migrate.result }}
        run: |
          # ONE OPEN ISSUE PER CLUSTER, commented rather than duplicated: a migration that fails
          # keeps failing on every later push, and three issues about one broken ledger is triage
          # work that hides the first report. The marker is invisible in the rendered body.
          marker="<!-- deploy-backend-migration-failure:${TARGET} -->"
          body=$(printf '%s\n\n@%s the schema did NOT follow the code on `%s` — the apply came back `%s`.\n\nBoth stacks updated and the new handlers are live on `%s`, so that cluster is running new code against its old schema. Expand/contract is what makes it survivable; it is not a state to leave.\n\n- Run: %s\n- Commit: `%s`\n- Report: the `migrate-%s-*` artifacts on that run carry `out.json`, one per mode.\n\n**Read the report before repairing — the mode that failed decides the repair.** A failed `rehearse` means the SQL itself was refused on a throwaway schema: fix the migration on a branch, and do NOT apply. A failed `apply` is resumable — dispatch `migrate.yml` with `target: %s`, `mode: apply`, since the ledger is keyed by statement hash and a re-run continues rather than restarting, which is what a half-applied file needs. If the report names a rehearsal schema that would not drop, drop `migrate_rehearsal_*` by hand first.\n' \
            "$marker" "$OWNER" "$TARGET" "$OUTCOME" "$TARGET" "$RUN_URL" "$SHA" "$TARGET" "$TARGET")
          # THE LIST API, NOT `--search`: search is an INDEX, minutes behind a just-created issue and
          # with a query grammar this marker is punctuation in. A miss here does not degrade, it
          # duplicates. `|| true` because the step runs under `bash -e`, where one 5xx on the lookup
          # would abort before either branch and lose the only durable signal the run leaves.
          existing=$(gh issue list --repo "$REPO" --state open --label area:infra --limit 100 \
            --json number,body --jq "[.[] | select(.body | contains(\"$marker\"))][0].number // empty" \
            || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "commented on #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create --repo "$REPO" \
              --title "Migration failed on $TARGET — the code is live and the schema is not" \
              --label bug --label area:infra --body "$body")
            echo "opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi
