name: Deploy backend

# Separate workflow from the frontend deploy, not a job inside it. The two have
# different blast radii, different IAM roles and different failure modes: a
# broken SPA build must never block the price capture, and a stack rollback must
# never hold up a UI fix. They also change on completely different cadences.
on:
  push:
    branches: [dev]
    paths:
      - 'infra/**'
      # NO EXCLUSION FOR THE DRAFT DDL, and that is the second answer to the
      # question. A51 first excluded `infra/migrations/drafts/**` here with a
      # negated pattern, to stop draft SQL that nothing applies from firing a
      # no-op `sam deploy`. Review found the trade was backwards:
      # `deploy-frontend.yml` already ignores `infra/**`, so a drafts-only push
      # matched NO workflow and ran no tests, no format:check and no lint —
      # recreating precisely the green-but-never-executed gap A50 closed in this
      # same file, and trading a wasted deploy for no gates at all.
      # The gates are worth more than the deploy slot. A no-op redeploy of an
      # unchanged bundle is accepted knowingly — including from a docs-only push,
      # now that `.github/**` and the root manifests are on this list. Suppressing
      # it properly means gating the Deploy step; that was tried and removed, and
      # the comment above that step says what each attempt got wrong.
      # The handler bundles the parser from src/core, so a parser change is a
      # backend change even though nothing under infra/ moved.
      - 'src/core/inzhur/**'
      - 'src/core/nbu/**'
      - 'src/core/dates.ts'
      # In the handler's TypeScript program via `import type` from dates.ts and
      # parse.ts — confirmed with `tsc -p infra --listFiles`. It matters because the
      # two tsconfigs disagree: the root has DOM + vite/client, infra has neither, so
      # a DOM type added here compiles green under `pnpm build` and breaks only the
      # infra program, which without this line no run would ever typecheck.
      - 'src/core/types.ts'
      # The bundle INLINES root dependencies — `parse.ts` imports `zod` and esbuild
      # embeds it — so a root bump changes the deployed Lambda's code. Without these
      # two, a Dependabot security bump of `zod` would deploy the frontend only and
      # leave the capture Lambda on the vulnerable version until some unrelated
      # infra/ push happened to redeploy it. The cost is a backend deploy on every
      # dependency change, most of which never reach the bundle; a silently stale
      # Lambda is the worse of the two.
      - 'package.json'
      - 'pnpm-lock.yaml'
      # `.github/**`, not just this file: a push adding `.github/README.md` is
      # skipped by deploy-frontend (`**/*.md`), so without this trigger NO workflow
      # would run on the one commit that replaces the repository's landing page.
      # The trigger is necessary and not sufficient — the guards also had to be
      # COVERED by a test step below, which is why that step runs the whole suite
      # rather than a path-filtered selection. Do not narrow it back to a list:
      # two earlier versions kept one by hand and both leaked (see there).
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never interrupt a CloudFormation update in flight

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable pnpm via corepack
        run: corepack enable

      # The app's own deps: the handler imports zod through src/core.
      - run: pnpm install --frozen-lockfile

      # npm, not pnpm, and deliberately so. pnpm's symlinked store left `pg`
      # unable to resolve its own transitive deps (pg-types, pg-protocol) when
      # esbuild bundled it on the runner. infra has three dependencies and is
      # not a workspace member, so pnpm buys nothing here while a flat
      # node_modules removes an entire class of resolution problem.
      - name: Install backend deps
        working-directory: infra
        run: npm ci

      # The parser is shared code, so its tests gate the backend too, and
      # `infra/src` carries the backend's own tests — including A50's
      # `order-by-alias` guard, which exists to stop a query shape that costs
      # DPU from reaching the live cluster. It had to be added here explicitly:
      # deploy-frontend runs `pnpm test` but SKIPS an infra-only push through
      # its `paths-ignore`, so before this line the infra tests ran in CI only
      # when an unrelated frontend commit happened to land beside them — green
      # but never executed on the commit that could break them. Same asymmetry,
      # same fix, as the `format:check` step below.
      # Runs before any AWS credential exists — a failing test cannot deploy.
      #
      # THE WHOLE SUITE, not a path-filtered selection: two hand-kept file lists
      # both leaked (an infra push once replaced the repo landing page with every
      # step green). The suite also guards `.github/` itself. `vite build` is not
      # run here, so a broken SPA build still never blocks the price capture.
      - run: pnpm test

      # A37 — `prettier --check .` covers infra/ too (its sources, their tests and
      # template.yaml), and deploy-frontend SKIPS an infra-only push through its
      # `paths-ignore`. Without this step unformatted infra lands on dev and the next
      # unrelated FRONTEND commit fails the gate on a file it never touched. Same
      # block, same reason: before any credential exists.
      - run: pnpm format:check

      # THE THIRD AND FOURTH INSTANCES OF THE SAME ASYMMETRY, closed together.
      # TYPECHECK: root `tsconfig.json` includes only `src`, `vite.config.ts` and
      # `scripts`, so `pnpm typecheck` never read infra/ and deploy-frontend skips
      # an infra-only push anyway — measured, a deliberate `const x: number = "s"`
      # in infra/src survived `pnpm typecheck` cleanly, esbuild stripped it, and it
      # would have deployed. `infra/tsconfig.json` existed the whole time and
      # nothing ran it.
      # LINT: `eslint .` does cover infra/ (10 source files), but only deploy-frontend runs
      # it and its `paths-ignore` contains `infra/**` — so an infra-only push was
      # never linted, and the next unrelated FRONTEND commit failed on a file it had
      # not touched. Exactly what the format:check step above was added for.
      # `pnpm exec`, not `npx`: infra/package.json declares neither `typescript` nor
      # `@types/node` (tsconfig asks for `types: ["node"]`), both resolving from the
      # ROOT pnpm tree. Bare `npx` outside that tree downloads whatever TypeScript is
      # latest and then fails on the missing node types — a failure that reads as
      # the caller's fault. The neighbouring bundle step pins for the same reason.
      # Both run before any credential exists, like the two above.
      - run: pnpm exec tsc --noEmit -p infra
      - run: pnpm lint

      # Bundled here rather than by `sam build`: both SAM builders copy the
      # CodeUri directory into a sandbox first, so `../../src/core` — the shared
      # parser the handler deliberately imports rather than duplicates — is not
      # present when they run. Running esbuild against the real checkout is the
      # only way to keep one parser and one source of truth.
      - name: Bundle the handler
        working-directory: infra
        run: |
          npx --yes esbuild@0.28.2 src/capture.ts \
            --bundle --platform=node --target=node22 --format=cjs \
            --outfile=dist/capture.js --sourcemap \
            --external:pg-native
          ls -la dist/

      # Catches what typecheck cannot: that the bundle actually LOADS. The first
      # deploy shipped an ESM bundle and died at runtime on `Dynamic require of
      # "events"` — pg is CommonJS, and `require` does not exist in ESM output.
      #
      # Run from a directory with no package.json, exactly like the Lambda zip:
      # infra/package.json declares "type": "module", which would make node read
      # the same file as ESM here and give a misleading result.
      - name: Smoke-test the bundle
        run: |
          mkdir -p /tmp/bundle-check
          cp infra/dist/capture.js /tmp/bundle-check/
          cd /tmp/bundle-check
          node -e "
            const m = require('./capture.js');
            if (typeof m.handler !== 'function') throw new Error('handler missing from bundle');
            // 22:00Z on the 11th is 01:00 Kyiv on the 12th: the scheduled firing,
            // and the instant where subtracting from the UTC date would silently
            // yield D-2. Both dates are asserted, and so is the fact that they
            // DIFFER — this step used to assert a single as_of and would have
            // passed happily through the whole eight days D71 had to repair.
            const run = new Date('2026-08-11T22:00:00Z');
            if (m.inzhurAsOf(run) !== '2026-08-12') {
              throw new Error('inzhurAsOf wrong: it must be the Kyiv date of the run (D71)');
            }
            if (m.nbuAsOf(run) !== '2026-08-11') {
              throw new Error('nbuAsOf wrong: it must be the previous Kyiv date (D71)');
            }
            if (m.inzhurAsOf(run) === m.nbuAsOf(run)) {
              throw new Error('the two as_of rules collapsed back into one (D71)');
            }
            console.log('bundle loads, handler present, both as_of rules correct');
          "

      # NO DEPLOY GATE HERE, AND THAT IS A DECISION RATHER THAN AN OMISSION.
      # `paths` now includes `.github/**` and the root manifests so the gates run on
      # those pushes, which means a prose edit under `.github/` assumes the deploy role
      # and runs `sam deploy`. A 79-line `changed` step was written to suppress that and
      # then removed, because every review round found another way for it to skip a
      # REAL deploy while reporting green:
      #   * it was inert — checkout is depth-1, so its range never resolved;
      #   * `^infra/` matched Markdown, so `infra/README.md` deployed anyway;
      #   * the workflow file itself, a bundle input, fell outside its matcher;
      #   * `|| true` swallowed grep's error exit as well as its no-match exit;
      #   * and finally: `concurrency` cancels PENDING runs, so a real infra push can be
      #     cancelled in the queue while the next run's push range no longer contains it
      #     — stack never updated, nothing red, a cancelled run reads as neutral.
      # The last one cannot be closed by a range at all; it needs a watermark of the
      # last SHA actually deployed. That is real state to keep, for a cost this file
      # already priced: `--no-fail-on-empty-changeset` makes an unchanged deploy a no-op.
      # **A silently skipped deploy is worse than a wasted one**, so the wasted one wins
      # until the wasted runs are actually a cost — the same sentence this file has
      # carried above `paths` since A50, now with the experiment behind it.

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # No `sam build` step — `sam deploy` packages CodeUri (dist/) as-is.
      - name: Deploy
        working-directory: infra
        run: |
          sam deploy \
            --stack-name quirenote-backend \
            --region "$AWS_REGION" \
            --s3-bucket "quirenote-sam-artifacts-${AWS_ACCOUNT_ID}" \
            --role-arn "arn:aws:iam::${AWS_ACCOUNT_ID}:role/quirenote-backend-cfn-exec" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
