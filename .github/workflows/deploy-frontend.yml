name: Deploy frontend

on:
  push:
    branches: [dev, main]
    # `paths-ignore` skips only when EVERY changed file matches. `docs/**` IS DELIBERATELY
    # ABSENT from it, and that absence is what keeps the API reference fresh: all of docs/ is
    # Markdown but docs/reference/openapi.json, which this build compiles the page FROM, so
    # `**/*.md` covers the rest and listing docs/ would ignore the one file that matters.
    # `src/api-docs-entry.test.ts` holds both halves.
    paths-ignore:
      - '**/*.md'
      # Separate stack, separate workflow, separate role: nothing under infra/ changes dist/.
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Keyed per BRANCH — the one workflow that cancels in flight, so a dev push must never take a
# production deploy with it.
concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: true

# READ-ONLY HERE. `id-token: write` sits on `deploy` alone, which runs no dependency code: any step
# of a job holding the grant can mint the token from the runner's environment, and the install,
# the suite, the lint and the build all run dependency code — so they run in `build`, which holds
# no token, and hand `deploy` the zip as an artifact kept one day. [*Deployment*]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # must match local Node

      - name: Enable pnpm via corepack
        run: corepack enable # honors packageManager: pnpm@11.10.0

      # THE SUITE BELOW REACHES infra/src, so its dependencies are this job's too: several test
      # files import the migration runner, which imports `pg`. One install covers it because
      # infra/ is a workspace member — `suite-needs-infra-deps.test.ts` holds that.
      - run: pnpm install --frozen-lockfile

      # Everything in this job runs with no AWS credential in reach, so a failing check cannot deploy.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build # already runs tsc --noEmit

      # Appended to dist/ on every branch but production: dev is behind Amplify's branch basic
      # auth and production carries none, so the page must be ABSENT from it, not unlinked.
      - if: github.ref_name != 'main'
        run: pnpm build:api-docs

      # On the bytes, not the recipe: the zip below takes whatever dist/ holds, unconditionally.
      - if: github.ref_name == 'main'
        name: Production carries no API reference
        run: test ! -f dist/api-docs.html

      - name: Zip the contents of dist
        run: cd dist && zip -qr ../dist.zip .

      # ONE DAY: the repository is public, so the artifact is readable while it is kept — a build
      # of a public source, no secret — and a day hands it between two jobs of one run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: dist.zip
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # THE ONE GRANT OF THE TOKEN, and the job runs no dependency code: it checks out the deploy
    # script, downloads what `build` made, and deploys. `contents: read` is restated because a
    # job-level block replaces the workflow's.
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://quirenote.com' || 'https://dev.quirenote.com' }}
    steps:
      # The deploy script and nothing that runs: `actions/checkout` executes no dependency code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The digest is verified on download by default.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Amplify and wait for the job
        run: ./scripts/deploy-amplify.sh dist.zip
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ github.ref_name }}

  # The headers live in public/customHttp.yml; this reads the live site back against it. A job of
  # its own because the check runs node on a dependency, which `deploy` must not: it takes the
  # environment for dev's secret and no token.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # must match local Node

      - name: Enable pnpm via corepack
        run: corepack enable # honors packageManager: pnpm@11.10.0

      - run: pnpm install --frozen-lockfile

      # Dev's basic-auth pair is a secret: GetBranch answers a transformed password that dev refuses.
      - name: Check the deployed security headers
        run: |
          if [ "$AMPLIFY_BRANCH" != main ] && [ -z "$BASIC_AUTH" ]; then
            echo "::error::the dev environment has no DEV_BASIC_AUTH secret (user:pass)"
            exit 1
          fi
          node scripts/check-headers.ts
        env:
          AMPLIFY_BRANCH: ${{ github.ref_name }}
          BASIC_AUTH: ${{ github.ref_name != 'main' && secrets.DEV_BASIC_AUTH || '' }}
          SITE: ${{ github.ref_name == 'main' && 'https://quirenote.com' || 'https://dev.quirenote.com' }}
