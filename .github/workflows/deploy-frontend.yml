name: Deploy frontend

on:
  push:
    branches: [dev, main]
    # `paths-ignore` skips only when EVERY changed file matches. `docs/**` IS DELIBERATELY
    # ABSENT from it, and that absence is what keeps the API reference fresh: all of docs/ is
    # Markdown but docs/reference/openapi.json, which this build compiles the page FROM, so
    # `**/*.md` covers the rest and listing docs/ would ignore the one file that matters.
    # `src/api-docs-entry.test.ts` holds both halves.
    paths-ignore:
      - '**/*.md'
      # Separate stack, separate workflow, separate role: nothing under infra/ changes dist/.
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Keyed per BRANCH — the one workflow that cancels in flight, so a dev push must never take a
# production deploy with it.
concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://quirenote.com' || 'https://dev.quirenote.com' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26 # must match local Node

      - name: Enable pnpm via corepack
        run: corepack enable # honors packageManager: pnpm@11.10.0

      - run: pnpm install --frozen-lockfile

      # THE SUITE BELOW REACHES infra/src, so its dependencies are this job's too: several test
      # files import the migration runner, which imports `pg` from infra/package.json, installed
      # by npm and never by the root pnpm tree. Without this the suite fails on a missing module.
      - name: Install backend deps
        working-directory: infra
        run: npm ci

      # Everything below runs before any AWS credential exists, so a failing check cannot deploy.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build # already runs tsc --noEmit

      # Appended to dist/ on every branch but production: dev is behind Amplify's branch basic
      # auth and production carries none, so the page must be ABSENT from it, not unlinked.
      - if: github.ref_name != 'main'
        run: pnpm build:api-docs

      # On the bytes, not the recipe: the zip below takes whatever dist/ holds, unconditionally.
      - if: github.ref_name == 'main'
        name: Production carries no API reference
        run: test ! -f dist/api-docs.html

      - name: Zip the contents of dist
        run: cd dist && zip -qr ../dist.zip .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Amplify and wait for the job
        run: ./scripts/deploy-amplify.sh dist.zip
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ github.ref_name }}
