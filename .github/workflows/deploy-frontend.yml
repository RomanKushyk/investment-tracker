name: Deploy frontend

on:
  push:
    # Two targets, one pipeline. `dev` deploys the integration branch to
    # dev.quirenote.com; `main` is production — quirenote.com — and moves only
    # when `dev` is fast-forwarded into it, which happens on a new stable version
    # (MAJOR, MINOR or PATCH) or on demand (D67). Production's cadence is the
    # release cadence, not a calendar.
    branches: [dev, main]
    # A docs-only commit cannot change dist/, so skip the deploy. A commit touching both
    # docs and code still runs — paths-ignore only skips when EVERY changed file matches.
    # To ship after a docs-only change anyway, use the workflow_dispatch below.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      # The backend is a separate stack with its own workflow and its own IAM
      # role. Nothing under infra/ can change dist/, so a backend-only commit
      # must not rebuild and redeploy the SPA.
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Always reflect the newest push: supersede an in-flight deploy rather than racing it.
# Keyed per BRANCH — a dev push must never cancel a production deploy in flight.
concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # AMPLIFY_APP_ID / AWS_REGION / AWS_FRONTEND_ROLE_ARN live in the environment's
    # scope, so each environment carries its own copies. The environment also
    # carries the deployment-branch policy that stops any other branch from
    # deploying to it, and it is what the role's OIDC `sub` claim names.
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://quirenote.com' || 'https://dev.quirenote.com' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26 # must match local Node

      - name: Enable pnpm via corepack
        run: corepack enable # honors packageManager: pnpm@11.10.0

      - run: pnpm install --frozen-lockfile

      # Quality gate — everything below runs before any AWS credential exists,
      # so a failing check can never deploy.
      - run: pnpm lint
      # A37 — the formatter joins the gate now that it can actually pass. It
      # could not before: `endOfLine` was unset, so on a Windows checkout with
      # `core.autocrlf=true` prettier compared LF output against CRLF files and
      # failed all 245 of them on line endings alone. `.prettierignore` keeps it
      # off the merged drawings (D14) and the hand-formatted docs.
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build # already runs tsc --noEmit

      - name: Zip the contents of dist
        run: cd dist && zip -qr ../dist.zip .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Amplify and wait for the job
        run: ./scripts/deploy-amplify.sh dist.zip
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          # The Amplify branch is named after the git branch on purpose: one
          # name to reason about, and nothing to keep in sync by hand.
          AMPLIFY_BRANCH: ${{ github.ref_name }}
